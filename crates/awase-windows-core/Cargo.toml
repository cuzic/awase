[package]
name = "awase-windows-core"
version = "2.2.0"
edition = "2021"
description = "awase-windows の OS 非依存な核(IME 状態の判断・型・表)。windows crate に依存しない(ADR-229 D4)"
publish = false

[lib]
name = "awase_windows_core"
path = "src/lib.rs"

# この crate は windows crate に依存しない(`crate_does_not_depend_on_windows` が固定する)。
[dependencies]
awase = { path = "../.." }
awase-gji-config = { path = "../awase-gji-config" }
awase-vkmap = { path = "../awase-vkmap" }
awase-keymap-learn = { path = "../awase-keymap-learn" }
measured-macro = { path = "../measured-macro" }
actuation-choke-point-macro = { path = "../actuation-choke-point-macro" }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
strum = { version = "0.27", features = ["derive"] }
quanta = "0.12"

[features]
# 殻の crate（`awase-windows`）のテストが使う、テスト専用の口（`set_desired_open_for_test` など）。本番では有効にしない。
testing = []

[dev-dependencies]
proptest = "1.11.0"
# journal 再生 fixture のハーネス(ADR-229)。非公開の dev 専用 crate。
awase-replay = { path = "../awase-replay" }
toml = "0.8"

[lints]
workspace = true
