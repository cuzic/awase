[package]
name = "awase-bug-report"
version = "2.2.0"
edition = "2021"
description = "不具合報告（トレイの『不具合を報告』）のペイロードの組み立て・サイズの縮め・再送計画・gzip（OS 非依存、ADR-095・ADR-274）。windows crate に依存しない"
publish = false

[lib]
name = "awase_bug_report"
path = "src/lib.rs"

# この crate は windows crate に依存しない(`core_crates_do_not_depend_on_windows` が固定する)。
[dependencies]
awase = { path = "../.." }
awase-gji-config = { path = "../awase-gji-config" }
awase-windows-core = { path = "../awase-windows-core" }
awase-keymap-learn = { path = "../awase-keymap-learn" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
flate2 = "1"
base64 = "0.22"

[lints]
workspace = true
