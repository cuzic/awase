[package]
name = "awase-settings"
version = "2.2.0"
edition = "2024"

[[bin]]
name = "awase-settings"
path = "src/main.rs"

[build-dependencies]
awase-build-support = { path = "../awase-build-support" }

[features]
# 既定で有効＝配布物（release.yml）は従来どおり wgpu フォールバック込み。
# PR の CI の windows-settings は --no-default-features で wgpu 一式
# （wgpu-core/hal・naga・gpu-allocator 等）のコンパイルを省く。有効時の
# ビルドとテストは push to develop/main の CI（windows-settings-full）で検証する。
default = ["wgpu-fallback"]
wgpu-fallback = ["dep:awase-settings-wgpu"]

[dependencies]
awase = { path = "../.." }
awase-windows = { path = "../awase-windows" }
awase-keymap-learn = { path = "../awase-keymap-learn" }
eframe = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
pollster = "0.4"
rfd = "0.17.2"
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
awase-keymap-learn-win = { path = "../awase-keymap-learn-win" }
# Glow(OpenGL)でのウィンドウ生成が失敗した環境向けの wgpu フォールバック
# レンダラー（startup_failure::run_with_fallback 参照）。eframe の "wgpu"
# feature を [dependencies] 側で無条件に有効化すると、非 Windows でも eframe の
# 既定 renderer が Wgpu に変わってしまうため、Windows ターゲット限定にする。
# feature で外せるように、wgpu/egui-wgpu/eframe の "wgpu" は薄い crate に
# 包んで optional にしてある（同じ crate を別名で二重宣言するのは Cargo が
# 許さない）。
awase-settings-wgpu = { path = "../awase-settings-wgpu", optional = true }
# eframe::Error::Glutin の中身（glutin::error::ErrorKind）を具体的に判別し、
# 起動失敗ダイアログの文言を実際の原因（opengl32.dll 読み込み失敗等）に
# 応じて出し分けるための直接依存。バージョンは eframe 0.31.1 が要求する
# glutin 0.32 系と一致させ、Cargo のバージョン統一により同一の型として
# 扱えるようにする。
# コードレビュー指摘: 以前は egui_glow::PainterError も同じ理由で追加して
# いたが、実際には eframe::Error::OpenGL(e) の e を .to_string() で比較する
# だけで egui_glow の型を名指しする箇所が無く（Display 経由なので型を
# import しなくても呼べる）、コンパイルが通る未使用の直接依存になって
# いたため削除した。
glutin = { version = "0.32", default-features = false }
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    # CreateMutexW（update_check.rs）の SECURITY_ATTRIBUTES 引数。以前は wgpu 系の
    # 依存が windows crate の同 feature を有効にしていたことに頼っていた。
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "allow"
