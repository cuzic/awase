[package]
name = "awase-windows-base"
version = "2.2.0"
edition = "2021"
description = "awase-windows の OS 非依存な核の土台: 定数・仮想キー・キーマップ表・世代・時計・IME 種別・アプリ分類の型(ADR-274)。windows crate に依存しない"
publish = false

[lib]
name = "awase_windows_base"
path = "src/lib.rs"

# この crate は windows crate に依存しない(`core_crates_do_not_depend_on_windows` が固定する)。
[dependencies]
awase = { path = "../.." }
awase-gji-config = { path = "../awase-gji-config" }
awase-vkmap = { path = "../awase-vkmap" }
measured-macro = { path = "../measured-macro" }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
tracing = "0.1"

[features]
# 上位の crate のテストが使う、テスト専用の口（`FocusGen::new` など）。本番では有効にしない。
testing = []

[dev-dependencies]
toml = "0.8"

[lints]
workspace = true
