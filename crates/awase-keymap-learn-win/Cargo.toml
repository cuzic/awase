[package]
name = "awase-keymap-learn-win"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Windows実機でIMEキー効果を学習する独立プロセス (ADR-195)"
publish = false

[dependencies]
anyhow = "1"
awase = { path = "../.." }
awase-keymap-learn = { path = "../awase-keymap-learn" }
awase-windows = { path = "../awase-windows" }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
