name: e2e-ime (feasibility)

# 実機E2E(GJI ATOK × awase、tools/e2e/ime_key_matrix)を GitHub-hosted の Windows ランナーで回せるかの
# 実現可能性確認。ci/e2e-ime ブランチへの push と手動起動でだけ動く(通常のCIには影響しない)。
on:
  push:
    branches: [ci/e2e-ime]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ビルドは1回だけ(以後の行列ジョブが成果物を使い回す)。cargo は Swatinem/rust-cache でキャッシュ。
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: awase とスパイクをビルド
        shell: pwsh
        run: |
          cargo build -p awase-windows --bin awase
          cargo build -p awase-windows --example ime_key_matrix_spike
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\debug\awase.exe dist\
          Copy-Item target\debug\examples\ime_key_matrix_spike.exe dist\
          Copy-Item config.toml dist\ -ErrorAction SilentlyContinue
          Get-ChildItem dist | Select-Object Name, Length | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-binaries
          path: dist

  e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-binaries
          path: dist

      # 他の方法: winget install --id Google.JapaneseIME(71秒) / scoop bucket add nonportable; scoop install google-japanese-input-np
      - name: Google 日本語入力をインストール(chocolatey)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          choco install googlejapaneseinput -y --no-progress 2>&1 | Select-Object -Last 4
          "gji install: $([int]$sw.Elapsed.TotalSeconds)s"
          "TIP_REGISTERED=$(Test-Path 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}')"

      - name: 入力言語をja-JP + GJI に設定(既定の入力メソッドもGJIに)、ATOK プリセットの config1.db を書く
        shell: pwsh
        run: |
          $googleImeTip = '0411:{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}{773EB24E-CA1D-4B1B-B420-FA985BB0B80D}'
          $l = New-WinUserLanguageList ja-JP
          $l[0].InputMethodTips.Clear()
          $l[0].InputMethodTips.Add($googleImeTip)
          Set-WinUserLanguageList $l -Force 2>&1
          try { Set-WinDefaultInputMethodOverride -InputTip $googleImeTip -ErrorAction Stop; 'default input method override: OK' }
          catch { "default input method override FAILED: $($_.Exception.GetType().Name): $($_.Exception.Message)" }
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Get-WinDefaultInputMethodOverride 2>&1
          # ATOK プリセット(session_keymap = 1): Mozc Config の field 41 (varint) = 1 だけの最小の config1.db
          $dir = Join-Path $env:USERPROFILE 'AppData\LocalLow\Google\Google Japanese Input'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dir 'config1.db'), [byte[]](0xC8,0x02,0x01))
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          Get-Process ctfmon, explorer -ErrorAction SilentlyContinue | Format-Table Name, Id, SessionId

      - name: awase を起動(AWASE_TEST_INJECTION=1、gji_thumb_key_ime_toggle=true)
        shell: pwsh
        run: |
          $cfg = Get-Content dist\config.toml -Raw
          if ($cfg -match 'gji_thumb_key_ime_toggle *= *(true|false)') { $cfg = $cfg -replace 'gji_thumb_key_ime_toggle *= *(true|false)','gji_thumb_key_ime_toggle = true' }
          else { $cfg = $cfg -replace '(?m)^\[general\]\s*$', "[general]`r`ngji_thumb_key_ime_toggle = true" }
          [IO.File]::WriteAllText("$PWD\dist\config.toml", $cfg, (New-Object Text.UTF8Encoding($false)))
          $env:RUST_LOG = 'debug'
          $env:AWASE_TEST_INJECTION = '1'
          Start-Process -FilePath "$PWD\dist\awase.exe" -WorkingDirectory "$PWD\dist" -RedirectStandardError "$PWD\awase-stderr.log" -RedirectStandardOutput "$PWD\awase-stdout.log"
          Start-Sleep -Seconds 5
          Get-Process awase -ErrorAction SilentlyContinue | Format-Table Name, Id, SessionId

      - name: スパイク --auto を実行
        shell: pwsh
        run: |
          Set-Location dist
          Start-Process -FilePath .\ime_key_matrix_spike.exe -ArgumentList '--auto --hold=180 --activate-gji'
          $deadline = (Get-Date).AddSeconds(150)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if ((Test-Path ime_key_matrix_spike.log) -and (Select-String -Path ime_key_matrix_spike.log -Pattern '全手順完了' -Quiet)) { break }
          }
          if (Test-Path ime_key_matrix_spike.log) { Get-Content ime_key_matrix_spike.log -Encoding utf8 | Select-String -Pattern 'init\]|AUTO|KEY \[SCRIPT' | Select-Object -First 30 | ForEach-Object { $_.Line.Substring(0,[Math]::Min(150,$_.Line.Length)) } }
          else { 'spike log なし' }

      - name: 判定(check.py)
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Get-ChildItem -Recurse -Filter awase.log -ErrorAction SilentlyContinue | Select-Object -First 1
          "awase.log: $($log.FullName)"
          Get-Process awase, ime_key_matrix_spike -ErrorAction SilentlyContinue | Format-Table Name, Id
          if ($log) {
            Get-Content $log.FullName -Encoding utf8 | Where-Object { $_ -match 'Engine (de)?activated|IME open axis delegated|outcome=Unwarranted' } | Set-Content awase-filtered.log -Encoding utf8
            python tools\e2e\ime_key_matrix\check.py dist\ime_key_matrix_spike.log awase-filtered.log
          } else { 'awase.log が見つからない(awase の起動に失敗した可能性)' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: |
            dist/ime_key_matrix_spike.log
            awase-stderr.log
            awase-stdout.log
            awase-filtered.log
            **/awase.log
