name: e2e-ime

# 実機E2E(GJI ATOK × awase、tools/e2e/ime_key_matrix)を GitHub-hosted の Windows ランナーで回す。
# 撤去実験(ablations/aN-*.sh)を構成ごとに並列ジョブへ展開し、各構成を RUNS 回ずつ実行して
# 期待(expect)どおりの結果になるかを最後の summary ジョブで集計する(ADR-186)。
#
#   build(構成ごと) → e2e(構成×回数) → summary
#
# 通常のCI(ci.yml)には影響しない。ci/e2e-ime ブランチへの関連ファイルの push と手動起動でだけ動く。
# ci/e2e-scenarios ブランチへの push は、操作シナリオ(名前が sc- で始まる構成、下のplan参照)だけを回す。
# ci/e2e-calibration ブランチへの push は、ADR-191 の学習/検証ラウンド(名前が cal- で始まる構成)だけを回す。
# ci/e2e-typing-stress ブランチへの push は、高速打鍵ストレス(名前が ts- で始まる構成、examples/typing_stress/)だけを回す。
# ci/e2e-java-office ブランチへの push は、宣言表 tools/e2e/input_forms/forms.toml の入力先(Java・Office 等、名前が tsx-ext- で始まる構成)だけを回す。
# 実アプリ(Chrome・不具合報告フォーム)を入力先にする/摂動を足す拡張構成は tsx- で始まる。重いので既定では回さず、only='tsx-*' で回す。
# (workflow_dispatch は既定ブランチにワークフローが無いと使えないので、構成を絞るには only 入力かこのブランチを使う)
#
# awase を起動する構成では、期待表(expect/rc)とは別に、ログの不変条件(異常検出器、check_invariants.py と
# invariant_limits.json)も数えて summary に別の表で出す。既定では情報のみで、期待表の判定(終了コード)は変えない。
# e2e-ime-smoke.yml(PR ゲート)は workflow_call で gate_mode=invariants を渡し、不変条件だけで合否を決める。
on:
  workflow_call:
    inputs:
      only:
        description: '実行する構成名(workflow_dispatch の only と同じ書式)'
        type: string
        required: false
        default: ''
      runs:
        description: '各構成の実行回数の上書き(空なら構成ごとの runs)'
        type: string
        required: false
        default: ''
      gate_mode:
        description: "summary の合否: ''=期待表(expect/rc)で決める(既定) / 'invariants'=不変条件だけで決める(期待表は表示のみ)"
        type: string
        required: false
        default: ''
  push:
    branches: [ci/e2e-ime, ci/e2e-scenarios, ci/e2e-calibration, ci/e2e-typing-stress, ci/e2e-java-office, fix/bug189-most-recent-trusted]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tools/e2e/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/e2e-ime.yml'
  workflow_dispatch:
    inputs:
      only:
        description: '実行する構成名(カンマ区切り、空なら全構成、末尾*は前方一致)。例: baseline,a5-no-refresh20,sc-*'
        required: false
        default: ''

# smoke ゲート(下の gate ステップ)が同じ run のジョブ一覧を読むため actions: read が要る。
permissions:
  contents: read
  actions: read

# 同じ ref への push が続いたとき、古い run(重複実行)を止める。
# ただし ci/e2e-calibration では、小さな push(README・スクリプトの修正)で走行中の長い(最大55分の)学習ジョブ群を
# 全部キャンセルしないよう、cancel-in-progress を無効にする。
concurrency:
  group: e2e-ime-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'ci/e2e-calibration' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.p.outputs.configs }}
      builds: ${{ steps.p.outputs.builds }}
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: python
        env:
          ONLY: ${{ inputs.only || (github.ref_name == 'ci/e2e-scenarios' && 'sc-*') || (github.ref_name == 'ci/e2e-calibration' && 'cal-*') || (github.ref_name == 'ci/e2e-typing-stress' && 'ts-*') || (github.ref_name == 'ci/e2e-java-office' && 'tsx-ext-*,tsx-raw-ext-*') || (github.ref_name == 'fix/bug189-most-recent-trusted' && 'tsx-ext-flutter-*,tsx-ext-libreoffice-*,tsx-ext-wx-*,tsx-ext-qt-*,tsx-ext-wf-textbox-*') || '' }}
          # ONLY が空(ci/e2e-ime への push、workflow_dispatch の only 空)のときは cal-*(学習/検証ラウンド。47構成・計 約24.7時間ぶんの上限時間)と ts-*(高速打鍵ストレス)・tsx-*(その拡張)を除く。
          # cal-* を走らせるには only='cal-*' を渡すか、ci/e2e-calibration ブランチを使う。
          EXCLUDE_CAL_WHEN_EMPTY: '1'
          # workflow_call の runs 入力(空なら構成ごとの runs のまま)
          RUNS: ${{ inputs.runs || '' }}
        run: |
          import fnmatch, json, os, sys
          # name: 構成名 / bin: 使うビルド成果物(撤去なしの構成は baseline を使い回す) / mutator: ablations/ 下のスクリプト
          # (空=変更なし) / args: スパイクの追加引数
          # keymap: GJI の session_keymap(1=ATOK, 2=MS-IME) / custom_table: config1.db に古い custom_keymap_table
          # (変換=IMEOn)を残すか / check: expect=ATOK前提の期待表(check.py)、consistency=プリセット非依存で
          # 「実IMEのかな=Engine ON、英数・直接入力=Engine OFF」に追随するか(check_consistency.py、--walk)、
          # collect=判定せずログを回収し、「実行できなかった」(GRID-ABORT・完走マーカー無し・KEY 行0件)だけを rc=3=INVALID にする(cal-* 用。expect=observe と組み合わせる。解析はローカル)
          # expect: pass=全回PASS / fail=撤去や設定で壊れる(既知の問題を固定) / observe=結果を表に出すだけ(不安定・未確定の観測用)
          # until: observe 構成の期限(YYYY-MM-DD)。observe は何も止めないので放置されやすい。新しい observe は until を必ず付け、期限までに
          # pass(安定)/ fail(再現を固定、BUG と対応)/ 削除のどれかに決める。期限切れは test_e2e_plan.py が赤にする。
          # 既存の observe は observe_grandfathered.txt に載せてあり(縮める方向にだけ動かす)、observe_audit.py が一覧する。
          # summary は有効回が 2 回以上で全PASS なら『pass昇格候補』、全FAIL なら『fail固定候補』と出す。
          # ime: gji=Google日本語入力(chocolatey) / msime=Microsoft IME(標準の日本語IME)
          # 撤去実験の根拠は docs/adr/186-*.md。a3(eisu reset抑止)は撤去済みのため無い。
          # keys: config.toml の [keys] に足す/上書きする行(;区切り)。[keys] が無ければ末尾に作る
          # general: config.toml の [general] に足す/上書きする行(;区切り)。例: 'half_width_alnum_toggle = "all"'
          def cfg(name, expect, mutator='', args='', keymap=1, custom_table='false', check='expect', bin=None, ime='gji', awase='true', cache='works', runs=3, wait=330, gate='', general='', probe='', probe_bin='compartment_notify_probe', legacy_custom='false', stress='', keys='', tsv='', chrome='', checkargs='', until='', setup='', prepare=''):
            return dict(name=name, bin=bin or (name if mutator else 'baseline'), mutator=mutator, args=args,
                        keymap=keymap, custom_table=custom_table, check=check, expect=expect, ime=ime, awase=awase, cache=cache, runs=runs, wait=wait, gate=gate, general=general, probe=probe, probe_bin=probe_bin, legacy_custom=legacy_custom, stress=stress, keys=keys, tsv=tsv, chrome=chrome, checkargs=checkargs, until=until, setup=setup, prepare=prepare)
          # tsx-* 構成(高速打鍵ストレスの拡張): name は 'tsx-' を自動で付ける。raw=True なら awase なしの対照(生ローマ字)。
          # extra は typing_stress.exe への追加フラグ(摂動など)。kinds/trials/len は省略すると typing_stress の既定。
          def tsx(name, form, ime, iv, raw=False, extra='', kinds='', trials=None, len=None, runs=3, wait=900):
            flags = [f'--form={form}', f'--interval={iv}']
            if raw: flags += ['--mode=raw', '--no-awase']
            if kinds: flags.append(f'--kinds={kinds}')
            if trials: flags.append(f'--trials={trials}')
            if len: flags.append(f'--len={len}')
            if extra: flags.append(extra)
            # 実アプリは描画が 1200ms に間に合わないことがある。遅延と消失を分けるため、内容が安定するまで読み直す。
            flags.append('--settle-read')
            flags.append('--layout=@REPO@/layout/nicola_keytop.yab')
            if ime == 'msime': flags.append('--msime')
            return cfg(f"tsx-{'raw-' if raw else ''}{name}", 'observe', check='typing', ime=ime, awase='false' if raw else 'true', runs=runs, wait=wait, stress=' '.join(flags))
          # tsx-susp-*(typing_stress の suspend.rs): GJI の変換サーバ(GoogleIMEJaConverter)を打鍵の途中で一時停止して応答を遅らせ、
          # 時間窓系の BUG(BUG-171 の途中の語の StaleConfirm→ESC 等)を実機で当てにいく。判定は typing(消失/リテラル化の分類)、
          # 効いたかは typing_stress.log の type:"suspend"(matched の PID・status)と awase.log の StaleConfirm/delay で見る(tools/e2e/ime_key_matrix/suspend_report.py)。
          # 対照(control)は同じ打鍵で停止なし。only='tsx-susp-*' で回す(既定の only 空・sc-* には含まれない)。observe は期限(until)付き。
          # survey=True: 止めずに、打鍵中のプロセス・窓(IME 関連)を type:"suspend_survey" で記録するだけ(止める対象の調査。--suspend-survey)。
          def susp(name, form, at_ms=None, dur_ms=None, proc='GoogleIMEJaConverter', iv=30, runs=3, survey=False):
            flags = [f'--form={form}', f'--interval={iv}', '--kinds=single,mixed', '--trials=6', '--len=25', '--settle-read',
                     '--layout=@REPO@/layout/nicola_keytop.yab']
            if survey:
              flags += ['--suspend-survey', '--suspend-at-ms=300']
            if at_ms is not None:
              flags += [f'--suspend-proc={proc}', f'--suspend-at-ms={at_ms}', f'--suspend-ms={dur_ms}']
            return cfg(f'tsx-susp-{name}', 'observe', check='typing', ime='gji', awase='true', runs=runs, wait=1500,
                       stress=' '.join(flags), until='2026-11-04')
          SC_IMES = [('msime-native', 'msime', 1, ' --msime'), ('gji-msime', 'gji', 2, ''), ('gji-atok', 'gji', 1, '')]
          # sc-keymatrix-*(ADR-208 L3b): 「ずれの作り方 × 明示キー」行列(判定は check_keymatrix.py)。expect=pass(MS-IME × 実 Chrome の abs/tog だけは同 job に fresh 対照が無く例外セルが STUCK になるので observe、対照は e2・e2-tog が担う)。1構成=1ジョブで、セルごとに内部10試行。
          # セルの書式 `<key>=<kind>:<gap>`: key=VK の16進(ctrl+ 前置でマーカー付き注入の物理 Ctrl 付き) / kind=on・off・tog / gap=sync・close・open・fresh。
          # 既定の sc-* や only='sc-*' には含めない(下の plan の除外)。only='sc-keymatrix-*' か完全一致で回す。
          # keys: abs=絶対キー用(Ctrl+変換/Ctrl+無変換に加えて、無変換/変換の単独タップを bare の keys.ime_off/ime_on にする=ADR-206 の役割由来)、
          #       tog=無変換の単独タップを keys.ime_toggle にする(トグルの検証用。0xF3/0x19 は IME/awase の shadow トグルで設定不要)。
          KM_KEYS = dict(abs='ime_on = ["Ctrl+変換", "VK_CONVERT"]; ime_off = ["Ctrl+無変換", "VK_NONCONVERT"]', tog='ime_toggle = ["VK_NONCONVERT"]')
          def km_cells(grp, msime):
            if grp == 'abs':
              c = ['ctrl+1c=on:close', 'ctrl+1d=off:open', 'ctrl+1c=on:sync', 'ctrl+1d=off:sync', '1c=on:close', '1d=off:open', '16=on:close', '1a=off:open']
              return c + (['f2=on:close'] if msime else [])
            return ['1d=tog:sync', '1d=tog:close', '1d=tog:open', 'f3=tog:close', 'f3=tog:open', '19=tog:close', '19=tog:open']
          def km(name, win, ime_name, cells, grp, wait=1800, expect='pass'):
            msime = ime_name == 'msime'
            common = dict(ime='msime' if msime else 'gji', keymap=2 if (msime and win == 'chrome') else 1, runs=1, wait=wait, keys=KM_KEYS[grp], check='keymatrix')
            cs = ','.join(cells)
            if win == 'chrome':
              return cfg(name, expect, chrome=f"--keymatrix={cs} --settle=800{' --msime' if msime else ''}", **common)
            return cfg(name, expect, stress=f"--form={win} --mode=keymatrix --km-cells={cs} --layout=@REPO@/layout/nicola_keytop.yab{' --msime' if msime else ''}", **common)
          configs = [
            # --- 撤去実験(ATOK、実機E1〜E7bと同じ) ---
            cfg('baseline', 'pass'),
            cfg('baseline-henkan', 'pass', args='--key=henkan', custom_table='true'),
            cfg('a4-no-eisu-reset', 'pass', mutator='a4-no-eisu-reset.sh'),
            cfg('a5-no-refresh20', 'fail', mutator='a5-no-refresh20.sh'),
            cfg('a6-no-idle-check', 'pass', mutator='a6-no-idle-check.sh'),
            # --- プリセット/設定の確認(ビルドは baseline、consistency 判定) ---
            # フォーカス直後(意図なし)にいきなり無変換/変換を押す(--cold=先頭のひらがなを除く)
            cfg('atok-passthrough-cold', 'pass', check='consistency', args='--walk --cold'),
            cfg('atok-passthrough-henkan-cold', 'pass', check='consistency', args='--walk --cold --key=henkan'),
            # 半角/全角(0xF3/0xF4、GJIではどちらも開閉トグル)。awaseがVKで方向を決め打つとずれる(ADR-186決定5、ADR-189)
            cfg('msime-hz', 'pass', check='toggle', args='--hz', keymap=2),
            cfg('atok-hz', 'pass', check='toggle', args='--hz'),
            # リセット操作(Ctrl+無変換→Ctrl+変換 / 逆)で必ず揃うか(--resync)
            cfg('atok-resync', 'observe', check='resync', args='--resync'),
            cfg('atok-resync-gap40', 'observe', check='resync', args='--resync --resync-gap=40'),
            cfg('atok-resync-gap300', 'observe', check='resync', args='--resync --resync-gap=300'),
            cfg('atok-passthrough', 'pass', check='consistency', args='--walk'),
            cfg('atok-passthrough-henkan', 'pass', check='consistency', args='--walk --key=henkan'),
            cfg('msime', 'pass', check='consistency', args='--walk', keymap=2),
            # --- Microsoft IME 本体(GJI を入れず、ja-JP の言語を追加して標準の日本語IMEを使う) ---
            cfg('msime-native', 'observe', check='consistency', args='--walk --msime', ime='msime'),
            cfg('msime-native-henkan', 'observe', check='consistency', args='--walk --msime --key=henkan', ime='msime'),
            # 対照実験: awase を起動せず、同じキー列で実IMEだけを見る(実IMEの推移がawaseのせいかCI環境の癖かを分ける)
            cfg('msime-native-noawase', 'observe', check='consistency', args='--walk --msime', ime='msime', awase='false'),
            cfg('atok-noawase', 'observe', check='consistency', args='--walk', awase='false'),
            # --- ひらがなキーの正しいVK調べ(--vkprobe、awaseなし) ---
            cfg('probe-vk-gji-atok', 'observe', check='vkprobe', args='--vkprobe', awase='false'),
            cfg('probe-vk-gji-msime', 'observe', check='vkprobe', args='--vkprobe', keymap=2, awase='false'),
            cfg('probe-vk-msime-native', 'observe', check='vkprobe', args='--vkprobe --msime', ime='msime', awase='false'),
            # --- ADR-191 の検証ラウンド(ci/e2e-calibration ブランチ。check='collect'=判定せずログを回収し、「実行できなかった」(GRID-ABORT・完走マーカー無し・KEY 行0件)だけを rc=3=INVALID にする。cal-verify-* は打鍵時予測を持つ awase のビルドで意味を持つ) ---
            # walk: 撤去ブランチ(打鍵時予測ビルド)+ AWASE_TEST_INJECTION=1 でランダムなキー列を流し、Engine と実IMEのずれを
            # ローカルで解析する(effect_learning.py --drift、DRIFT_OFF=100/400/1500)。cache=works は観測あり、
            # cache=unavailable は awase が IME を読めないアプリ相当(スパイク窓を「IMM不可」に固定)で、予測だけが Engine を動かす。
            *[cfg(f'cal-verify-{kind}-s{seed}', 'observe', check='collect', cache=cache, runs=1,
                  args=f'--walk=100 --seed={seed}')
              for kind, cache in (('obs', 'works'), ('blind', 'unavailable')) for seed in (1, 2)],
            cfg('cal-walk-noawase-s5', 'observe', check='collect', awase='false', runs=1, args='--walk=100 --seed=5'),
            # --- ADR-191 学習ラウンド 第1版(cal-grid-*): 状態を IMM で書いて作る。**学習に使ってはいけない**(IMM で書いた変換モードは、キーで入った状態と別物で、ATOK のひらがなが「不変」と誤学習される。比較・経緯の記録用。学習は cal-gridk3-* / cal-fast-* / cal-notify-*)。 ---
            # (状態: 開閉×入力モード×入力中の段階=30状態を IMM で決定的に作り、キーの効果を格子状に網羅する)
            # (awase なし=IME単体の効果。--grid=シャード、キーのグループで4分割。プリセット ATOK=keymap 1 / MS-IME=keymap 2)
            # cal-grid-smoke は動作確認用(各セル1回)。所要は約 20〜35 分/シャード(wait=秒)。
            cfg('cal-grid-smoke', 'observe', check='collect', awase='false', runs=1, wait=1500, args='--grid=s4 --grid-trials=1'),
            *[cfg(f'cal-grid-{pre}-{sh}', 'observe', check='collect', awase='false', runs=1, wait=3300, keymap=km,
                  args=f'--grid={sh}')
              for pre, km in (('atok', 1), ('msime', 2)) for sh in ('s1', 's2', 's3', 's4')],
            # 第3版: 全ての状態をキーだけで作る(--grid-setup=keys。リセットも IMM を使わず、観測しながら IME_ON/ひらがなで(開,0x19)へ戻す)。
            # 第2版(リセットだけ IMM=--grid-setup=keys-immreset)は、IMM で書いた 0x19 が GJI の内部状態と食い違い、モード切替キーの結果が実際と違った。
            # smoke は受け入れ基準の確認用: ATOK s1(ひらがな 0x19→0x10、0x10→0x19)、MS-IME s2(カタカナ 0x19→0x1B)。
            cfg('cal-gridk3-smoke-atok', 'observe', check='collect', awase='false', runs=1, wait=1800, keymap=1,
                args='--grid=s1 --grid-setup=keys --grid-trials=1'),
            cfg('cal-gridk3-smoke-msime', 'observe', check='collect', awase='false', runs=1, wait=1800, keymap=2,
                args='--grid=s2 --grid-setup=keys --grid-trials=1'),
            *[cfg(f'cal-gridk3-{pre}-{sh}', 'observe', check='collect', awase='false', runs=1, wait=3300, keymap=km,
                  args=f'--grid={sh} --grid-setup=keys --grid-trials=2')
              for pre, km in (('atok', 1), ('msime', 2)) for sh in ('s1', 's2', 's3', 's4')],
            # 高速化の検証(ci/e2e-calibration): 固定待ちを縮める --fast(+1500ms の観測を省く) と --speed=K(手順間の待ちをK倍速)。
            # 既存 CI ログ584押下で、(開閉,変換モード,入力中,入力欄末尾) は +100ms と +1500ms で 99.8% 一致(唯一の例外は次試行の準備操作の混入)。
            # cal-gridk3-atok-s1(遅い版)と同じ入力(--grid=s1 --grid-trials=2)で、所要時間と grid_learn.py --at=400 のセル表を比べる。
            *[cfg(f'cal-gridk3-fast-atok-s1-sp{k}', 'observe', check='collect', awase='false', runs=1, wait=1800, keymap=1,
                  args=f'--grid=s1 --grid-setup=keys --grid-trials=2 --fast --speed={k}')
              for k in (2, 4)],
            # --- ADR-191/193: 格子の待ちを compartment 変更通知の購読に置き換えられるか(ci/e2e-calibration) ---
            # cal-notify-probe-*: 前面化の失敗(WM_SETFOCUS 未処理)を直した診断コピー compartment_notify_probe_diag(awase なし)で、キー→NOTIFY/POLL の遅延を測る(ATOKのみ、gap=1500/600)。
            # 本体の compartment_notify_probe は ADR-193 の成果物で、CI では前面化に失敗して ABORT(キー0件)になる(patches/ の修正案が未適用)ので、本体を使う構成は置かない。
            # seq: IME_ON, ひらがな×2, カタカナ, 英数, 無変換, 変換, 半角/全角×2, Esc, k, a(入力中), Space(変換中), Enter, IME_OFF, IME_ON
            *[cfg(f'cal-notify-probe-atok-g{g}', 'observe', check='collect', awase='false', runs=1, wait=240, keymap=1,
                  probe_bin='compartment_notify_probe_diag',
                  probe=f'--seq=16,F2,F2,F1,F0,1D,1C,F3,F3,1B,4B,41,20,0D,1A,16 --gap={g} --poll=50')
              for g in (1500, 600)],
            # cal-notify-probe-diag: 前面化の戦略 S0〜S3 を順に試して DIAG 行に残す診断コピー(ADR-193 の本体は編集しない)。
            cfg('cal-notify-probe-diag', 'observe', check='collect', awase='false', runs=1, wait=240, keymap=1,
                probe_bin='compartment_notify_probe_diag',
                probe='--seq=16,F2,F2,F1,F0,1D,1C,F3,F3,1B,4B,41,20,0D,1A,16 --gap=1500 --poll=50'),
            # cal-notify-comp-s1: 入力中/変換中/確定のイベント(WM_IME_*/EN_CHANGE)も待ちの静止判定に使い、観測を +100ms だけにする(--snap100)。
            # cal-notify-atok-s1(--notify のみ)と表(grid_learn.py --at=100)・所要時間を比べる。
            cfg('cal-notify-comp-s1', 'observe', check='collect', awase='false', runs=1, wait=1500, keymap=1,
                args='--grid=s1 --grid-setup=keys --fast --speed=2 --grid-adaptive --notify --notify-comp --snap100 '
                     '--grid-retry-file=@REPO@/tools/e2e/ime_key_matrix/grid-tables/nondet-atok.txt'),
            # cal-notify-comp-atok: 入力中/変換中/確定のイベント(WM_IME_*, EN_CHANGE)が CI(GJI・Edit)で届くか(--notify-comp)。
            cfg('cal-notify-comp-atok', 'observe', check='collect', awase='false', runs=1, wait=900, keymap=1,
                args='--grid=s4 --grid-setup=keys --grid-trials=1 --fast --speed=2 --notify --notify-comp'),
            # cal-notify-atok-s{1..4}: cal-fast-atok-s*(--fast --speed=2 --grid-adaptive)に --notify を足した構成。所要時間・表の一致を遅い版/高速版と比べる。
            *[cfg(f'cal-notify-atok-s{n}', 'observe', check='collect', awase='false', runs=1, wait=1500, keymap=1,
                  args=f'--grid=s{n} --grid-setup=keys --fast --speed=2 --grid-adaptive --notify '
                       '--grid-retry-file=@REPO@/tools/e2e/ime_key_matrix/grid-tables/nondet-atok.txt')
              for n in (1, 2, 3, 4)],
            # --- MS-IME本体(Microsoft IME、ImeKind=MicrosoftIme)の学習ラウンド(ADR-191、撤去版レビュー指摘B Blocker の対処(2)) ---
            # cal-notify-msimenative-s{1..4}: cal-notify-atok-s*(--fast --speed=2 --grid-adaptive --notify)の MS-IME本体版(--msime、awase なし、状態はキーのみで作る)。
            # 前回の表(retry-file)が無いので --grid-retry-file は付けない(1パス目は全セル1回、2パス目は履歴依存ブロック+10%の監査標本)。
            # cal-msnative-walk-s{3,4}: 表の一段予測を採点する独立ラン(awase なし、--msime)。学習(格子)とは別のキー列。
            *[cfg(f'cal-notify-msimenative-s{n}', 'observe', check='collect', ime='msime', awase='false', runs=1, wait=1500,
                  args=f'--grid=s{n} --grid-setup=keys --fast --speed=2 --grid-adaptive --notify --msime')
              for n in (1, 2, 3, 4)],
            *[cfg(f'cal-msnative-walk-s{n}', 'observe', check='collect', ime='msime', awase='false', runs=1,
                  args=f'--walk=100 --seed={n} --msime')
              for n in (3, 4)],
            # --- 高速な学習ラウンド(ci/e2e-calibration) ---
            # --fast(押下後の待ち 2300→700ms。+400ms と +1500ms で表が変わらないことを264試行で確認済み) と --speed=2、
            # 探索後に到達不能な試行を外す([GRID-PRUNE])、--grid-adaptive(1パス目は全セル1回、2パス目は前回の表で非決定だったセル+履歴依存+10%の監査標本)、
            # セットアップ不能の連続で打ち切り([GRID-ABORT]→rc=3)。本番シャードは同じプリセットの smoke が成功してから中身を実行する(gate)。
            # cal-fast-val-* は速度の妥当性の比較用: 遅い版 cal-gridk3-atok-s1(--grid-trials=2)と同じ入力で --speed=1/4 を比べる。
            *[cfg(f'cal-fast-smoke-{pre}', 'observe', check='collect', awase='false', runs=1, wait=900, keymap=km,
                  args=f'--grid={sh} --grid-setup=keys --fast --speed=2 --grid-trials=1')
              for pre, km, sh in (('atok', 1, 's1'), ('msime', 2, 's2'))],
            *[cfg(f'cal-fast-{pre}-{sh}', 'observe', check='collect', awase='false', runs=1, wait=1500, keymap=km,
                  gate=f'cal-fast-smoke-{pre}',
                  args=f'--grid={sh} --grid-setup=keys --fast --speed=2 --grid-adaptive '
                       f'--grid-retry-file=@REPO@/tools/e2e/ime_key_matrix/grid-tables/nondet-{pre}.txt')
              for pre, km in (('atok', 1), ('msime', 2)) for sh in ('s1', 's2', 's3', 's4')],
            *[cfg(f'cal-fast-val-atok-s1-k{k}', 'observe', check='collect', awase='false', runs=1, wait=1500, keymap=1,
                  args=f'--grid=s1 --grid-setup=keys --grid-trials=2 --fast --speed={k}')
              for k in (1, 4)],
            cfg('msime-stale-table', 'pass', check='consistency', args='--walk --key=henkan', keymap=2, custom_table='true'),
            # --- 操作シナリオ(sc-): IMEプリセット × 各種IMEキー × パススルー/抑止設定 × Shift単独打鍵 ---
            # 判定はどれも「実IMEのかな=Engine ON、英数・直接入力=Engine OFF」に追随するか(consistency)。
            # 全シナリオ pass(MS-IME本体もADR-190/BUG-152の修正後はPASS。修正前は直接入力からの最初のひらがな(0xF2)でIMEが開かず3/3 FAILだった)。
            # ただし MS-IME本体の半角/全角(sc-hz-msime-native-*)は observe: F3=閉/F4=開の静的モデルでGJIのようなトグルではない(ADR-189が対象外にした範囲)。
            # noawase の構成は、それが awase のせいか(MS-IME本体の癖か)を切り分ける対照実験。
            # IME の3通り: msime-native(標準の日本語IME)、gji-msime(GJI + MS-IMEプリセット)、gji-atok(GJI + ATOKプリセット)
            # 設定 dbe_mode_key_policy(suppress/passthrough)は ADR-191 で撤去した(Passthroughを選んでも挙動が変わらない実質死んだ設定だった)。
            # 以前の -suppress/-passthrough の2構成は同じ挙動を測るだけなので1構成にした(構成名は sc-dbe-<ime>・sc-hz-<ime>)。
            # half_width_alnum_toggle: 左Shift単独タップで半角英数(持続トグル)。GJIで使うには all が必要。
            *[cfg(f'sc-dbe-{ime_name}', 'pass', check='consistency', ime=ime, keymap=km,
                  args=f'--seq=F2,F0,F2,F1,F2,F0,F0,F1,F2{msime}')
              for ime_name, ime, km, msime in SC_IMES],
            *[cfg(f'sc-kanji-{ime_name}', 'pass', check='consistency', ime=ime, keymap=km,
                  args=f'--seq=F2,19,19,16,1A,16,1A,19,F2,1A{msime}')
              for ime_name, ime, km, msime in SC_IMES],
            *[cfg(f'sc-hz-{ime_name}', 'observe' if ime == 'msime' else 'pass', check='toggle', ime=ime, keymap=km,
                  args=f'--hz{msime}')
              for ime_name, ime, km, msime in SC_IMES],
            *[cfg(f'sc-shift-{ime_name}', 'pass', check='consistency', ime=ime, keymap=km,
                  args=f'--seq=F2,A0,A0,A0,A1,F2{msime}', general='half_width_alnum_toggle = "all"')
              for ime_name, ime, km, msime in SC_IMES],
            # ADR-199 T10 決定A: 文字→親指(無変換)の順で重なり不足(min_overlap_margin_percent=15)にしたまま親指を押し続けてタイムアウトを越えても、
            # 親指を押している間は forced の IME OFF(keys.ime_off)を発火せず、離した時に発火する(check_charthumb.py)。修正前の awase は押している間に閉じる。
            cfg('sc-charthumb-gji-atok', 'pass', check='charthumb', args='--charthumb=41,1D', runs=8,
                general='min_overlap_margin_percent = 15', keys='ime_off = ["VK_NONCONVERT"]'),
            # ADR-206: 無変換/変換の単独タップ。GJI の CUSTOM 表で無変換(変換)を「全開状態で閉じるトグル」にしたとき、awase は生キーを GJI に通さず、
            # belief に従う絶対指定の ON/OFF を1回だけ書く(エンジン非活性側もエンジンの特殊キー照合で)。--seq: 16=IME ON、1D=無変換、1C=変換、1A=IME OFF。
            # 判定は consistency(実 IME の開閉と Engine の追随)。押下1回で開閉1回(二重トグルなし)であること、押すたびに状態が変わること(固着なし)を見る。
            cfg('sc-solotap-toggle-gji-atok', 'pass', check='consistency', keymap=0, runs=2,
                args='--seq=16,1D,1D,1D,1D',
                tsv='DirectInput,ON,IMEOn|Precomposition,OFF,IMEOff|Composition,OFF,IMEOff|Conversion,OFF,IMEOff|DirectInput,Muhenkan,IMEOn|Precomposition,Muhenkan,IMEOff|Composition,Muhenkan,IMEOff|Conversion,Muhenkan,IMEOff'),
            cfg('sc-solotap-henkan-toggle-gji-atok', 'pass', check='consistency', keymap=0, runs=2,
                args='--seq=16,1C,1C,1C,1C',
                tsv='DirectInput,ON,IMEOn|Precomposition,OFF,IMEOff|Composition,OFF,IMEOff|Conversion,OFF,IMEOff|DirectInput,Henkan,IMEOn|Precomposition,Henkan,IMEOff|Composition,Henkan,IMEOff|Conversion,Henkan,IMEOff'),
            # 対照: 無変換が閉じないコマンド(InputModeHiragana)のとき、awase は能動にならず(役割なし=受動)、Engine は実 IME に追随する。
            cfg('sc-solotap-nontoggle-gji-atok', 'pass', check='consistency', keymap=0, runs=2,
                args='--seq=16,1D,1D',
                tsv='DirectInput,ON,IMEOn|Precomposition,OFF,IMEOff|Composition,OFF,IMEOff|Conversion,OFF,IMEOff|Precomposition,Muhenkan,InputModeHiragana'),
            # belief が古い状態(観測できない窓=cache=unavailable で、注入した IME OFF は awase の意図にならない=外部 close 相当)でトグルを押す。
            # 所有者定義: 押下を重ねて状態が変わり 2〜3 回目で期待状態になれば PASS、N 回押しても変化しなければ FAIL(BUG-172、ADR-205/206)。
            # 自動判定はまだ無い(consistency は 1 回目の逆向きも不一致とみなす)ので observe でログを見る。
            cfg('sc-solotap-stale-toggle-gji-atok', 'observe', check='consistency', keymap=0, runs=2, cache='unavailable',
                args='--seq=16,1A,1D,1D,1D',
                tsv='DirectInput,ON,IMEOn|Precomposition,OFF,IMEOff|Composition,OFF,IMEOff|Conversion,OFF,IMEOff|DirectInput,Muhenkan,IMEOn|Precomposition,Muhenkan,IMEOff|Composition,Muhenkan,IMEOff|Conversion,Muhenkan,IMEOff'),
            # 素通しの英数キーで閉じた直後に無変換(BUG-156 型、applied が古いと already_matches で送信が省略され誰も開かない。ADR-206 決定7)。
            cfg('sc-solotap-after-passthrough-close-gji-atok', 'observe', check='consistency', keymap=0, runs=2,
                args='--seq=16,F0,1D,1D,1D',
                tsv='DirectInput,ON,IMEOn|Precomposition,OFF,IMEOff|Composition,OFF,IMEOff|Conversion,OFF,IMEOff|Precomposition,Eisu,IMEOff|Composition,Eisu,IMEOff|Conversion,Eisu,IMEOff|DirectInput,Muhenkan,IMEOn|Precomposition,Muhenkan,IMEOff|Composition,Muhenkan,IMEOff|Conversion,Muhenkan,IMEOff'),
            # T1(b)(ADR-199): TSF 経路で Alt+半角/全角(VK 0x19)が CUSTOM 表の Hankaku/Zenkaku 行に従うか。
            # 変換(IMEOn)で IME を開き、Alt+0x19。行=IMEOff の表で閉じ、行なしの対照で閉じなければ「行に従う」。両方閉じれば行を見ない(0x19 は固定)。
            cfg('sc-t1b-row-imeoff', 'observe', check='consistency', awase='false', keymap=0, runs=1,
                args='--chord=A4,19 --chord-at=20000 --chord-prep=1C', tsv='DirectInput,Henkan,IMEOn|Precomposition,Hankaku/Zenkaku,IMEOff'),
            cfg('sc-t1b-no-row', 'observe', check='consistency', awase='false', keymap=0, runs=1,
                args='--chord=A4,19 --chord-at=20000 --chord-prep=1C', tsv='DirectInput,Henkan,IMEOn'),
            # 0x19 は Kanji 行にも従うか(Hankaku/Zenkaku 行なし・Kanji 行=IMEOff の表)。開いたままなら Kanji 行は見ない(0x19 は Hankaku/Zenkaku 行だけ)。
            cfg('sc-t1b-kanji-row-only', 'observe', check='consistency', awase='false', keymap=0, runs=1,
                args='--chord=A4,19 --chord-at=20000 --chord-prep=1C', tsv='DirectInput,Henkan,IMEOn|Precomposition,Kanji,IMEOff'),
            # ADR-202 T16-3(判定は check_kanji_role.py): awase 起動中に、GJI の CUSTOM 表の Hankaku/Zenkaku 行を変えた利用者の Alt+半角/全角(0x19)で、実 IME と Engine(belief)がずれないこと。
            # VK_IME_ON で IME を開き、Alt+0x19。nontoggle=行が閉じないコマンド(InputModeHiragana)なので IME は開いたまま、Engine も ON のまま(修正前は静的 Toggle で belief だけ反転してずれる)。
            # toggle=行がトグルなので IME が閉じ、Engine も OFF に追随する。表には awase の書き込み手段(ON/OFF 行)を必ず入れる。
            cfg('sc-kanji-role-nontoggle', 'pass', check='kanjirole-open', keymap=0, runs=2,
                args='--chord=A4,19 --chord-at=20000 --chord-prep=16',
                tsv='DirectInput,ON,IMEOn|Precomposition,OFF,IMEOff|Composition,OFF,IMEOff|Conversion,OFF,IMEOff|Precomposition,Hankaku/Zenkaku,InputModeHiragana'),
            cfg('sc-kanji-role-toggle', 'pass', check='kanjirole-closed', keymap=0, runs=2,
                args='--chord=A4,19 --chord-at=20000 --chord-prep=16',
                tsv='DirectInput,ON,IMEOn|Precomposition,OFF,IMEOff|Composition,OFF,IMEOff|Conversion,OFF,IMEOff|DirectInput,Hankaku/Zenkaku,IMEOn|Precomposition,Hankaku/Zenkaku,IMEOff|Composition,Hankaku/Zenkaku,IMEOff|Conversion,Hankaku/Zenkaku,IMEOff'),
            # ADR-199 T1(e): 実 Chrome(TsfNative)への実タイピング。GJI の CUSTOM 表で F13 をトグルにし、F13 で閉↔開、awase の belief が追随して NICOLA 文字が出るか
            # (chrome_probe --f13、判定は打った文字)。対照(-noawase)は awase なし(GJI 単体で F13 が Chrome に効くか。かな時は `か`)。
            cfg('sc-t1e-chrome-f13', 'pass', check='chromeprobe', keymap=0, runs=1, wait=400,
                chrome='--f13 --repeat=2 --settle=800',
                tsv='DirectInput,ON,IMEOn|Precomposition,OFF,IMEOff|Composition,OFF,IMEOff|Conversion,OFF,IMEOff|DirectInput,F13,IMEOn|Precomposition,F13,IMEOff|Composition,F13,IMEOff|Conversion,F13,IMEOff'),
            # ADR-209(2026-09-30): 読めない窓(実 Chrome=Imm32Unavailable)で、GJI の MS-IME プリセット(keymap=2)の IME OFF から変換を
            # 単独で押す(素通し)と IME が開き、awase の Engine が追随して NICOLA になる。stale=実機と同じ古い custom_keymap_table 付き。
            # off=設定 predict_henkan_open_in_unreadable_windows=false の対照(追随しない=IME ON・Engine OFF で `か` になり FAIL するはず)。
            *[cfg(f'sc-adr209-chrome-msime{suf}', exp, check='chromeprobe', keymap=2, runs=1, wait=500, custom_table=ct, general=gen,
                  chrome='--henkan-open --repeat=3 --settle=800')
              for suf, exp, ct, gen in (('', 'pass', 'false', ''), ('-stale', 'pass', 'true', ''),
                                        ('-off', 'fail', 'false', 'predict_henkan_open_in_unreadable_windows = false'))],
            # 追随できる条件の調査(2026-09-30、実 Chrome=読めない窓): GJI の ATOK(1)/MS-IME(2)プリセットで、閉状態から各キーを押して
            # Engine が追随する(PASS=NICOLA)か、IME だけ開いて Engine OFF(FAIL=`か`)か、開かない(FAIL=`ka`)かを見る。表に出すだけ(observe)。
            *[cfg(f'sc-follow-chrome-{pn}-{kn}', 'observe', check='chromeprobe', keymap=km, runs=1, wait=500,
                  chrome=f'--key={kv} --repeat=2 --settle=800')
              for pn, km in (('atok', 1), ('msime', 2))
              for kn, kv in (('ime-on', '16'), ('henkan', '1c'), ('muhenkan', '1d'), ('eisu', 'f0'), ('hiragana', 'f2'),
                             ('hankaku', 'f3'), ('f13', '7c'), ('f14', '7d'))],
            # BUG-149 の再現確認(2026-10-04 v2.0.0 の棚卸しで追加、観測のみ。only='sc-bug149-*' で回す。既定の sc-* には含めない): 実 Chrome(TsfNative)で、
            # かな ON から ひらがなキー(0xF2)/Shift+無変換 を押して半角英数にしたあと Engine が追随するか(`ka`=追随、`kiu`/`き`=BUG-149 の症状)。chrome_probe 既定の8ケース
            # (うち「かな→ひらがな=半角英数」「かな→Shift+無変換=半角英数」が BUG-149)を 3 周。-noawase は awase なしの対照(GJI 単体なら `ka`)。
            # 結果は result.txt の `[CASE n/8 run r/3] <名前>` と `RESULT PASS/RECOVER/FAIL`、末尾の SUMMARY。ADR-191/205/209 で解消済みなら全 PASS。
            # -passthru: 無変換/変換の単独タップを素通し(`*_solo_tap_always_suppress = false`、BUG-150 が前提にした「パススルー設定」)にした版。
            # 既定の Suppress(ADR-206 決定1)では単独タップは IME を動かさないので「かな→無変換=IME OFF」は設計どおり Engine ON のまま(2026-10-04、run 37187579784)。
            # 素通しのとき、実 Chrome で IME が閉じて Engine が追随するか(BUG-150 の Chrome 版)を見る。
            *[cfg(f'sc-bug149-chrome-{pn}{suf}', 'observe', check='chromeprobe', keymap=km, runs=1, wait=600, awase=aw, general=gen,
                  chrome=f'--repeat=3 --settle=800{na}')
              for pn, km in (('atok', 1), ('msime', 2))
              for suf, aw, na, gen in (('', 'true', '', ''), ('-noawase', 'false', ' --no-awase', ''),
                                       ('-passthru', 'true', '', 'muhenkan_solo_tap_always_suppress = false; henkan_solo_tap_always_suppress = false'))],
            # ADR-244(BUG-186): 同定済み MS-IME 本体 × 実 Chrome で、左Shift単独タップの持続半角英数のあと 変換・無変換・英数・ひらがな を押す。
            # IME はかなへ戻る(無変換は閉じる)ので Engine が追随する(NICOLA 文字、無変換は ka)こと(合否)。遷移表(sc-table-*、観測のみ)の
            # 「Shift単独タップ後」行の 4 キーだけを回す専用構成。--strict で FAIL・INVALID・RECOVER のどれが 1 件でもあれば赤
            # (持続トグルを手放さない退行は、次のケースの setup が INVALID になる形で出るため、INVALID を数えない構成では見えない)。
            *[cfg(f'sc-bug186-msime-shift-toggle-{pt}', 'pass', check='chromeprobe', ime='msime', keymap=2, runs=1, wait=900, awase='true',
                  general='left_thumb_key = "無変換"; right_thumb_key = "Space"; half_width_alnum_toggle = "all"' + gen,
                  chrome='--table --table-state=shift --table-keys=1C,1D,F0,F2 --repeat=2 --settle=800 --msime', checkargs='--strict')
              for pt, gen in (('suppress', ''), ('passthru', '; muhenkan_solo_tap_always_suppress = false'))],
            # ADR-244 M-2(BUG-192): 予測付きのモードキー(ひらがな 0xF2)をトグル開始の前に押すと、打鍵時点の予測の追跡(track.conv)が
