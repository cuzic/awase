          $tsfBase = 'HKCU:\SOFTWARE\Microsoft\Input\TSF\Tsf3Override\{03b5835f-f03c-411b-9ce2-aa23e1171e36}'
          $v = $null
          try { $v = (Get-ItemProperty -Path $tsfBase -Name NoTsf3Override2 -ErrorAction Stop).NoTsf3Override2 } catch { }
          $line = 'NoTsf3Override2=' + $(if ($null -eq $v) { 'absent' } else { $v })
          $line | Tee-Object -FilePath env.txt
          "$line (config=${{ matrix.cfg.name }} ime=${{ matrix.cfg.ime }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # smoke ゲート: 本番シャードは、同じ run 内の smoke ジョブ(matrix.cfg.gate)が成功するまで待ち、失敗したら中身を実行しない。
      # smoke と同時に起動する(GJI導入・言語設定は smoke と並行して済ませる)ので、待ちは smoke の残り時間だけで済む。
      - name: smoke の成功を待つ(ゲート)
        id: gate
        if: matrix.cfg.gate != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ matrix.cfg.gate }}
        run: |
          # fail-open の条件: 5分待っても smoke ジョブが見つからない(この run に smoke が無い、または API が読めない)ときは
          # 通常どおり中身を実行する(ゲートは「smoke が失敗した」ことを確認できたときだけ本番を止める)。
          # ジョブ一覧は --paginate で全件読む(全構成 run は 200 ジョブ超で、1ページ 100 件では smoke が見つからない)。
          verdict=notfound
          for i in $(seq 1 90); do
            row=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              -q ".jobs[] | select(.name | startswith(\"e2e ($GATE,\")) | \"\(.status) \(.conclusion)\"" 2>/dev/null | head -1 || true)
            case "$row" in
              "completed success") verdict=success; break ;;
              "completed "*) verdict=failed; break ;;
              "") [ "$i" -ge 15 ] && break ;;  # 5分待っても smoke ジョブが見つからない(この run に smoke が無い)なら通常どおり実行
            esac
            sleep 20
          done
          echo "gate=$GATE verdict=$verdict ($row)"
          if [ "$verdict" = failed ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "smoke ($GATE) が失敗したため中身を実行しない" | tee result.txt
            echo "rc=3" > rc.txt
          fi

      # run の汚れ(CPU 負荷)を後から判定するための記録。情報用で、失敗しても run には影響しない(check_run_validity.py)。
      - name: CPU 負荷の記録を始める
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          try {
            $p = Start-Process -FilePath pwsh -ArgumentList '-NoProfile','-File',"$PWD\tools\e2e\ime_key_matrix\cpu_sampler.ps1",'-Out',"$PWD\cpu.csv" -PassThru -WindowStyle Hidden
            $p.Id | Out-File -FilePath cpu.pid -Encoding ascii
          } catch { "cpu sampler 起動失敗: $_" }
          exit 0

      - name: awase を起動し、スパイク --auto を実行して判定する
        id: run
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $cfg = Get-Content dist\config.toml -Raw
          # [general] への追加設定(;区切りの `key = value`)。既にあれば値を置き換え、無ければ [general] の直後に足す。
          $general = '${{ matrix.cfg.general }}'
          foreach ($line in ($general -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
            $key = ($line -split '=')[0].Trim()
            if ($cfg -match "(?m)^$key *=") { $cfg = $cfg -replace "(?m)^$key *=.*$", $line }
            else { $cfg = $cfg -replace '(?m)^\[general\]\s*$', "[general]`r`n$line" }
          }
          # [keys] への追加設定(;区切りの `key = value`)。既にあれば値を置き換え、無ければ末尾に [keys] を作って足す。
          $keys = '${{ matrix.cfg.keys }}'
          foreach ($line in ($keys -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
            $key = ($line -split '=')[0].Trim()
            if ($cfg -notmatch '(?m)^\[keys\]\s*$') { $cfg = $cfg.TrimEnd() + "`r`n`r`n[keys]`r`n" }
            if ($cfg -match "(?m)^$key *=") { $cfg = $cfg -replace "(?m)^$key *=.*$", $line }
            else { $cfg = $cfg -replace '(?m)^\[keys\]\s*$', "[keys]`r`n$line" }
          }
          [IO.File]::WriteAllText("$PWD\dist\config.toml", $cfg, (New-Object Text.UTF8Encoding($false)))
          Select-String -Path "$PWD\dist\config.toml" -Pattern 'half_width_alnum_toggle'
          # CIランナーは初回のクロスプロセスIMMプローブが遅く(実測22ms)、awase がスパイク窓を「IMM不可」と誤学習して
          # conv を読まなくなる(Engine が半角英数に追従しない)。学習済みキャッシュを事前投入して防ぐ。
          [IO.File]::WriteAllText("$PWD\dist\cache.toml", "[imm_capability.`"ime_key_matrix_spike.exe`"]`r`nEdit = `"${{ matrix.cfg.cache }}`"`r`nRICHEDIT50W = `"works`"`r`n[imm_capability.`"typing_stress.exe`"]`r`nEdit = `"works`"`r`nRICHEDIT50W = `"works`"`r`n", (New-Object Text.UTF8Encoding($false)))
          $env:RUST_LOG = 'debug'
          $env:AWASE_TEST_INJECTION = '1'
          # 順序: スパイクを先に起動し、初期化(TSF/ActivateProfile)が終わってから awase を起動する。
          # スパイクの初期化中に awase がIMMをプローブすると応答が無く、3回連続の miss で Edit を「IMM不可」と
          # 誤学習して conv を読まなくなる。--activate-gji はキーフックをawase起動後に遅延インストールし、
          # 起動後に VK_IME_OFF を1回注入して awase の belief(起動時推定=ON)と実状態(OFF)をそろえる。
          Push-Location dist
          if ('${{ matrix.cfg.probe }}' -ne '') {
            # ADR-193 の compartment_notify_probe(awase なし)。キー→通知の遅延を測る。ログは dist\compartment_notify_probe.log。
            # プローブは自前の前面化に CI で失敗する(ABORT 前面化またはフォーカスに失敗)ので、外側から前面化する
            # (スパイクと同じ AttachThreadInput の定番の回避策。プローブは 2.3 秒待ってから前面化を確かめるので間に合う)。
            $probeBin = '${{ matrix.cfg.probe_bin }}'
            Add-Type -TypeDefinition '
            using System;
            using System.Runtime.InteropServices;
            public class FgHelper {
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint a, uint b, bool attach);
              [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
              public static bool Front(IntPtr h) {
                IntPtr fg = GetForegroundWindow(); uint pid; uint ft = fg == IntPtr.Zero ? 0 : GetWindowThreadProcessId(fg, out pid);
                uint me = GetCurrentThreadId(); bool att = ft != 0 && ft != me && AttachThreadInput(me, ft, true);
                BringWindowToTop(h); bool ok = SetForegroundWindow(h);
                if (att) AttachThreadInput(me, ft, false);
                return ok || GetForegroundWindow() == h;
              }
            }
            '
            $probe = Start-Process -FilePath ".\$probeBin.exe" -ArgumentList "${{ matrix.cfg.probe }} --log=$probeBin.log" -PassThru
            if ($probeBin -eq 'compartment_notify_probe') {
              for ($i = 0; $i -lt 12; $i++) {
                Start-Sleep -Milliseconds 150
                $probe.Refresh()
                if ($probe.MainWindowHandle -ne [IntPtr]::Zero) { [void][FgHelper]::Front($probe.MainWindowHandle) }
              }
            }
            $deadline = (Get-Date).AddSeconds(${{ matrix.cfg.wait }})
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if ((Test-Path "$probeBin.log") -and (Select-String -Path "$probeBin.log" -Pattern '=== 完了 ===' -Quiet)) { break }
            }
          } elseif ('${{ matrix.cfg.chrome }}' -ne '') {
            # 実 Chrome(TsfNative)への実タイピング(chrome_probe.exe、ADR-199 T1(e))。awase を先に起動して TIP を検出させてから、Chrome を起動して打鍵する。
            # 判定は打った文字(k,a の出力)。GJI は既定の入力方式(Set-WinDefaultInputMethodOverride)で Chrome に効く。
            if ('${{ matrix.cfg.awase }}' -ne 'false') {
              Start-Process -FilePath "$PWD\awase.exe" -WorkingDirectory "$PWD" -RedirectStandardError "$PWD\..\awase-stderr.log" -RedirectStandardOutput "$PWD\..\awase-stdout.log"
              Start-Sleep -Seconds 10
            }
            Start-Process -FilePath .\chrome_probe.exe -ArgumentList '${{ matrix.cfg.chrome }} --log=chrome_probe.log'
            $deadline = (Get-Date).AddSeconds(${{ matrix.cfg.wait }})
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if ((Test-Path chrome_probe.log) -and (Select-String -Path chrome_probe.log -Pattern '全ケース完了' -Quiet)) { break }
            }
          } elseif ('${{ matrix.cfg.stress }}' -ne '') {
            # 高速打鍵ストレス(typing_stress.exe): 入力欄の窓を作り GJI/MS-IME を有効化 → 「READY-FOR-AWASE」を出したら awase を起動 →
            # exe が awase.log を確認して10秒待ち、IME を ON にして各速度で打鍵・読み戻し → 「=== 完了 ===」。seed は回番号。
            $stressArgs = '--activate-gji ${{ matrix.cfg.stress }} --seed=${{ matrix.run }}'.Replace('@REPO@', $env:GITHUB_WORKSPACE.Replace('\', '/'))
            Start-Process -FilePath .\typing_stress.exe -ArgumentList $stressArgs
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 500
              if ((Test-Path typing_stress.log) -and (Select-String -Path typing_stress.log -Pattern 'READY-FOR-AWASE' -Quiet)) { break }
            }
            if ('${{ matrix.cfg.awase }}' -ne 'false') {
              Start-Process -FilePath "$PWD\awase.exe" -WorkingDirectory "$PWD" -RedirectStandardError "$PWD\..\awase-stderr.log" -RedirectStandardOutput "$PWD\..\awase-stdout.log"
            }
            $deadline = (Get-Date).AddSeconds(${{ matrix.cfg.wait }})
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if ((Test-Path typing_stress.log) -and (Select-String -Path typing_stress.log -Pattern '=== 完了 ===' -Quiet)) { break }
            }
          } else {
          $spikeArgs = '--auto --hold=180 --activate-gji ${{ matrix.cfg.args }}'.Replace('@REPO@', $env:GITHUB_WORKSPACE.Replace('\', '/'))
          Start-Process -FilePath .\ime_key_matrix_spike.exe -ArgumentList $spikeArgs
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path ime_key_matrix_spike.log) -and (Select-String -Path ime_key_matrix_spike.log -Pattern 'ROUND 2/2' -Quiet)) { break }
          }
          if ('${{ matrix.cfg.awase }}' -ne 'false') {
            Start-Process -FilePath "$PWD\awase.exe" -WorkingDirectory "$PWD" -RedirectStandardError "$PWD\..\awase-stderr.log" -RedirectStandardOutput "$PWD\..\awase-stdout.log"
          }
          $deadline = (Get-Date).AddSeconds(${{ matrix.cfg.wait }})
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            if ((Test-Path ime_key_matrix_spike.log) -and (Select-String -Path ime_key_matrix_spike.log -Pattern '全手順完了' -Quiet)) { break }
          }
          }
          Pop-Location
          Get-Process awase -ErrorAction SilentlyContinue | Format-Table Name, Id
          if (Test-Path dist\awase.log) { Get-Content dist\awase.log -Encoding utf8 | Where-Object { $_ -match 'Engine (de)?activated|IME open axis delegated|outcome=Unwarranted' } | Set-Content awase-filtered.log -Encoding utf8 } else { New-Item -ItemType File -Force awase-filtered.log | Out-Null }
          $env:PYTHONUTF8 = '1'
          # 判定は summary ジョブで集計する。ここでは終了コード(0=PASS, 1=FAIL, 3=INVALID)を記録して成功で終える。
          if ('${{ matrix.cfg.probe }}' -ne '') {
            # プローブ: 測定内容は判定しないが、「実行できなかった」は INVALID(rc=3)にする(完走マーカー・ABORT・KEY 行数)。
            $plog = "dist\${{ matrix.cfg.probe_bin }}.log"
            $pdone = (Test-Path $plog) -and (Select-String -Path $plog -Pattern '=== 完了 ===' -Quiet)
            $pabort = (Test-Path $plog) -and (Select-String -Path $plog -Pattern 'ABORT' -Quiet)
            $pkeys = if (Test-Path $plog) { @(Select-String -Path $plog -Pattern 'ms KEY ').Count } else { 0 }
            if (-not $pdone -or $pabort -or $pkeys -eq 0) {
              "probe: 実行できなかった(INVALID, rc=3) 完走マーカー=$pdone ABORT=$pabort KEY行=$pkeys。ログ $plog を参照" | Tee-Object -FilePath result.txt
              $global:LASTEXITCODE = 3
            } else {
              "probe: 判定なし(ログ回収のみ, rc=0) KEY行=$pkeys。解析は notify_latency.py" | Tee-Object -FilePath result.txt
              $global:LASTEXITCODE = 0
            }
          } elseif ('${{ matrix.cfg.check }}' -eq 'typing') {
            python tools\e2e\ime_key_matrix\check_typing_stress.py --json typing.json dist\typing_stress.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'driftcorrection') {
            python tools\e2e\ime_key_matrix\check_drift_correction.py --json drift.json dist\typing_stress.log dist\awase.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'reopen') {
            python tools\e2e\ime_key_matrix\check_reopen.py --json reopen.json ${{ matrix.cfg.checkargs }} dist\typing_stress.log dist\awase.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'preedit') {
            python tools\e2e\ime_key_matrix\check_preedit.py --json preedit.json dist\typing_stress.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'driftrecovery') {
            if ('${{ matrix.cfg.chrome }}' -ne '') {
              python tools\e2e\ime_key_matrix\check_drift_recovery_chrome.py dist\chrome_probe.log dist\awase.log | Tee-Object -FilePath result.txt
            } else {
              python tools\e2e\ime_key_matrix\check_drift_recovery.py --json driftrec.json dist\typing_stress.log dist\awase.log | Tee-Object -FilePath result.txt
            }
          } elseif ('${{ matrix.cfg.check }}' -eq 'keymatrix') {
            # ADR-208 L3b: 「ずれの作り方 × 明示キー」行列。実 Chrome は chrome_probe.log、自前窓は typing_stress.log を読む。
            $kmlog = if ('${{ matrix.cfg.chrome }}' -ne '') { 'dist\chrome_probe.log' } else { 'dist\typing_stress.log' }
            python tools\e2e\ime_key_matrix\check_keymatrix.py ${{ matrix.cfg.expect == 'pass' && '--strict' || '' }} --json keymatrix.json $kmlog dist\awase.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'commitkm') {
            python tools\e2e\ime_key_matrix\check_commitkm.py dist\typing_stress.log | Tee-Object -FilePath result.txt
            $global:LASTEXITCODE = 0
          } elseif ('${{ matrix.cfg.check }}' -eq 'offrca') {
            python tools\e2e\ime_key_matrix\check_offrca.py --json offrca.json ${{ matrix.cfg.checkargs }} dist\chrome_probe.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'startup') {
            python tools\e2e\ime_key_matrix\check_startup.py --json startup.json ${{ matrix.cfg.checkargs }} dist\typing_stress.log dist\awase.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'toggle') {
            python tools\e2e\ime_key_matrix\check_toggle.py dist\ime_key_matrix_spike.log dist\awase.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'charthumb') {
            python tools\e2e\ime_key_matrix\check_charthumb.py dist\ime_key_matrix_spike.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -like 'kanjirole-*') {
            $kexp = '${{ matrix.cfg.check }}'.Substring('kanjirole-'.Length)
            python tools\e2e\ime_key_matrix\check_kanji_role.py --expect=$kexp dist\ime_key_matrix_spike.log dist\awase.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'chromeprobe') {
            python tools\e2e\ime_key_matrix\check_chrome_probe.py ${{ matrix.cfg.checkargs }} dist\chrome_probe.log | Tee-Object -FilePath result.txt
            $cprc = $LASTEXITCODE
            # focus 遷移まわりのログ(settle 中に SetOpen を落としていないか=`[focus-settle] SetOpen … stripped` が 0 件か)も結果に添える。
            if (Test-Path dist\awase.log) {
              $fs = @(Select-String -Path dist\awase.log -Pattern 'focus-settle|\[focus|FocusChanged|focus_changed' | ForEach-Object { $_.Line })
              $ec = @(Select-String -Path dist\awase.log -Pattern 'external-change|relay-passthrough|\[reinject\]|Engine deactivated|Engine activated' | ForEach-Object { $_.Line })
              "BUG176 awase.log: external-change/reinject/Engine 切替の行数=$($ec.Count) (external-change=$(@($ec | Where-Object { $_ -match 'external-change' }).Count))" | Tee-Object -FilePath result.txt -Append
              $ec | Select-Object -First 80 | Tee-Object -FilePath result.txt -Append
              "focus 関連ログ件数(focus-settle を含む)=$($fs.Count)" | Tee-Object -FilePath result.txt -Append
              $fs | Select-Object -First 30 | Tee-Object -FilePath result.txt -Append
            }
            $global:LASTEXITCODE = $cprc
          } elseif ('${{ matrix.cfg.check }}' -eq 'resync') {
            python tools\e2e\ime_key_matrix\check_resync.py dist\ime_key_matrix_spike.log dist\awase.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'collect') {
            # 判定はしないが、「実行できなかった」は INVALID(rc=3)にする: (1)[GRID-ABORT]、(2)完走マーカー(全手順完了)が無い
            # (前面化失敗などで進まずに wait を使い切った)、(3)測定(KEY 行)が0件。
            $slog = 'dist\ime_key_matrix_spike.log'
            $sabort = (Test-Path $slog) -and (Select-String -Path $slog -Pattern 'GRID-ABORT' -Quiet)
            $sdone = (Test-Path $slog) -and (Select-String -Path $slog -Pattern '全手順完了' -Quiet)
            $skeys = if (Test-Path $slog) { @(Select-String -Path $slog -Pattern '\] KEY ').Count } else { 0 }
            if ($sabort -or -not $sdone -or $skeys -eq 0) {
              "collect: 実行できなかった(INVALID, rc=3) GRID-ABORT=$sabort 完走マーカー=$sdone KEY行=$skeys。ログの [GRID-ABORT] reason 等を参照" | Tee-Object -FilePath result.txt
              $global:LASTEXITCODE = 3
            } else {
              "collect: 判定なし(ログ回収のみ, rc=0) KEY行=$skeys。解析はローカルで grid_learn.py / effect_learning.py / cycle.py" | Tee-Object -FilePath result.txt
              $global:LASTEXITCODE = 0
            }
          } elseif ('${{ matrix.cfg.check }}' -eq 'vkprobe') {
            python tools\e2e\ime_key_matrix\vkprobe_report.py dist\ime_key_matrix_spike.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'consistency') {
            $chkArgs = @()
            if ('${{ matrix.cfg.awase }}' -eq 'false') { $chkArgs += '--real-only' }
            python tools\e2e\ime_key_matrix\check_consistency.py @chkArgs dist\ime_key_matrix_spike.log dist\awase.log | Tee-Object -FilePath result.txt
          } else {
            python tools\e2e\ime_key_matrix\check.py dist\ime_key_matrix_spike.log awase-filtered.log | Tee-Object -FilePath result.txt
          }
          $rc = $LASTEXITCODE
          "rc=$rc" | Out-File -FilePath rc.txt -Encoding ascii
          "exit code: $rc"
          Get-Process awase, awase-settings, java, javaw, soffice, soffice.bin, ime_key_matrix_spike, typing_stress, chrome, compartment_notify_probe, compartment_notify_probe_diag -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0

      # 不変条件(異常検出器): 上の期待表(rc.txt)とは別に数え、結果は invariants.json / inv_rc.txt に書く(summary が別の表で集計)。
      # awase を起動する構成だけ(awase=false の対照実験・probe 構成には awase.log が無い)。
      - name: 不変条件(異常検出器)を数える
        if: steps.gate.outputs.skip != 'true' && matrix.cfg.awase != 'false' && matrix.cfg.probe == ''
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          python tools\e2e\ime_key_matrix\check_invariants.py --config '${{ matrix.cfg.name }}' --json invariants.json dist\awase.log | Tee-Object -FilePath invariants.txt
          "inv_rc=$LASTEXITCODE" | Out-File -FilePath inv_rc.txt -Encoding ascii
          exit 0

      # run の汚れ(物理キーの混入・CPU 負荷)を数える。BUG-147 は人の入力の混入を見落として誤認した前例。
      # 既定は情報のみ(validity.json を summary が別の表で集計)。E2E_VALIDITY_ENFORCE=1 にすると、
      # CONTAMINATED の run の rc を 3(INVALID)に書き換え、期待表の判定から外す。chrome_probe など一部の注入は
      # extra=0 のままなので、強制する前に summary の「混入」列で件数を観察する。
      - name: run の汚れ(物理キー混入・CPU 負荷)を数える
        if: always() && steps.gate.outputs.skip != 'true' && matrix.cfg.awase != 'false' && matrix.cfg.probe == ''
        shell: pwsh
        env:
          E2E_VALIDITY_ENFORCE: ${{ vars.E2E_VALIDITY_ENFORCE || '0' }}
        run: |
          $env:PYTHONUTF8 = '1'
          if (Test-Path cpu.pid) { Stop-Process -Id ([int](Get-Content cpu.pid)) -Force -ErrorAction SilentlyContinue }
          if (Test-Path dist\awase.log) {
            $cpuArgs = @(); if (Test-Path cpu.csv) { $cpuArgs = @('--cpu', 'cpu.csv') }
            python tools\e2e\ime_key_matrix\check_run_validity.py @cpuArgs --json validity.json dist\awase.log | Tee-Object -FilePath validity.txt
            $vrc = $LASTEXITCODE
            if ($vrc -eq 3 -and $env:E2E_VALIDITY_ENFORCE -eq '1' -and (Test-Path rc.txt)) {
              $old = (Get-Content rc.txt -Raw).Trim()
              if ($old -ne 'rc=3') {
                "rc=3" | Out-File -FilePath rc.txt -Encoding ascii
                "run が汚れているため INVALID(rc=3)に書き換え(元: $old)" | Tee-Object -FilePath validity.txt -Append
              }
            }
          }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.cfg.name }}-${{ matrix.run }}
          path: |
            result.txt
            rc.txt
            dist/ime_key_matrix_spike.log
            dist/typing_stress.log
            typing.json
            reopen.json
            preedit.json
            keymatrix.json
            offrca.json
            env.txt
            dist/compartment_notify_probe.log
            dist/compartment_notify_probe_diag.log
            dist/awase.log
            dist/chrome_probe.log
            awase-stderr.log
            awase-filtered.log
            invariants.txt
            invariants.json
            inv_rc.txt
            validity.txt
            validity.json
            cpu.csv
          retention-days: 7

  summary:
    needs: [plan, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Wilson 区間(stats_util.py)を使うため。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/e2e/ime_key_matrix
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - name: 構成ごとに集計して期待と照合する
        shell: python
        env:
          CONFIGS: ${{ needs.plan.outputs.configs }}
          GATE_MODE: ${{ inputs.gate_mode || '' }}
        run: |
          import json, os, re, sys
          sys.path.insert(0, 'tools/e2e/ime_key_matrix')
          from stats_util import format_rate
          configs = json.loads(os.environ['CONFIGS'])
          rows, bad = [], False
          for c in configs:
            n = dict(pass_=0, fail=0, invalid=0, missing=0)
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/rc.txt"
              if not os.path.exists(f):
                n['missing'] += 1
                continue
              rc = int(re.search(r'rc=(\d+)', open(f).read()).group(1))
              n['pass_' if rc == 0 else 'invalid' if rc == 3 else 'fail'] += 1
            valid = n['pass_'] + n['fail']
            # expect=pass: 有効な回にFAILが1つも無い / expect=fail: 有効な回が全部PASSではない(=撤去で壊れた)。
            # 有効回が無ければ判定不能。
            # expect=observe は何も表明しない構成なので、判定不能でもゲートは落とさない(表には『観測(判定不能)』と出す)。
            # sc-t1e-f13-toggle(runs=1)が『実行中にフォーカスが外れた』で再現的に判定不能になりゲートが赤くなった件の対処。
            if valid == 0 and c['expect'] == 'observe':
              verdict = '観測(判定不能)'
            elif valid == 0:
              verdict = '判定不能'
            elif c['expect'] == 'observe':
              # 観測を放置しないための目印(合否には影響しない)。有効回が 2 回以上で結果が一方に揃っていれば、次の一手を示す。
              if valid >= 2 and n['fail'] == 0:
                verdict = '観測(全PASS=pass昇格候補)'
              elif valid >= 2 and n['pass_'] == 0:
                verdict = '観測(全FAIL=再現安定・fail固定候補)'
              else:
                verdict = '観測'
            elif c['expect'] == 'pass':
              verdict = 'OK' if n['fail'] == 0 else 'NG(期待PASSだがFAIL有り)'
            else:
              verdict = 'OK' if n['fail'] > 0 else 'NG(期待FAILだが全PASS=撤去しても壊れない)'
            bad |= not (verdict == 'OK' or verdict.startswith('観測'))
            rows.append(f"| {c['name']} | {c['expect']} | {c.get('check','expect')} | {n['pass_']} | {n['fail']} | {n['invalid']} | {n['missing']} | {verdict} |")
          out = ["## e2e-ime 撤去実験", "", "| 構成 | 期待 | 判定方式 | PASS | FAIL | INVALID | 欠落 | 判定 |", "|---|---|---|---|---|---|---|---|"] + rows
          # 不変条件(check_invariants.py、上限は tools/e2e/ime_key_matrix/invariant_limits.json)。期待表とは別に集計する。
          inv_rows, inv_bad = [], False
          for c in configs:
            if c.get('awase') == 'false' or c.get('probe'):
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/invariants.json"
              if not os.path.exists(f):
                inv_bad = True
                inv_rows.append(f"| {c['name']} | {run} | 欠落 | - | - | - | - | - | - | - | - | |")
                continue
              j = json.load(open(f, encoding='utf-8'))
              k = j.get('counts', {})
              over = ', '.join(r['key'] for r in j.get('rows', []) if r['message'].startswith('FAIL'))
              lower = ', '.join(r['key'] for r in j.get('rows', []) if '下げてよい' in r['message'])
              note = '; '.join(x for x in (over and f'超過: {over}', lower and f'上限を下げてよい: {lower}', j.get('reason', '')) if x)
              inv_bad |= j['verdict'] != 'OK'
              inv_rows.append(f"| {c['name']} | {run} | {j['verdict']} | {k.get('i1_startup_drift_no_intent', '-')} | {k.get('i1_drift_no_intent_total', '-')} | {k.get('i2_unwarranted', '-')} | {k.get('i3_self_injected_ime_mode_keys', '-')} | {k.get('i3_warrant_shadow_would_block', '-')} | {k.get('i5_stale_confirm_total', '-')} | {k.get('i5_first_char_stale_escape', '-')} | {k.get('i5_mid_word_stale_escape', '-')} | {note} |")
          if inv_rows:
            gate = os.environ.get('GATE_MODE') == 'invariants'
            out += ["", "## 不変条件(異常検出器)" + ("(このrunの合否)" if gate else "(情報のみ、合否は上の表)"), "",
                    "上限と対応するBUGは tools/e2e/ime_key_matrix/invariant_limits.json。各回の詳細は result-*/invariants.txt。", "",
                    "| 構成 | 回 | 判定 | I1 起動直後の意図なしdrift | I1 全体 | I2 Unwarranted | I3 自己注入IMEモードキー | I3 would_have_blocked | I5 StaleConfirm(情報) | I5 最初の文字のESC(情報) | I5 途中の語のESC(BUG-171、情報) | 備考 |",
                    "|---|---|---|---|---|---|---|---|---|---|---|---|"] + inv_rows
          # run の汚れ(check_run_validity.py): 物理キー(extra=0)の混入と CPU 負荷。既定は情報のみ(E2E_VALIDITY_ENFORCE=1 の run だけ rc を書き換え済み)。
          val_rows, val_dirty = [], 0
          for c in configs:
            if c.get('awase') == 'false' or c.get('probe'):
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/validity.json"
              if not os.path.exists(f):
                continue
              j = json.load(open(f, encoding='utf-8'))
              if j['verdict'] != 'CLEAN':
                val_dirty += 1
              fmt = lambda v: '-' if v is None else f'{v:.0f}'
              val_rows.append(f"| {c['name']} | {run} | {j['verdict']} | {j['foreign_down']} | {fmt(j.get('cpu_p95'))} | {fmt(j.get('cpu_max'))} | {'; '.join(j.get('reasons', []))} |")
          if val_rows:
            # 汚れた run だけ先頭に出す(全件は長いので、汚れが無ければ件数だけ)。
            dirty_rows = [r for r in val_rows if '| CONTAMINATED |' in r]
            out += ["", f"## run の汚れ(物理キー混入・CPU 負荷。{len(val_rows)} 件中 {val_dirty} 件が汚れ、情報のみ)", "",
                    "foreign=awase.log の `[engine-input]` で extra=0x0 の KeyDown 件数(人の入力、またはマーカー無しの注入。BUG-147 の教訓)。CPU=run 中の使用率 p95/最大(%)。"
                    "強制(汚れた run を INVALID にする)はリポジトリ変数 E2E_VALIDITY_ENFORCE=1。", ""]
            if dirty_rows:
              out += ["| 構成 | 回 | 判定 | foreign KeyDown | CPU p95 | CPU 最大 | 理由 |", "|---|---|---|---|---|---|---|"] + dirty_rows
            else:
              out += ["汚れた run はなし。"]
          # 入力先の profile と経路の件数(ADR-235 D1、情報のみ。合否は変えない)。4 件数がすべて 0 の回だけ行を出す(全件は長い)。
          path_total, path_zero_rows, prof_tally = 0, [], {}
          for c in configs:
            if c.get('awase') == 'false' or c.get('probe'):
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/validity.json"
              if not os.path.exists(f):
                continue
              j = json.load(open(f, encoding='utf-8'))
              p = j.get('paths')
              if p is None:
                continue
              path_total += 1
              fp, bp = j.get('focus_profile_before_typing'), j.get('bootstrap_profile')
              prof_tally[fp or '不明'] = prof_tally.get(fp or '不明', 0) + 1
              if not any(p.values()):
                path_zero_rows.append(f"| {c['name']} | {run} | {fp} | {bp} | 0 | 0 | 0 | 0 |")
          if path_total:
            out += ["", f"## 入力先の profile と経路の件数(ADR-235 D1。{path_total} 件中 {len(path_zero_rows)} 件が 4 件数すべて 0、情報のみ)", "",
                    "経路の件数 = awase.log の observed(開閉の観測)・drift(drift 補正)・unicode(`send_keys: mode=Unicode`)・external_change(ADR-205)の行数。"
                    "0 件の回は「経路に乗っていない」ので、「起きなかった」と読まないこと。"
                    "profile 列は `ImePolicyProfile` の値(`AppImeProfile` ではない)。「打鍵前の focus transition」が入力先の profile、"
                    "「bootstrap」は awase 起動時に前面にあった窓の profile で入力先とは限らない。", "",
                    "入力先の profile(打鍵前の focus transition)別の回数: " + ", ".join(f"{k}={v}" for k, v in sorted(prof_tally.items())), ""]
            if path_zero_rows:
              out += ["| 構成 | 回 | 入力先の profile(打鍵前の focus transition) | bootstrap の profile(入力先とは限らない) | observed | drift | unicode | external_change |",
                      "|---|---|---|---|---|---|---|---|"] + path_zero_rows
            else:
              out += ["4 件数がすべて 0 の回はなし。"]
          # 高速打鍵ストレス(ts-*): result.txt 末尾の TYPING_STRESS 行を表にする(崩れ方の内訳つき)。
          ts_rows = []
          for c in configs:
            if c.get('check') != 'typing':
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/result.txt"
              line = ''
              if os.path.exists(f):
                for l in open(f, encoding='utf-8', errors='replace').read().splitlines():
                  if l.startswith('TYPING_STRESS:'):
                    line = l
              kv = dict(re.findall(r'(\w+)=(\S+)', line))
              if not kv:
                ts_rows.append(f"| {c['name']} | {run} | 欠落 | - | - | - | - | - | - | - | - | - | - |")
                continue
              try: fail_rate = format_rate(int(kv.get('fail')), int(kv.get('trials')))
              except (TypeError, ValueError): fail_rate = '-'
              ts_rows.append(f"| {c['name']} | {run} | {kv.get('verdict')} | {kv.get('trials')} | {kv.get('fail')} | {fail_rate} | {kv.get('loss')} | {kv.get('extra')} | {kv.get('reorder')} | {kv.get('literal')} | {kv.get('substitute')} | {kv.get('inject_late_max_us')} | {kv.get('hook_seen_min_ratio')} |")
          if ts_rows:
            out += ["", "## 高速打鍵ストレス(ts-*・tsx-*、判定は入力先のテキストと期待文字列の比較。検出のみで合否には含めない)", "",
                    "loss=消失 / extra=余計 / reorder=入れ替わり / literal=ローマ字リテラル化 / substitute=別のかなに置換。注入遅れmax=予定時刻に対する実注入の最大遅れ(us)、フック到着比=自プロセスのLLフックに届いた数/送信数の最小(1.000で落ち無し)。", "",
                    "FAIL率=FAIL試行/試行の Wilson 95% 区間。n が小さいので『0 件』でも上限は 0 にならない(例 0/10 は 0〜28%)。", "",
                    "| 構成 | 回 | 判定 | 試行 | FAIL試行 | FAIL率(95%区間) | 消失 | 余計 | 入れ替わり | リテラル化 | 置換 | 注入遅れmax(us) | フック到着比 |",
                    "|---|---|---|---|---|---|---|---|---|---|---|---|---|"] + ts_rows
          startup_rows = []
          for c in configs:
            if c.get('check') != 'startup': continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/result.txt"; line = ''
              if os.path.exists(f):
                line = next((l for l in reversed(open(f, encoding='utf-8', errors='replace').read().splitlines()) if l.startswith('STARTUP:')), '')
              kv = dict(re.findall(r'(\w+)=(\S+)', line))
              startup_rows.append(f"| {c['name']} | {run} | {kv.get('verdict','欠落')} | {kv.get('drift','-')} | {kv.get('align','-')} | {kv.get('reinit','-')} | {kv.get('imm32_default_on','-')} | {kv.get('first_engine_ms','-')} | {kv.get('open_before','-')} | {kv.get('text_class','-')} |")
          if startup_rows:
            out += ["", "## D1 起動状態・最初の打鍵(sc-startup-*)", "",
                    "Imm32 default ON は観察件数で合否には含めない。engine-input は awase 起動から最初の入力までの ms。open_before=打鍵直前の IMC_GETOPENSTATUS(open/closed/unknown)、text_class=打鍵結果(kana=か / ka=ローマ字リテラル / raw=NICOLA の生キー文字 / other)。", "",
                    "| 構成 | 回 | 判定 | drift(30秒) | startup-align | OFF直後reinit | Imm32 default ON | engine-input ms | open_before | text_class |",
                    "|---|---|---|---|---|---|---|---|---|---|"] + startup_rows
          # drift correction 観測(cal-drift-*、ADR-191 09-T4): result.txt 末尾の DRIFT_CORRECTION 行を表にする。
          drift_rows = []
          for c in configs:
            if c.get('check') != 'driftcorrection':
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/result.txt"
              line = ''
              if os.path.exists(f):
                for l in open(f, encoding='utf-8', errors='replace').read().splitlines():
                  if l.startswith('DRIFT_CORRECTION:'):
                    line = l
              kv = dict(re.findall(r'(\w+)=(\S+)', line))
              if not kv:
                drift_rows.append(f"| {c['name']} | {run} | 欠落 | - | - | - | - |")
                continue
              drift_rows.append(f"| {c['name']} | {run} | {kv.get('verdict')} | {kv.get('trials')} | {kv.get('reverted_to_on')} | {kv.get('never_closed')} | {kv.get('drift_log_fired')} |")
          if drift_rows:
            out += ["", "## drift correction 観測(cal-drift-*、判定はまだ観測段階。expect=observeなので合否には含めない。ADR-191 09-T4/BUG-020)", "",
                    "reverted_to_on=OFF後いったん閉じてから再度開いた試行数(BUG-020型の候補) / never_closed=どのチェックポイントでも一度も閉じなかった試行数(OFFが効いていない) / drift_log_fired=awase.logの`Blacklist drift correction`行数(参考値)。", "",
                    "| 構成 | 回 | 判定 | 試行 | 復帰試行数 | OFF不発試行数 | drift発火行数 |",
                    "|---|---|---|---|---|---|---|"] + drift_rows
          # ON 回復観測(cal-driftrec-*、ADR-178 領域A撤去後): result.txt 末尾の DRIFT_RECOVERY 行を表にする。
          rec_rows = []
          for c in configs:
            if c.get('check') != 'driftrecovery':
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/result.txt"
              line = ''
              if os.path.exists(f):
                for l in open(f, encoding='utf-8', errors='replace').read().splitlines():
                  if l.startswith('DRIFT_RECOVERY:'):
                    line = l
              kv = dict(re.findall(r'(\w+)=(\S+)', line))
              if not kv:
                rec_rows.append(f"| {c['name']} | {run} | 欠落 |" + " - |" * 14)
                continue
              rec_rows.append(f"| {c['name']} | {run} | {kv.get('verdict')} | {kv.get('trials')} | {kv.get('recovered')} | {kv.get('reopened_by_typing')} | {kv.get('typed_blind')} | {kv.get('unexplained')} | {kv.get('api_only')} | {kv.get('not_recovered')} | {kv.get('invalid_trials')} | {kv.get('observed')} | {kv.get('drift')} | {kv.get('conv_read')} | {kv.get('reinit')} | {kv.get('unicode')} | {kv.get('intent_true')} |")
          # 物理 Ctrl+無変換変種(sc-driftrecovery-ctrlmuhenkan-*): rec_rows の列は意味が違う(recovered=corrected)ので別表にする。
          rec_rows = [r for r in rec_rows if not r.startswith('| sc-driftrecovery-ctrlmuhenkan-')]
          ctrl_rows2 = []
          for c in configs:
            if not c['name'].startswith('sc-driftrecovery-ctrlmuhenkan-'):
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/result.txt"
              line = ''
              if os.path.exists(f):
                for l in open(f, encoding='utf-8', errors='replace').read().splitlines():
                  if l.startswith('DRIFT_RECOVERY:'):
                    line = l
              kv = dict(re.findall(r'(\w+)=(\S+)', line))
              ctrl_rows2.append(f"| {c['name']} | {run} | {kv.get('verdict', '欠落')} | {kv.get('trials', '-')} | {kv.get('phys_ctrl_ok', '-')} | {kv.get('gap_made', '-')} | {kv.get('gap_not_made', '-')} | {kv.get('recovered', '-')} | {kv.get('not_recovered', '-')} | {kv.get('invalid_trials', '-')} | {kv.get('observed', '-')} | {kv.get('drift', '-')} |")
          if ctrl_rows2:
            out += ["", "## D3 物理 Ctrl+無変換で OFF にした変種(sc-driftrecovery-ctrlmuhenkan-*、観測のみ)", "",
                    "OFF 操作=マーカー付き SendInput の Ctrl↓→無変換↓↑→Ctrl↑(debug awase は物理 Ctrl+無変換として扱う)。phys_ctrl_ok=awase.log で物理 Ctrl 付き(mods(c=true…) phys_ctrl=true)を確認できた試行数(false は INVALID)。gap_made=OFF 操作の後も実 IME が ON のままだった(ずれを作れた)試行数 / gap_not_made=OFF が実 IME まで効きずれは作れなかった試行数 / corrected=ずれた後 ON のままではなくなった / not_corrected=ずれたまま最後まで ON でかなが出た。verdict: GAP_NOT_MADE=ずれを作れなかった、CORRECTED、NOT_CORRECTED、UNDETERMINED、INVALID。", "",
                    "| 構成 | 回 | 判定 | 試行 | phys_ctrl_ok | gap_made | gap_not_made | corrected | not_corrected | invalid | observed | drift |",
                    "|---|---|---|---|---|---|---|---|---|---|---|---|"] + ctrl_rows2
          if rec_rows:
            out += ["", "## drift correction による ON 回復観測(cal-driftrec-*、観測のみで合否には含めない。ADR-178 領域A撤去後)", "",
                    "ハーネスが実 IME を直接閉じた「ずれ」から、awase の drift correction だけで ON へ戻るか。各数は「その現象があった試行数」。recovered=打鍵前に API 上も開き直り実打鍵でかなが出た / reopened_by_typing=3秒間は閉じたまま打鍵後に開いた(打鍵時の別経路=GJI reinit 等) / typed_blind=かなは出たが Unicode 注入で IME 状態の証拠にならない(edit は ON キーと無関係に常に Unicode 注入) / unexplained=原因不明でかなが出た / api_only=API上は開いたが実打鍵が期待と違う / not_recovered=API上も閉じたままで実打鍵も生ローマ字等 / invalid=前提未成立(VK_IME_ON 以外で ON、明示意図 ON 未確認、窓の逆転等)。awase.log の時間窓: observed・drift=閉じてから打鍵直前まで(observed=ImeModel への開閉観測、0なら drift correction の判断まで届いていない。drift=drift correction の発火) / conv_read・reinit・unicode=打鍵中〜確定後(conv_read=打鍵時に conv を読んだ、reinit=literal 回収の GJI reinit、unicode=Unicode 注入)。verdict: NOT_OBSERVED=戻さないのではなく見ていない、REOPENED_BY_OTHER_PATH=drift correction 以外の経路が開け直した。", "",
                    "| 構成 | 回 | 判定 | 試行 | recovered | reopened_by_typing | typed_blind | unexplained | api_only | not_recovered | invalid | observed | drift | conv_read | reinit | unicode | intent_true |",
                    "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"] + rec_rows
          # 物理 OFF→ON の開き直し観測(sc-reopen-*、ADR-203 e2e (c)・BUG-170): result.txt 末尾の REOPEN 行を表にする。
          reopen_rows = []
          for c in configs:
            if c.get('check') != 'reopen':
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/result.txt"
              line = ''
              if os.path.exists(f):
                for l in open(f, encoding='utf-8', errors='replace').read().splitlines():
                  if l.startswith('REOPEN:'):
                    line = l
              kv = dict(re.findall(r'(\w+)=(\S+)', line))
              if not kv:
                reopen_rows.append(f"| {c['name']} | {run} | 欠落 |" + " - |" * 9)
                continue
              reopen_rows.append(f"| {c['name']} | {run} | {kv.get('verdict')} | {kv.get('pass')} | {kv.get('fail')} | {kv.get('invalid')} | {kv.get('blind')} | {kv.get('require_cold')} | {kv.get('first_vk_cold')} | {kv.get('press_vk_p50_ms')}/{kv.get('press_vk_max_ms')} | {kv.get('confirm_p50_ms')}/{kv.get('confirm_max_ms')} |")
          if reopen_rows:
            out += ["", "## 物理 OFF→ON の開き直し観測(sc-reopen-*、ADR-203 e2e (c)・BUG-170。expect=observe なので合否には含めない)", "",
                    "pass/fail/invalid/blind=試行数(blind=Unicode 注入で IME 状態の証拠にならない試行)。fail は「ON 直後の語が期待と違う」「OffCold 固着(StartComposition while engine off)」「StaleConfirm/flush の escape=true」"
                    "「ON 後も実 IME が閉じている」「(require_cold のとき)最初の語が warm 経路」。first_vk_cold=最初の [vk-send] が cold 経路(prepend_f2_warmup=true)だった試行数。"
                    "打鍵→vk-send=ON キー押下の打鍵から最初の [vk-send] まで(同時打鍵待ちと押下時間を含む、p50/最大 ms)、セッション確認=その [vk-send] から `per-VK 全 VK 確認済み → セッション確認` まで(ADR-203 D2 の定義、p50/最大 ms)。", "",
                    "| 構成 | 回 | 判定 | pass | fail | invalid | blind | require_cold | first_vk_cold | 打鍵→vk-send | セッション確認 |",
                    "|---|---|---|---|---|---|---|---|---|---|---|"] + reopen_rows
          # 未確定文字の読み取り可否(sc-preedit-*、check_preedit.py): 手段ごとの right/wrong/unavailable を表にする。
          pre_rows = []
          for c in configs:
            if c.get('check') != 'preedit':
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/preedit.json"
              if not os.path.exists(f):
                pre_rows.append(f"| {c['name']} | {run} | 欠落 |" + " - |" * 7)
                continue
              j = json.load(open(f, encoding='utf-8'))
              cn = j['counts']
              rw = lambda m: f"{cn[m]['right']}/{cn[m]['wrong']}/{cn[m]['unavailable']}"
              pre_rows.append(f"| {c['name']} | {run} | {j['verdict']} | {j.get('end')} | {j['methods']['uia']} ({rw('uia')}) | {j['methods']['imm']} ({rw('imm')}) | {j.get('n')} | {j.get('text_leak')} |")
          if pre_rows:
            out += ["", "## 未確定文字(preedit)の読み取り可否(sc-preedit-*、観測のみ)", "",
                    "かな 1〜2 打(確定前)の phase で、手段が真値どおりに読めたか。括弧は 正解/誤り/読めず。READS=全部正解 / PARTIAL=誤りは無いが一部読めず / UNUSABLE=誤りがある、または正解が 0。"
                    "uia=UIA GetActiveComposition(別プロセスでも可)、imm=自プロセスの窓の ImmGetCompositionString。text_leak=composing 中に本文へ出た件数(IMM32 窓では 0 のはず)。", "",
                    "| 構成 | 回 | 判定 | 終端 | uia | imm | 試行 | text_leak |", "|---|---|---|---|---|---|---|---|"] + pre_rows
          # ADR-208 L3b(sc-keymatrix-*): result.txt の KEYMATRIX_CELL 行(1セル1行)を表にする。
          km_rows = []
          for c in configs:
            if c.get('check') != 'keymatrix':
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/result.txt"
              cell_lines = []
              if os.path.exists(f):
                cell_lines = [l for l in open(f, encoding='utf-8', errors='replace').read().splitlines() if l.startswith('KEYMATRIX_CELL:')]
              if not cell_lines:
                km_rows.append(f"| {c['name']} | 欠落 |" + " - |" * 10)
                continue
              for l in cell_lines:
                kv = dict(re.findall(r'(\w+)=(\S+)', l))
                km_rows.append(f"| {c['name']} | {kv.get('cell')} | {kv.get('verdict')} | {kv.get('pass')} | {kv.get('target')} | {kv.get('made')}/{kv.get('n')} | {kv.get('c1')} | {kv.get('c2')} | {kv.get('late')} | {kv.get('stuck')} | {kv.get('gap_not_made')}/{kv.get('invalid')} | {kv.get('e2')} {kv.get('fresh_fail_rate')} |")
          if km_rows:
            out += ["", "## ADR-208 L3b ずれの作り方 × 明示キー行列(sc-keymatrix-*)", "",
                    "セル=`キー=種別:ずれ`(種別 on/off=絶対、tog=トグル。ずれ close=awase に ON を書かせた後に実 IME を外から閉じる(S-1)、open=OFF を書かせた後に外から開く、fresh=awase 再起動直後で belief・applied が未知、sync=ずれなし)。"
                    "made/n=ずれを作れた試行/全試行。c1/c2/late/stuck=1押下目/2押下目/3押下目で目標に一致/3回押しても不一致。"
                    "判定: CONVERGED_1=全試行が1押下で一致 / CONVERGED_2=2押下まで(トグルなら合格、絶対キーは1押下の保証違反) / CONVERGED_LATE / STUCK=固着 / "
                    "ENV_EXCEPTION=MS-IME × 実 Chrome の OFF 方向で、fresh の対照も同じ程度に失敗(環境の例外、ADR-208 決定4 の E2) / GAP_NOT_MADE=ずれを作れなかった / INVALID。"
                    "pass=絶対は1押下、トグルは2押下以内で一致。E2 列=例外セルの照合結果(fresh_similar=新鮮でも同じ程度に失敗→環境、fresh_ok=新鮮だと閉じる→内部状態による固着、no_fresh_cell=対照セルなし)と fresh の失敗率。", "",
                    "| 構成 | セル | 判定 | pass | 目標 | made/n | 1押下 | 2押下 | 3押下 | 固着 | gap_not_made/invalid | E2 |",
                    "|---|---|---|---|---|---|---|---|---|---|---|---|"] + km_rows
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('\n'.join(out) + '\n')
          print('\n'.join(out))
          if os.environ.get('GATE_MODE') == 'invariants':
            sys.exit(1 if inv_bad or not inv_rows else 0)
          sys.exit(1 if bad else 0)
