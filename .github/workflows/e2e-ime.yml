name: e2e-ime

# 実機E2E(GJI ATOK × awase、tools/e2e/ime_key_matrix)を GitHub-hosted の Windows ランナーで回す。
# 撤去実験(ablations/aN-*.sh)を構成ごとに並列ジョブへ展開し、各構成を RUNS 回ずつ実行して
# 期待(expect)どおりの結果になるかを最後の summary ジョブで集計する(ADR-186)。
#
#   build(構成ごと) → e2e(構成×回数) → summary
#
# 通常のCI(ci.yml)には影響しない。ci/e2e-ime ブランチへの関連ファイルの push と手動起動でだけ動く。
# ci/e2e-scenarios ブランチへの push は、操作シナリオ(名前が sc- で始まる構成、下のplan参照)だけを回す。
# ci/e2e-calibration ブランチへの push は、ADR-191 の学習/検証ラウンド(名前が cal- で始まる構成)だけを回す。
# ci/e2e-typing-stress ブランチへの push は、高速打鍵ストレス(名前が ts- で始まる構成、examples/typing_stress.rs)だけを回す。
# (workflow_dispatch は既定ブランチにワークフローが無いと使えないので、構成を絞るには only 入力かこのブランチを使う)
#
# awase を起動する構成では、期待表(expect/rc)とは別に、ログの不変条件(異常検出器、check_invariants.py と
# invariant_limits.json)も数えて summary に別の表で出す。既定では情報のみで、期待表の判定(終了コード)は変えない。
# e2e-ime-smoke.yml(PR ゲート)は workflow_call で gate_mode=invariants を渡し、不変条件だけで合否を決める。
on:
  workflow_call:
    inputs:
      only:
        description: '実行する構成名(workflow_dispatch の only と同じ書式)'
        type: string
        required: false
        default: ''
      runs:
        description: '各構成の実行回数の上書き(空なら構成ごとの runs)'
        type: string
        required: false
        default: ''
      gate_mode:
        description: "summary の合否: ''=期待表(expect/rc)で決める(既定) / 'invariants'=不変条件だけで決める(期待表は表示のみ)"
        type: string
        required: false
        default: ''
  push:
    branches: [ci/e2e-ime, ci/e2e-scenarios, ci/e2e-calibration, ci/e2e-typing-stress]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tools/e2e/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/e2e-ime.yml'
  workflow_dispatch:
    inputs:
      only:
        description: '実行する構成名(カンマ区切り、空なら全構成、末尾*は前方一致)。例: baseline,a5-no-refresh20,sc-*'
        required: false
        default: ''

# smoke ゲート(下の gate ステップ)が同じ run のジョブ一覧を読むため actions: read が要る。
permissions:
  contents: read
  actions: read

# 同じ ref への push が続いたとき、古い run(重複実行)を止める。
# ただし ci/e2e-calibration では、小さな push(README・スクリプトの修正)で走行中の長い(最大55分の)学習ジョブ群を
# 全部キャンセルしないよう、cancel-in-progress を無効にする。
concurrency:
  group: e2e-ime-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'ci/e2e-calibration' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.p.outputs.configs }}
      builds: ${{ steps.p.outputs.builds }}
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - id: p
        shell: python
        env:
          ONLY: ${{ inputs.only || (github.ref_name == 'ci/e2e-scenarios' && 'sc-*') || (github.ref_name == 'ci/e2e-calibration' && 'cal-*') || (github.ref_name == 'ci/e2e-typing-stress' && 'ts-tsf-gji-2ms,ts-edit-msime-10ms') || '' }}
          # ONLY が空(ci/e2e-ime への push、workflow_dispatch の only 空)のときは cal-*(学習/検証ラウンド。47構成・計 約24.7時間ぶんの上限時間)と ts-*(高速打鍵ストレス)を除く。
          # cal-* を走らせるには only='cal-*' を渡すか、ci/e2e-calibration ブランチを使う。
          EXCLUDE_CAL_WHEN_EMPTY: '1'
          # workflow_call の runs 入力(空なら構成ごとの runs のまま)
          RUNS: ${{ inputs.runs || '' }}
        run: |
          import json, os
          # name: 構成名 / bin: 使うビルド成果物(撤去なしの構成は baseline を使い回す) / mutator: ablations/ 下のスクリプト
          # (空=変更なし) / args: スパイクの追加引数
          # keymap: GJI の session_keymap(1=ATOK, 2=MS-IME) / custom_table: config1.db に古い custom_keymap_table
          # (変換=IMEOn)を残すか / check: expect=ATOK前提の期待表(check.py)、consistency=プリセット非依存で
          # 「実IMEのかな=Engine ON、英数・直接入力=Engine OFF」に追随するか(check_consistency.py、--walk)、
          # collect=判定せずログを回収し、「実行できなかった」(GRID-ABORT・完走マーカー無し・KEY 行0件)だけを rc=3=INVALID にする(cal-* 用。expect=observe と組み合わせる。解析はローカル)
          # expect: pass=全回PASS / fail=撤去や設定で壊れる(既知の問題を固定) / observe=結果を表に出すだけ(不安定・未確定の観測用)
          # ime: gji=Google日本語入力(chocolatey) / msime=Microsoft IME(標準の日本語IME)
          # 撤去実験の根拠は docs/adr/186-*.md。a3(eisu reset抑止)は撤去済みのため無い。
          # keys: config.toml の [keys] に足す/上書きする行(;区切り)。[keys] が無ければ末尾に作る
          # general: config.toml の [general] に足す/上書きする行(;区切り)。例: 'half_width_alnum_toggle = "all"'
          def cfg(name, expect, mutator='', args='', keymap=1, custom_table='false', check='expect', bin=None, ime='gji', awase='true', cache='works', runs=3, wait=330, gate='', general='', probe='', probe_bin='compartment_notify_probe', legacy_custom='false', stress='', keys=''):
            return dict(name=name, bin=bin or (name if mutator else 'baseline'), mutator=mutator, args=args,
                        keymap=keymap, custom_table=custom_table, check=check, expect=expect, ime=ime, awase=awase, cache=cache, runs=runs, wait=wait, gate=gate, general=general, probe=probe, probe_bin=probe_bin, legacy_custom=legacy_custom, stress=stress, keys=keys)
          SC_IMES = [('msime-native', 'msime', 1, ' --msime'), ('gji-msime', 'gji', 2, ''), ('gji-atok', 'gji', 1, '')]
          configs = [
            # --- 撤去実験(ATOK、実機E1〜E7bと同じ) ---
            cfg('baseline', 'pass'),
            cfg('baseline-henkan', 'pass', args='--key=henkan', custom_table='true'),
            cfg('a4-no-eisu-reset', 'pass', mutator='a4-no-eisu-reset.sh'),
            cfg('a5-no-refresh20', 'fail', mutator='a5-no-refresh20.sh'),
            cfg('a6-no-idle-check', 'pass', mutator='a6-no-idle-check.sh'),
            # --- プリセット/設定の確認(ビルドは baseline、consistency 判定) ---
            # フォーカス直後(意図なし)にいきなり無変換/変換を押す(--cold=先頭のひらがなを除く)
            cfg('atok-passthrough-cold', 'pass', check='consistency', args='--walk --cold'),
            cfg('atok-passthrough-henkan-cold', 'pass', check='consistency', args='--walk --cold --key=henkan'),
            # 半角/全角(0xF3/0xF4、GJIではどちらも開閉トグル)。awaseがVKで方向を決め打つとずれる(ADR-186決定5、ADR-189)
            cfg('msime-hz', 'pass', check='toggle', args='--hz', keymap=2),
            cfg('atok-hz', 'pass', check='toggle', args='--hz'),
            # リセット操作(Ctrl+無変換→Ctrl+変換 / 逆)で必ず揃うか(--resync)。nofollow は followを無効化してずれを意図的に起こす
            cfg('atok-resync', 'observe', check='resync', args='--resync'),
            cfg('atok-resync-nofollow', 'observe', mutator='a7-no-follow.sh', check='resync', args='--resync'),
            cfg('atok-resync-gap40', 'observe', check='resync', args='--resync --resync-gap=40'),
            cfg('atok-resync-gap300', 'observe', check='resync', args='--resync --resync-gap=300'),
            cfg('atok-passthrough', 'pass', check='consistency', args='--walk'),
            cfg('atok-passthrough-henkan', 'pass', check='consistency', args='--walk --key=henkan'),
            cfg('msime', 'pass', check='consistency', args='--walk', keymap=2),
            # --- Microsoft IME 本体(GJI を入れず、ja-JP の言語を追加して標準の日本語IMEを使う) ---
            cfg('msime-native', 'observe', check='consistency', args='--walk --msime', ime='msime'),
            cfg('msime-native-henkan', 'observe', check='consistency', args='--walk --msime --key=henkan', ime='msime'),
            # 対照実験: awase を起動せず、同じキー列で実IMEだけを見る(実IMEの推移がawaseのせいかCI環境の癖かを分ける)
            cfg('msime-native-noawase', 'observe', check='consistency', args='--walk --msime', ime='msime', awase='false'),
            cfg('atok-noawase', 'observe', check='consistency', args='--walk', awase='false'),
            # --- ひらがなキーの正しいVK調べ(--vkprobe、awaseなし) ---
            cfg('probe-vk-gji-atok', 'observe', check='vkprobe', args='--vkprobe', awase='false'),
            cfg('probe-vk-gji-msime', 'observe', check='vkprobe', args='--vkprobe', keymap=2, awase='false'),
            cfg('probe-vk-msime-native', 'observe', check='vkprobe', args='--vkprobe --msime', ime='msime', awase='false'),
            # --- ADR-191 の検証ラウンド(ci/e2e-calibration ブランチ。check='collect'=判定せずログを回収し、「実行できなかった」(GRID-ABORT・完走マーカー無し・KEY 行0件)だけを rc=3=INVALID にする。cal-verify-* は打鍵時予測を持つ awase のビルドで意味を持つ) ---
            # walk: 撤去ブランチ(打鍵時予測ビルド)+ AWASE_TEST_INJECTION=1 でランダムなキー列を流し、Engine と実IMEのずれを
            # ローカルで解析する(effect_learning.py --drift、DRIFT_OFF=100/400/1500)。cache=works は観測あり、
            # cache=unavailable は awase が IME を読めないアプリ相当(スパイク窓を「IMM不可」に固定)で、予測だけが Engine を動かす。
            *[cfg(f'cal-verify-{kind}-s{seed}', 'observe', check='collect', cache=cache, runs=1,
                  args=f'--walk=100 --seed={seed}')
              for kind, cache in (('obs', 'works'), ('blind', 'unavailable')) for seed in (1, 2)],
            cfg('cal-walk-noawase-s5', 'observe', check='collect', awase='false', runs=1, args='--walk=100 --seed=5'),
            # --- ADR-191 学習ラウンド 第1版(cal-grid-*): 状態を IMM で書いて作る。**学習に使ってはいけない**(IMM で書いた変換モードは、キーで入った状態と別物で、ATOK のひらがなが「不変」と誤学習される。比較・経緯の記録用。学習は cal-gridk3-* / cal-fast-* / cal-notify-*)。 ---
            # (状態: 開閉×入力モード×入力中の段階=30状態を IMM で決定的に作り、キーの効果を格子状に網羅する)
            # (awase なし=IME単体の効果。--grid=シャード、キーのグループで4分割。プリセット ATOK=keymap 1 / MS-IME=keymap 2)
            # cal-grid-smoke は動作確認用(各セル1回)。所要は約 20〜35 分/シャード(wait=秒)。
            cfg('cal-grid-smoke', 'observe', check='collect', awase='false', runs=1, wait=1500, args='--grid=s4 --grid-trials=1'),
            *[cfg(f'cal-grid-{pre}-{sh}', 'observe', check='collect', awase='false', runs=1, wait=3300, keymap=km,
                  args=f'--grid={sh}')
              for pre, km in (('atok', 1), ('msime', 2)) for sh in ('s1', 's2', 's3', 's4')],
            # 第3版: 全ての状態をキーだけで作る(--grid-setup=keys。リセットも IMM を使わず、観測しながら IME_ON/ひらがなで(開,0x19)へ戻す)。
            # 第2版(リセットだけ IMM=--grid-setup=keys-immreset)は、IMM で書いた 0x19 が GJI の内部状態と食い違い、モード切替キーの結果が実際と違った。
            # smoke は受け入れ基準の確認用: ATOK s1(ひらがな 0x19→0x10、0x10→0x19)、MS-IME s2(カタカナ 0x19→0x1B)。
            cfg('cal-gridk3-smoke-atok', 'observe', check='collect', awase='false', runs=1, wait=1800, keymap=1,
                args='--grid=s1 --grid-setup=keys --grid-trials=1'),
            cfg('cal-gridk3-smoke-msime', 'observe', check='collect', awase='false', runs=1, wait=1800, keymap=2,
                args='--grid=s2 --grid-setup=keys --grid-trials=1'),
            *[cfg(f'cal-gridk3-{pre}-{sh}', 'observe', check='collect', awase='false', runs=1, wait=3300, keymap=km,
                  args=f'--grid={sh} --grid-setup=keys --grid-trials=2')
              for pre, km in (('atok', 1), ('msime', 2)) for sh in ('s1', 's2', 's3', 's4')],
            # 高速化の検証(ci/e2e-calibration): 固定待ちを縮める --fast(+1500ms の観測を省く) と --speed=K(手順間の待ちをK倍速)。
            # 既存 CI ログ584押下で、(開閉,変換モード,入力中,入力欄末尾) は +100ms と +1500ms で 99.8% 一致(唯一の例外は次試行の準備操作の混入)。
            # cal-gridk3-atok-s1(遅い版)と同じ入力(--grid=s1 --grid-trials=2)で、所要時間と grid_learn.py --at=400 のセル表を比べる。
            *[cfg(f'cal-gridk3-fast-atok-s1-sp{k}', 'observe', check='collect', awase='false', runs=1, wait=1800, keymap=1,
                  args=f'--grid=s1 --grid-setup=keys --grid-trials=2 --fast --speed={k}')
              for k in (2, 4)],
            # --- ADR-191/193: 格子の待ちを compartment 変更通知の購読に置き換えられるか(ci/e2e-calibration) ---
            # cal-notify-probe-*: 前面化の失敗(WM_SETFOCUS 未処理)を直した診断コピー compartment_notify_probe_diag(awase なし)で、キー→NOTIFY/POLL の遅延を測る(ATOKのみ、gap=1500/600)。
            # 本体の compartment_notify_probe は ADR-193 の成果物で、CI では前面化に失敗して ABORT(キー0件)になる(patches/ の修正案が未適用)ので、本体を使う構成は置かない。
            # seq: IME_ON, ひらがな×2, カタカナ, 英数, 無変換, 変換, 半角/全角×2, Esc, k, a(入力中), Space(変換中), Enter, IME_OFF, IME_ON
            *[cfg(f'cal-notify-probe-atok-g{g}', 'observe', check='collect', awase='false', runs=1, wait=240, keymap=1,
                  probe_bin='compartment_notify_probe_diag',
                  probe=f'--seq=16,F2,F2,F1,F0,1D,1C,F3,F3,1B,4B,41,20,0D,1A,16 --gap={g} --poll=50')
              for g in (1500, 600)],
            # cal-notify-probe-diag: 前面化の戦略 S0〜S3 を順に試して DIAG 行に残す診断コピー(ADR-193 の本体は編集しない)。
            cfg('cal-notify-probe-diag', 'observe', check='collect', awase='false', runs=1, wait=240, keymap=1,
                probe_bin='compartment_notify_probe_diag',
                probe='--seq=16,F2,F2,F1,F0,1D,1C,F3,F3,1B,4B,41,20,0D,1A,16 --gap=1500 --poll=50'),
            # cal-notify-comp-s1: 入力中/変換中/確定のイベント(WM_IME_*/EN_CHANGE)も待ちの静止判定に使い、観測を +100ms だけにする(--snap100)。
            # cal-notify-atok-s1(--notify のみ)と表(grid_learn.py --at=100)・所要時間を比べる。
            cfg('cal-notify-comp-s1', 'observe', check='collect', awase='false', runs=1, wait=1500, keymap=1,
                args='--grid=s1 --grid-setup=keys --fast --speed=2 --grid-adaptive --notify --notify-comp --snap100 '
                     '--grid-retry-file=@REPO@/tools/e2e/ime_key_matrix/grid-tables/nondet-atok.txt'),
            # cal-notify-comp-atok: 入力中/変換中/確定のイベント(WM_IME_*, EN_CHANGE)が CI(GJI・Edit)で届くか(--notify-comp)。
            cfg('cal-notify-comp-atok', 'observe', check='collect', awase='false', runs=1, wait=900, keymap=1,
                args='--grid=s4 --grid-setup=keys --grid-trials=1 --fast --speed=2 --notify --notify-comp'),
            # cal-notify-atok-s{1..4}: cal-fast-atok-s*(--fast --speed=2 --grid-adaptive)に --notify を足した構成。所要時間・表の一致を遅い版/高速版と比べる。
            *[cfg(f'cal-notify-atok-s{n}', 'observe', check='collect', awase='false', runs=1, wait=1500, keymap=1,
                  args=f'--grid=s{n} --grid-setup=keys --fast --speed=2 --grid-adaptive --notify '
                       '--grid-retry-file=@REPO@/tools/e2e/ime_key_matrix/grid-tables/nondet-atok.txt')
              for n in (1, 2, 3, 4)],
            # --- MS-IME本体(Microsoft IME、ImeKind=MicrosoftIme)の学習ラウンド(ADR-191、撤去版レビュー指摘B Blocker の対処(2)) ---
            # cal-notify-msimenative-s{1..4}: cal-notify-atok-s*(--fast --speed=2 --grid-adaptive --notify)の MS-IME本体版(--msime、awase なし、状態はキーのみで作る)。
            # 前回の表(retry-file)が無いので --grid-retry-file は付けない(1パス目は全セル1回、2パス目は履歴依存ブロック+10%の監査標本)。
            # cal-msnative-walk-s{3,4}: 表の一段予測を採点する独立ラン(awase なし、--msime)。学習(格子)とは別のキー列。
            *[cfg(f'cal-notify-msimenative-s{n}', 'observe', check='collect', ime='msime', awase='false', runs=1, wait=1500,
                  args=f'--grid=s{n} --grid-setup=keys --fast --speed=2 --grid-adaptive --notify --msime')
              for n in (1, 2, 3, 4)],
            *[cfg(f'cal-msnative-walk-s{n}', 'observe', check='collect', ime='msime', awase='false', runs=1,
                  args=f'--walk=100 --seed={n} --msime')
              for n in (3, 4)],
            # --- 高速な学習ラウンド(ci/e2e-calibration) ---
            # --fast(押下後の待ち 2300→700ms。+400ms と +1500ms で表が変わらないことを264試行で確認済み) と --speed=2、
            # 探索後に到達不能な試行を外す([GRID-PRUNE])、--grid-adaptive(1パス目は全セル1回、2パス目は前回の表で非決定だったセル+履歴依存+10%の監査標本)、
            # セットアップ不能の連続で打ち切り([GRID-ABORT]→rc=3)。本番シャードは同じプリセットの smoke が成功してから中身を実行する(gate)。
            # cal-fast-val-* は速度の妥当性の比較用: 遅い版 cal-gridk3-atok-s1(--grid-trials=2)と同じ入力で --speed=1/4 を比べる。
            *[cfg(f'cal-fast-smoke-{pre}', 'observe', check='collect', awase='false', runs=1, wait=900, keymap=km,
                  args=f'--grid={sh} --grid-setup=keys --fast --speed=2 --grid-trials=1')
              for pre, km, sh in (('atok', 1, 's1'), ('msime', 2, 's2'))],
            *[cfg(f'cal-fast-{pre}-{sh}', 'observe', check='collect', awase='false', runs=1, wait=1500, keymap=km,
                  gate=f'cal-fast-smoke-{pre}',
                  args=f'--grid={sh} --grid-setup=keys --fast --speed=2 --grid-adaptive '
                       f'--grid-retry-file=@REPO@/tools/e2e/ime_key_matrix/grid-tables/nondet-{pre}.txt')
              for pre, km in (('atok', 1), ('msime', 2)) for sh in ('s1', 's2', 's3', 's4')],
            *[cfg(f'cal-fast-val-atok-s1-k{k}', 'observe', check='collect', awase='false', runs=1, wait=1500, keymap=1,
                  args=f'--grid=s1 --grid-setup=keys --grid-trials=2 --fast --speed={k}')
              for k in (1, 4)],
            cfg('msime-stale-table', 'pass', check='consistency', args='--walk --key=henkan', keymap=2, custom_table='true'),
            # --- 操作シナリオ(sc-): IMEプリセット × 各種IMEキー × パススルー/抑止設定 × Shift単独打鍵 ---
            # 判定はどれも「実IMEのかな=Engine ON、英数・直接入力=Engine OFF」に追随するか(consistency)。
            # 全シナリオ pass(MS-IME本体もADR-190/BUG-152の修正後はPASS。修正前は直接入力からの最初のひらがな(0xF2)でIMEが開かず3/3 FAILだった)。
            # ただし MS-IME本体の半角/全角(sc-hz-msime-native-*)は observe: F3=閉/F4=開の静的モデルでGJIのようなトグルではない(ADR-189が対象外にした範囲)。
            # noawase の構成は、それが awase のせいか(MS-IME本体の癖か)を切り分ける対照実験。
            # IME の3通り: msime-native(標準の日本語IME)、gji-msime(GJI + MS-IMEプリセット)、gji-atok(GJI + ATOKプリセット)
            # 設定 dbe_mode_key_policy(suppress/passthrough)は ADR-191 で撤去した(Passthroughを選んでも挙動が変わらない実質死んだ設定だった)。
            # 以前の -suppress/-passthrough の2構成は同じ挙動を測るだけなので1構成にした(構成名は sc-dbe-<ime>・sc-hz-<ime>)。
            # half_width_alnum_toggle: 左Shift単独タップで半角英数(持続トグル)。GJIで使うには all が必要。
            *[cfg(f'sc-dbe-{ime_name}', 'pass', check='consistency', ime=ime, keymap=km,
                  args=f'--seq=F2,F0,F2,F1,F2,F0,F0,F1,F2{msime}')
              for ime_name, ime, km, msime in SC_IMES],
            *[cfg(f'sc-kanji-{ime_name}', 'pass', check='consistency', ime=ime, keymap=km,
                  args=f'--seq=F2,19,19,16,1A,16,1A,19,F2,1A{msime}')
              for ime_name, ime, km, msime in SC_IMES],
            *[cfg(f'sc-hz-{ime_name}', 'observe' if ime == 'msime' else 'pass', check='toggle', ime=ime, keymap=km,
                  args=f'--hz{msime}')
              for ime_name, ime, km, msime in SC_IMES],
            *[cfg(f'sc-shift-{ime_name}', 'pass', check='consistency', ime=ime, keymap=km,
                  args=f'--seq=F2,A0,A0,A0,A1,F2{msime}', general='half_width_alnum_toggle = "all"')
              for ime_name, ime, km, msime in SC_IMES],
            # ADR-199 T10 決定A: 文字→親指(無変換)の順で重なり不足(min_overlap_margin_percent=15)にしたまま親指を押し続けてタイムアウトを越えても、
            # 親指を押している間は forced の IME OFF(keys.ime_off)を発火せず、離した時に発火する(check_charthumb.py)。修正前の awase は押している間に閉じる。
            cfg('sc-charthumb-gji-atok', 'pass', check='charthumb', args='--charthumb=41,1D', runs=2,
                general='min_overlap_margin_percent = 15', keys='ime_off = ["VK_NONCONVERT"]'),
            cfg('sc-dbe-msime-native-noawase', 'observe', check='consistency', ime='msime', awase='false',
                args='--seq=F2,F0,F2,F1,F2,F0,F0,F1,F2 --msime'),
            cfg('sc-hz-msime-native-noawase', 'observe', check='consistency', ime='msime', awase='false',
                args='--seq=F3,F3,F4,F4,F3,F4,F4,F3 --msime'),
            # MS-IME本体で、スキャンコード付き/無しの注入(NOSCAN|0xF2 等)がIMEを開くか(awase の再注入は scan=0)
            cfg('sc-probe-vk-msime-native', 'observe', check='vkprobe', args='--vkprobe --msime', ime='msime', awase='false'),
            # ADR-197: MS-IME「以前のバージョンのMicrosoft IMEを使う」互換モード限定の詳細キーカスタマイズ
            # (旧UI、keystyle+StyleList、msime_legacy_keymap.rs が検出)で、無変換/変換キーに「IMEオン/オフ」
            # トグルを割り当てると、直接入力中の単独タップで実際にIME ONになるか(2026-09-23 dragonflyg4実機
            # diffで確認したStyleList\Custom\keyの内容と同じ2レコードをCIで再現)。keystyle=NATURAL(既定、
            # CIランナーの素の状態)との対で比較する——awaseなし(observe専用)、seqは同一(無変換→変換)。
            cfg('sc-legacy-natural-keystyle', 'observe', check='consistency', ime='msime', awase='false',
                runs=1, args='--seq=1D,1C --msime'),
            cfg('sc-legacy-custom-keystyle', 'observe', check='consistency', ime='msime', awase='false',
                runs=1, args='--seq=1D,1C --msime', legacy_custom='true'),
            # --- 高速打鍵ストレス(ts-、ci/e2e-typing-stress): NICOLA の単打・親指シフト同時打鍵・混在を、人間より速い間隔で SendInput 注入し、
            # 入力先のテキストを読み戻して期待文字列(.yab とかな表から機械的に決める)と比べる。判定は check_typing_stress.py(消失/入れ替わり/リテラル化を分類)。
            # 入力先: edit=素のEDIT(IMM32系) / multi=複数行EDIT / rich=素のRICHEDIT50W(TSF text store) / tsf=RichEditをChrome_RenderWidgetHostHWNDへスーパークラス化(TsfNative相当、ADR-193)。
            # 検出のみなので expect=observe(崩れを見つけても赤にしない。結果は summary の別表)。runs=2(seed=回番号で列を変える)。
            # 名前: ts-<入力先>-<gji|msime>-<間隔ms>ms。ts-raw-* は awase なしで同じ文字列を生のローマ字として同じ速度で打つ対照実験(入力先+IME単体が受けられるか)。
            # tsf+GJI の 5/3/2ms は、run 36209255447 で 2ms・run1 だけが全12試行 FAIL(awase.log に [pending-deferred] count limit exceeded が182件=消失文字数と一致)
            # だったため、再現率を見るため6回にする。
            *[cfg(f'ts-{form}-{ime_name}-{iv}ms', 'observe', check='typing', ime=ime, runs=20 if ((form == 'tsf' and ime == 'gji' and iv == 2) or (form == 'edit' and ime == 'msime' and iv == 10)) else (6 if (form == 'tsf' and ime == 'gji' and iv <= 5) else 2), wait=420,
                  stress=f'--form={form} --interval={iv} --layout=@REPO@/layout/nicola_keytop.yab{msime}')
              for form in ('edit', 'multi', 'rich', 'tsf')
              for ime_name, ime, msime in (('gji', 'gji', ''), ('msime', 'msime', ' --msime'))
              # 40/20/10ms は初回(run 36208885340)で全 PASS だったので、限界を探るため 5/2ms も足した。
              for iv in (40, 20, 10, 5, 3, 2)],
            *[cfg(f'ts-raw-{form}-{ime_name}-{iv}ms', 'observe', check='typing', ime=ime, awase='false', runs=2, wait=420,
                  stress=f'--form={form} --interval={iv} --mode=raw --no-awase --layout=@REPO@/layout/nicola_keytop.yab{msime}')
              for form in ('edit', 'tsf')
              for ime_name, ime, msime in (('gji', 'gji', ''), ('msime', 'msime', ' --msime'))
              for iv in (10, 2)],
            # --- 本物の Chrome(chromebar=アドレスバー、Alt+D でフォーカス / chromepage=ページ内 textarea)。読み戻しは UI Automation。GJI のみ。---
            # 取りこぼしの再現率測定(run 36222195067 で chromepage 2ms が 48 試行中 1 件 FAIL): 2ms/3ms を 1 回あたり 24 試行 × 20 回に増やす。
            *[cfg(f'ts-{form}-gji-{iv}ms', 'observe', check='typing', ime='gji', runs=runs, wait=1200,
                  stress=f'--form={form} --interval={iv} --trials=8 --layout=@REPO@/layout/nicola_keytop.yab')
              for form, iv, runs in (('chromepage', 2, 30), ('chromebar', 2, 30))],
            # 対照実験: awase なし・raw ローマ字 20ms で入力中(未確定)に、awase の chrome-reinit と同じ VK_IME_OFF→VK_IME_ON 等を送る。
            # 未確定文字が消える(loss>0)なら、awase の reinit が入力を破棄する根拠になる(run 36222195067 の chromepage 2ms で 35 文字消失)。
            *[cfg(f'ts-raw-{form}-gji-20ms-reinit-{ra}', 'observe', check='typing', ime='gji', awase='false', runs=2, wait=900,
                  stress=f'--form={form} --interval=20 --mode=raw --no-awase --kinds=single --trials=6 --reinit-after={ra} --layout=@REPO@/layout/nicola_keytop.yab')
              for form in ('chromepage', 'chromebar') for ra in ('off_on', 'off', 'f2', 'none')],
            # 実利用に近い条件: アイドル → 別ウィンドウへ切替 → Chrome へ戻す → 100ms 後に打鍵(--idle/--switch-focus/--start-delay)。
            # 定常状態(連続打鍵)では 2000 試行超で失敗ゼロ。失敗は ready 直後の最初の 1〜2 試行に集中していたので、cold・フォーカス遷移直後を狙う。
            *[cfg(f'ts-{form}-gji-{iv}ms-idle{idle}', 'observe', check='typing', ime='gji', runs=6, wait=1500,
                  stress=f'--form={form} --interval={iv} --kinds=single,mixed --trials=6 --idle={idle * 1000} --switch-focus --start-delay=100 --layout=@REPO@/layout/nicola_keytop.yab')
              for form in ('chromepage', 'chromebar') for iv in (30, 10, 2) for idle in (3, 20)],
            *[cfg(f'ts-raw-{form}-gji-{iv}ms-idle{idle}', 'observe', check='typing', ime='gji', awase='false', runs=6, wait=1500,
                  stress=f'--form={form} --interval={iv} --mode=raw --no-awase --kinds=single,mixed --trials=6 --idle={idle * 1000} --switch-focus --start-delay=100 --layout=@REPO@/layout/nicola_keytop.yab')
              for form in ('chromepage', 'chromebar') for iv in (10,) for idle in (3, 20)],
            *[cfg(f'ts-raw-{form}-gji-2ms', 'observe', check='typing', ime='gji', awase='false', runs=6, wait=900,
                  stress=f'--form={form} --interval=2 --mode=raw --no-awase --trials=8 --layout=@REPO@/layout/nicola_keytop.yab')
              for form in ('chromebar', 'chromepage')],
          ]
          only = [x.strip() for x in os.environ.get('ONLY', '').split(',') if x.strip()]
          if only:
            configs = [c for c in configs if any(c['name'] == o or (o.endswith('*') and c['name'].startswith(o[:-1])) for o in only)]
          elif os.environ.get('EXCLUDE_CAL_WHEN_EMPTY') == '1':
            # 既定(only 空)では cal-*(学習/検証ラウンド)を除く。develop 由来の51構成(ADR-186/190)の挙動を変えない。
            configs = [c for c in configs if not c['name'].startswith(('cal-', 'ts-'))]
          if os.environ.get('RUNS', '').strip():
            for c in configs:
              c['runs'] = int(os.environ['RUNS'])
          # ビルドは bin ごとに1回(撤去なしの構成は baseline を共有)
          builds = [c for c in configs if c['bin'] == c['name']]
          if not any(c['bin'] == 'baseline' and c['name'] == 'baseline' for c in builds):
            builds.insert(0, cfg('baseline', 'pass'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write('configs=' + json.dumps(configs) + '\n')
            f.write('builds=' + json.dumps(builds) + '\n')
            f.write('jobs=' + json.dumps([dict(cfg=c, run=r) for c in configs for r in range(1, c['runs'] + 1)]) + '\n')

  build:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJson(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      # ソース+撤去スクリプトが同じなら成果物(exe)を使い回し、ビルド自体を飛ばす(ドキュメントだけの変更等)。
      - name: ビルド済み成果物のキャッシュ
        id: bin
        uses: actions/cache@v4
        with:
          path: dist
          key: e2e-bin-${{ matrix.cfg.name }}-${{ hashFiles('src/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'config.toml', 'tools/e2e/ime_key_matrix/ablations/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.bin.outputs.cache-hit != 'true'
      # 全構成で同じキー。依存のビルド結果は baseline だけが保存し、他は復元だけする(撤去でコンパイルされ直すのは自クレートのみ)。
      - uses: Swatinem/rust-cache@v2
        if: steps.bin.outputs.cache-hit != 'true'
        with:
          shared-key: e2e
          save-if: ${{ matrix.cfg.name == 'baseline' }}
      - name: 撤去(コード変更)を当てる
        if: steps.bin.outputs.cache-hit != 'true' && matrix.cfg.mutator != ''
        shell: bash
        run: |
          bash "tools/e2e/ime_key_matrix/ablations/${{ matrix.cfg.mutator }}"
          git diff --stat
          test -n "$(git diff --stat)" || { echo "撤去が差分を作らなかった(コードが変わって撤去箇所が消えた?)"; exit 1; }
      - name: awase とスパイクをビルド
        if: steps.bin.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo build -p awase-windows --bin awase
          cargo build -p awase-windows --example ime_key_matrix_spike
          cargo build -p awase-windows --example compartment_notify_probe
          cargo build -p awase-windows --example compartment_notify_probe_diag
          cargo build -p awase-windows --example typing_stress
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\debug\awase.exe dist\
          Copy-Item target\debug\examples\ime_key_matrix_spike.exe dist\
          Copy-Item target\debug\examples\compartment_notify_probe.exe dist\
          Copy-Item target\debug\examples\compartment_notify_probe_diag.exe dist\
          Copy-Item target\debug\examples\typing_stress.exe dist\
          Copy-Item config.toml dist\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.cfg.name }}
          path: dist
          retention-days: 3

  e2e:
    needs: [plan, build]
    runs-on: windows-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.cfg.bin }}
          path: dist

      # 他の方法: winget install --id Google.JapaneseIME(71秒) / scoop bucket add nonportable; scoop install google-japanese-input-np
      - name: Google 日本語入力をインストール(chocolatey、約30秒)
        if: matrix.cfg.ime != 'msime'
        shell: pwsh
        run: |
          choco install googlejapaneseinput -y --no-progress 2>&1 | Select-Object -Last 3

      - name: 入力言語をja-JP + GJI に設定、キーマッププリセット(ATOK/MS-IME)の config1.db を書く
        if: matrix.cfg.ime != 'msime'
        shell: pwsh
        run: |
          $googleImeTip = '0411:{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}{773EB24E-CA1D-4B1B-B420-FA985BB0B80D}'
          $l = New-WinUserLanguageList ja-JP
          $l[0].InputMethodTips.Clear()
          $l[0].InputMethodTips.Add($googleImeTip)
          Set-WinUserLanguageList $l -Force 2>&1
          try { Set-WinDefaultInputMethodOverride -InputTip $googleImeTip -ErrorAction Stop }
          catch { "default input method override FAILED: $($_.Exception.Message)" }
          # キーマッププリセット(session_keymap): Mozc Config の field 41 (varint)。1=ATOK, 2=MS-IME。
          # field 22 (check_default) = 0 で「既定のIMEにしますか」の初回ダイアログを出さない。
          $dir = Join-Path $env:USERPROFILE 'AppData\LocalLow\Google\Google Japanese Input'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $bytes = [System.Collections.Generic.List[byte]]::new()
          $bytes.AddRange([byte[]](0xB0,0x01,0x00,0xC8,0x02,[byte]${{ matrix.cfg.keymap }}))
          # 実機の config1.db には、過去にCUSTOMで作った古い custom_keymap_table(field 42)が残っている(ADR-174/186)。
          # ATOKでは GJI はこれを読まない。awase が読んでしまうと変換が On と誤分類される(撤去実験E2)ので、
          # それを再現する構成でだけ「DirectInput Henkan IMEOn」を入れる。
          if ('${{ matrix.cfg.custom_table }}' -eq 'true') {
            $tbl = [Text.Encoding]::UTF8.GetBytes("status`tkey`tcommand`nDirectInput`tHenkan`tIMEOn`n")
            $bytes.AddRange([byte[]](0xD2,0x02,[byte]$tbl.Length))
            $bytes.AddRange($tbl)
          }
          [IO.File]::WriteAllBytes((Join-Path $dir 'config1.db'), $bytes.ToArray())
          # 変換サーバー等はインストール時の既定設定で起動済みで、後から書いた config1.db を読み直さない。
          # 終了させ、次に使われるとき(TIP が呼ぶとき)に新しい設定で起動し直させる。
          # インストール直後に起動するツール/ウィザード(googleimejatool.exe)もここで終了する。
          Get-Process | Where-Object { $_.Name -match 'googleime|mozc' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      # Microsoft IME 本体: ja-JP の言語を追加すると標準の日本語IME(Microsoft IME)が入る。
      - name: 入力言語に ja-JP を追加して Microsoft IME を使えるようにする
        if: matrix.cfg.ime == 'msime'
        shell: pwsh
        run: |
          $msimeTip = '0411:{03B5835F-F03C-411B-9CE2-AA23E1171E36}{A76C93D9-5523-4E90-AAFA-4DB112F9AC76}'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          Set-WinUserLanguageList -LanguageList $list -Force
          "Set-WinUserLanguageList: $([int]$sw.Elapsed.TotalSeconds)s"
          # 言語機能(Microsoft IME)の導入は非同期のことがある。TIP が登録されるまで待つ(最大5分)。
          $tipKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{03B5835F-F03C-411B-9CE2-AA23E1171E36}'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $tipKey); $i++) { Start-Sleep -Seconds 5 }
          "TIP_REGISTERED=$(Test-Path $tipKey) after $([int]$sw.Elapsed.TotalSeconds)s"
          if (-not (Test-Path $tipKey)) {
            Get-WindowsCapability -Online -Name 'Language.*ja-JP*' | Format-Table Name, State
            Add-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0' 2>&1 | Select-Object -Last 3
            "TIP_REGISTERED(after capability)=$(Test-Path $tipKey) after $([int]$sw.Elapsed.TotalSeconds)s"
          }
          try { Set-WinDefaultInputMethodOverride -InputTip $msimeTip -ErrorAction Stop }
          catch { "default input method override FAILED: $($_.Exception.Message)" }
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      # ADR-197: MS-IME「以前のバージョンのMicrosoft IMEを使う」互換モード限定の詳細キーカスタマイズ(旧UI)を
      # 再現する。2026-09-23 dragonflyg4実機の StyleList\Custom\key の実測データ(無変換=CE CD CD CD CD CD、
      # 変換=CE CD CD CD CD CD、1列目=直接入力状態での機能コード="IMEオン/オフ"トグル)と同じ2レコードだけを
      # 持つ最小のテーブルを作る(`msime_legacy_keymap.rs`が読むのは無変換/変換ラベルの行だけなので機能的に等価)。
      # keystyle を Custom に切り替えると同時にこのテーブルを有効化する(旧UIの「ユーザー定義」タブで保存した
      # ときの実際の見え方と同じ)。互換モード自体(Tsf3Override\...\NoTsf3Override2)は変更しない
      # (ADR-197の非目的、値を読むだけなら常に有効という前提で検証する)。
      - name: MS-IME 旧UI互換の詳細キーカスタマイズ(keystyle=Custom)を再現する
        if: matrix.cfg.ime == 'msime' && matrix.cfg.legacy_custom == 'true'
        shell: pwsh
        run: |
          $base = 'HKCU:\Software\Microsoft\IME\15.0\IMEJP'
          # 新規ランナーでは ja-JP 追加直後は $base\MSIME 自体が存在しない(dragonflyg4実機はMS-IME起動履歴が
          # あるため既存)。先に両キーを作ってから Set-ItemProperty する(GJI設定ステップの New-Item と同じ理由)。
          New-Item -Path "$base\MSIME" -Force | Out-Null
          New-Item -Path "$base\StyleList\Custom" -Force | Out-Null
          # 2026-09-23: 最小2レコード版(無変換/変換のみ)では実機/CIとも無変換のIME ON効果が
          # 再現しなかった(round1レビューB1の裏取り)。dragonflyg4実機の`reg export`で取得した
