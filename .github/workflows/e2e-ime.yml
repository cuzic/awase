            *[tsx(f'bug171-{form}-gji-30ms-pause{pause}', form, 'gji', 30, raw=True, extra=f'--pause-after=10 --pause-ms={pause}', kinds='single,mixed', trials=6, len=25, runs=2, wait=1500)
              for form in ('chromepage',) for pause in (500, 8000)],
            # 実利用に近い条件: アイドル → 別窓へ切替 → 入力先へ戻す → 100ms 後に打鍵。失敗は ready 直後の最初の 1〜2 試行に集中しやすい。
            *[tsx(f'{form}-gji-{iv}ms-idle{idle}s', form, 'gji', iv, extra=f'--idle={idle * 1000} --switch-focus --start-delay=100', kinds='single,mixed', trials=6, runs=6, wait=1500)
              for form in ('chromepage', 'chromebar') for iv in (30, 10, 2) for idle in (3, 20)],
            # 対照: awase なし(生ローマ字)。入力先+IME だけで受けられるか。
            *[tsx(f'{form}-gji-2ms', form, 'gji', 2, raw=True, trials=8, runs=6, wait=900) for form in ('chromebar', 'chromepage')],
            *[tsx(f'{form}-gji-10ms-idle{idle}s', form, 'gji', 10, raw=True, extra=f'--idle={idle * 1000} --switch-focus --start-delay=100', kinds='single,mixed', trials=6, runs=6, wait=1500)
              for form in ('chromepage', 'chromebar') for idle in (3, 20)],
            # 対照: 入力中(未確定)に IME 制御キー列(--interrupt)を送ると未確定文字が消えるか(awase の再初期化が入力を破棄する根拠になるか)。
            *[tsx(f'{form}-gji-20ms-interrupt-{mode}', form, 'gji', 20, raw=True, extra=f'--interrupt={mode}', kinds='single', trials=6, runs=2, wait=900)
              for form in ('chromepage', 'chromebar') for mode in ('off_on', 'off', 'f2', 'none')],
            # --- drift correction の実機観測(cal-drift-、ci/e2e-calibration。ADR-191 09-T4、BUG-020) ---
            # `runtime/ime_refresh.rs::ir_apply_drift_correction` が、明示意図の OFF 直後に実 IME を不適切に
            # ON へ戻す/固定するか(2026-07-08 の実機症状)を、TsfNative相当の入力先(--form=tsf、ADR-193)で観測する。
            # `keys.ime_off` を単一キー(VK_NONCONVERT)へ上書きする: 既定の `Ctrl+無変換` は
            # `modifier_snapshot.ctrl` が PHYSICAL_KEY_STATE(`is_physical_key_down`)で判定されるため、
            # SendInput 注入では物理 Ctrl 押下として認識されず駆動できない
            # (2026-09-22、TsfNativeでのCtrl+変換強制ON不発火の根本原因調査で確認)。
            # 判定は check_drift_correction.py。expect=observe(まだ「作れる」と確定していないため、赤くしない。
            # docs/tasks/review-2026-09-24-09-remaining-active-writes-inventory.md T4 の第一段階)。
            # --drift-off-vk=0x1D は typing_stress/main.rs の既定(VK_MUHENKAN)と同じ値だが、既定に暗黙で
            # 頼らず明示する(既定が変わっても keys.ime_off の上書き先と食い違わないように)。
            *[cfg(f'cal-drift-tsf-{ime_name}', 'observe', check='driftcorrection', ime=ime, keymap=km, wait=200,
                  keys='ime_off = ["VK_NONCONVERT"]',
                  stress=f'--form=tsf --mode=drift --trials=10 --drift-off-vk=0x1D --layout=@REPO@/layout/nicola_keytop.yab{msime}')
              for ime_name, ime, km, msime in (('gji-atok', 'gji', 1, ''), ('msime-native', 'msime', 1, ' --msime'))],
            # --- drift correction による ON 回復の観測(cal-driftrec-、ci/e2e-calibration。ADR-178 領域A撤去後) ---
            # reassert/force-on(領域A)は撤去済みなので、awase が明示意図 ON を持つのに実 IME が閉じた「ずれ」を
            # drift correction「だけ」で ON へ戻せるかを見る。ずれは、ハーネスが自プロセスの入力欄の IME を
            # WM_IME_CONTROL(IMC_SETOPENSTATUS,0) で直接閉じて作る(awase を経由しない外部要因の再現)。回復後は実際にかな単打を
            # 打って確定し、API の開閉表示ではなく実タイピングで ON を確認する。tsf=TsfNative相当(ADR-193)、
            # edit=素の EDIT(ImmCross、Win32 の対照)。判定は check_drift_recovery.py。expect=observe。
            *[cfg(f'cal-driftrec-{form}-{ime_name}', 'observe', check='driftrecovery', ime=ime, keymap=km, wait=200,
                  stress=f'--form={form} --mode=drift-on --trials=10 --layout=@REPO@/layout/nicola_keytop.yab{msime}')
              for form in ('tsf', 'edit')
              for ime_name, ime, km, msime in (('gji-atok', 'gji', 1, ''), ('msime-native', 'msime', 1, ' --msime'))],
            # フォーカス変更を挟んだ版(cal-driftrec-refocus-*): 閉じた直後にタスクバーへ一度フォーカスを外して戻し、awase のフォーカス変更経路
            # (drift correction 再開の契機)を通してから打鍵する。判断(授権・鮮度1500ms)まで届くか、observed/drift 列で見る。観測のみ。
            *[cfg(f'cal-driftrec-refocus-{form}-{ime_name}', 'observe', check='driftrecovery', ime=ime, keymap=km, wait=200,
                  stress=f'--form={form} --mode=drift-on --refocus --trials=10 --layout=@REPO@/layout/nicola_keytop.yab{msime}')
              for form in ('tsf', 'edit')
              for ime_name, ime, km, msime in (('gji-atok', 'gji', 1, ''), ('msime-native', 'msime', 1, ' --msime'))],
            cfg('cal-driftrec-chrome-refocus-msime-native', 'observe', check='chromeprobe', ime='msime', keymap=2, runs=1, wait=400,
                chrome='--close-ime=10 --refocus --settle=800 --msime'),
            cfg('cal-driftrec-chrome-refocus-gji', 'observe', check='chromeprobe', keymap=1, runs=1, wait=400,
                chrome='--close-ime=10 --refocus --settle=800'),
            # BUG-172 の実 Chrome 確認(cal-driftrec-chrome-*): IME を WM_IME_CONTROL で閉じ、実 Chrome へかな単打して未回復かを見る(観測のみ)。
            # TsfNative の実アプリで msime-ready ゲートが conv NATIVE を ON と誤認するか。対照は GJI。
            cfg('cal-driftrec-chrome-msime-native', 'observe', check='chromeprobe', ime='msime', keymap=2, runs=1, wait=400,
                chrome='--close-ime=10 --settle=800 --msime'),
            cfg('cal-driftrec-chrome-gji', 'observe', check='chromeprobe', keymap=1, runs=1, wait=400,
                chrome='--close-ime=10 --settle=800'),
            # BUG-176 の再現調査(sc-bug176-*、観測のみ): 他プロセス注入(目印なし)の VK_IME_OFF の後、実 IME の開閉を時系列で読み、偽OFF(IME開のままEngine OFF)を探す。
            # clean=毎試行 ON にそろえる / restore=試行後に外から IME を開け直す(マウス相当、awase の desired=false が残る)。Edge/Chrome × GJI。
            *[cfg(f'sc-bug176-{br}-{mode}', 'observe', check='chromeprobe', keymap=1, runs=1, wait=600,
                  chrome=f'--bug176=20 --b176-mode={mode} --browser={br} --settle=800')
              for br in ('edge', 'chrome') for mode in ('clean', 'restore')],
            # 時間のずらし方(suspend.rs)。tsf=awase から TsfNative 相当に見える自前入力先、chromepage=実 Chrome。
            susp('bug171-tsf-control', 'tsf'),
            susp('bug171-tsf-d800', 'tsf', 300, 800),
            susp('bug171-tsf-d2500', 'tsf', 300, 2500),
            susp('bug171-chromepage-control', 'chromepage'),
            susp('bug171-chromepage-d800', 'chromepage', 300, 800),
            # 候補窓の描画側(GoogleIMEJaRenderer)を止める案(変換サーバ Converter を止めても下流に差が出なかったため)。
            # survey=止める前に、候補窓・IME 関連プロセスと窓を列挙して対象を絞る調査(止めない)。rend=Renderer を停止。
            susp('survey-tsf', 'tsf', survey=True),
            susp('survey-chromepage', 'chromepage', survey=True),
            *[susp(f'rend-{form}-d{d}', form, 300, d, proc='GoogleIMEJaRenderer') for form in ('tsf', 'chromepage') for d in (800, 2500)],
          ]
          # --- 宣言表の入力先(tsx-ext-*): tools/e2e/input_forms/forms.toml の各項目 × IME × 打鍵間隔。観測のみ、only='tsx-ext-*' で回す。---
          # 入力先を足すときは forms.toml に 1 項目書く(このスクリプトは触らない)。setup/prepare は e2e ジョブの「入力先のセットアップ」が使う。
          import tomllib
          with open('tools/e2e/input_forms/forms.toml', 'rb') as _f:
            _forms = tomllib.load(_f)['forms']
          for _name, _spec in _forms.items():
            for _ime in _spec.get('imes', ['gji', 'msime']):
              for _iv in _spec.get('intervals', [30, 10]):
                _c = tsx(f'ext-{_name}-{_ime}-{_iv}ms', 'ext', _ime, _iv,
                         extra=f'--ext={_name} --ext-manifest=@REPO@/tools/e2e/input_forms/forms.toml --ext-repo=@REPO@',
                         kinds='single,thumb,mixed', trials=4, len=25, runs=_spec.get('runs', 2), wait=900)
                _c.update(setup=_spec.get('setup', 'none'), prepare=' ; '.join(_spec.get('prepare', [])), until='2026-12-01')
                configs.append(_c)
                if _spec.get('raw_control'):
                  # 対照: awase なしで同じ文字列を生のローマ字として打つ(入力先+IME 単体で崩れるかの切り分け)。名前は tsx-raw-ext-*。
                  _r = tsx(f'ext-{_name}-{_ime}-{_iv}ms', 'ext', _ime, _iv, raw=True,
                           extra=f'--ext={_name} --ext-manifest=@REPO@/tools/e2e/input_forms/forms.toml --ext-repo=@REPO@',
                           kinds='single', trials=4, len=25, runs=_spec.get('runs', 2), wait=900)
                  _r.update(setup=_spec.get('setup', 'none'), prepare=' ; '.join(_spec.get('prepare', [])), until='2026-12-01')
                  configs.append(_r)
          only = [x.strip() for x in os.environ.get('ONLY', '').split(',') if x.strip()]
          if only:
            configs = [c for c in configs if any(fnmatch.fnmatchcase(c['name'], o) for o in only)]
            # sc-keymatrix-*(ADR-208 L3b)は only='sc-*' のような広い指定には含めない(足すと only='sc-*' が 256 ジョブに近づく)。
            # only に sc-keymatrix- で始まる指定(例 'sc-keymatrix-*'、完全一致)があり、それに合致する構成だけ回す。
            configs = [c for c in configs if not c['name'].startswith(('sc-keymatrix-', 'sc-offrca-', 'sc-bug149-', 'sc-table-', 'sc-preedit-'))
                       or any(o.startswith(('sc-keymatrix-', 'sc-offrca-', 'sc-bug149-', 'sc-table-', 'sc-preedit-')) and (c['name'] == o or (o.endswith('*') and c['name'].startswith(o[:-1]))) for o in only)]
          elif os.environ.get('EXCLUDE_CAL_WHEN_EMPTY') == '1':
            # 既定(only 空)では cal-*(学習/検証ラウンド)を除く。develop 由来の51構成(ADR-186/190)の挙動を変えない。
            # sc-startup-msime-chrome-on-*(切り分け実験、各 runs=8)・sc-keymatrix-*(ADR-208 L3b)も既定から除く(足すと既定が 256 を超える)。only で明示して回す。
            configs = [c for c in configs if not c['name'].startswith(('cal-', 'ts-', 'tsx-', 'tsj-', 'sc-startup-msime-chrome-on-', 'sc-keymatrix-', 'sc-offrca-', 'sc-bug149-', 'sc-table-', 'sc-preedit-'))]
          if os.environ.get('RUNS', '').strip():
            for c in configs:
              c['runs'] = int(os.environ['RUNS'])
          # ビルドは bin ごとに1回(撤去なしの構成は baseline を共有)
          builds = [c for c in configs if c['bin'] == c['name']]
          if not any(c['bin'] == 'baseline' and c['name'] == 'baseline' for c in builds):
            builds.insert(0, cfg('baseline', 'pass'))
          # GitHub Actions の matrix は 1 ジョブあたり 256 要素まで。超えると e2e の matrix 生成で run 全体が失敗するので、
          # 何が原因か分かるメッセージで plan の段階で止める(only='ts-*,tsx-*' のような広い指定や runs の上書きで起きる)。
          n_jobs = sum(c['runs'] for c in configs)
          if n_jobs > 256:
            print(f'::error::e2e の matrix が {n_jobs} ジョブで上限 256 を超える。only を絞る(tsx-* だけで約 240)か runs を減らす。')
            sys.exit(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write('configs=' + json.dumps(configs) + '\n')
            f.write('builds=' + json.dumps(builds) + '\n')
            f.write('jobs=' + json.dumps([dict(cfg=c, run=r) for c in configs for r in range(1, c['runs'] + 1)]) + '\n')

  build:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJson(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      # ソース+撤去スクリプトが同じなら成果物(exe)を使い回し、ビルド自体を飛ばす(ドキュメントだけの変更等)。
      - name: ビルド済み成果物のキャッシュ
        id: bin
        uses: actions/cache@v4
        with:
          path: dist
          key: e2e-bin-${{ matrix.cfg.name }}-${{ hashFiles('src/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'config.toml', 'tools/e2e/ime_key_matrix/ablations/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.bin.outputs.cache-hit != 'true'
      # 全構成で同じキー。依存のビルド結果は baseline だけが保存し、他は復元だけする(撤去でコンパイルされ直すのは自クレートのみ)。
      - uses: Swatinem/rust-cache@v2
        if: steps.bin.outputs.cache-hit != 'true'
        with:
          shared-key: e2e
          save-if: ${{ matrix.cfg.name == 'baseline' }}
      - name: 撤去(コード変更)を当てる
        if: steps.bin.outputs.cache-hit != 'true' && matrix.cfg.mutator != ''
        shell: bash
        run: |
          bash "tools/e2e/ime_key_matrix/ablations/${{ matrix.cfg.mutator }}"
          git diff --stat
          test -n "$(git diff --stat)" || { echo "撤去が差分を作らなかった(コードが変わって撤去箇所が消えた?)"; exit 1; }
      - name: awase とスパイクをビルド
        if: steps.bin.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo build -p awase-windows --bin awase
          cargo build -p awase-windows --example ime_key_matrix_spike
          cargo build -p awase-windows --example compartment_notify_probe
          cargo build -p awase-windows --example compartment_notify_probe_diag
          cargo build -p awase-windows --example typing_stress
          # awase-settings は tsx-bugreport-*(bin=baseline)だけが使う。撤去(mutator)ビルドでは egui の再リンクを払わない。
          if ('${{ matrix.cfg.name }}' -eq 'baseline') { cargo build -p awase-settings --bin awase-settings }
          cargo build -p awase-windows --example chrome_probe
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\debug\awase.exe dist\
          Copy-Item target\debug\examples\ime_key_matrix_spike.exe dist\
          Copy-Item target\debug\examples\compartment_notify_probe.exe dist\
          Copy-Item target\debug\examples\compartment_notify_probe_diag.exe dist\
          Copy-Item target\debug\examples\typing_stress.exe dist\
          # tsx-bugreport-*(typing_stress --form=bugreport)が実体を起動するのに要る。typing_stress.exe と同じ dist\ に置く。
          if ('${{ matrix.cfg.name }}' -eq 'baseline') { Copy-Item target\debug\awase-settings.exe dist\ }
          Copy-Item target\debug\examples\chrome_probe.exe dist\
          Copy-Item config.toml dist\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.cfg.name }}
          path: dist
          retention-days: 3

  e2e:
    needs: [plan, build]
    runs-on: windows-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.cfg.bin }}
          path: dist

      # --- 入力先のセットアップ(宣言表 tools/e2e/input_forms/forms.toml の setup / prepare) ---
      - name: 入力先のセットアップ(Java)
        if: contains(fromJSON('["java","javafx","jbr"]'), matrix.cfg.setup)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 入力先のセットアップ(LibreOffice、chocolatey)
        if: matrix.cfg.setup == 'libreoffice'
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress 2>&1 | Select-Object -Last 5
          Get-ChildItem 'C:\Program Files\LibreOffice\program\soffice.exe', 'C:\Program Files\LibreOffice\program\python.exe'
      - name: 入力先のセットアップ(Apache OpenOffice、chocolatey)
        if: matrix.cfg.setup == 'openoffice'
        shell: pwsh
        run: |
          choco install openoffice -y --no-progress 2>&1 | Select-Object -Last 5
          Get-ChildItem 'C:\Program Files (x86)\OpenOffice 4\program\soffice.exe', 'C:\Program Files (x86)\OpenOffice 4\program\python.exe'
      - name: 入力先のセットアップ(Qt)
        if: matrix.cfg.setup == 'qt'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: 入力先のセットアップ(Flutter)
        if: matrix.cfg.setup == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 入力先のセットアップ(uv)
        if: matrix.cfg.setup == 'wx'
        uses: astral-sh/setup-uv@v5
      - name: 入力先のセットアップ(tools/e2e/input_forms/setup/<setup>.ps1)
        if: matrix.cfg.setup != '' && matrix.cfg.setup != 'none'
        shell: pwsh
        run: |
          $script = "tools/e2e/input_forms/setup/${{ matrix.cfg.setup }}.ps1"
          if (Test-Path $script) { & $script } else { Write-Host "$script は無い(専用ステップのみ)" }
      - name: 入力先の用意(prepare)
        if: matrix.cfg.prepare != ''
        shell: pwsh
        run: |
          '${{ matrix.cfg.prepare }}' -split ' ; ' | ForEach-Object { Write-Host "> $_"; Invoke-Expression $_; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      # 他の方法: winget install --id Google.JapaneseIME(71秒) / scoop bucket add nonportable; scoop install google-japanese-input-np
      - name: Google 日本語入力をインストール(chocolatey、約30秒)
        if: matrix.cfg.ime != 'msime'
        shell: pwsh
        run: |
          choco install googlejapaneseinput -y --no-progress 2>&1 | Select-Object -Last 3

      - name: 入力言語をja-JP + GJI に設定、キーマッププリセット(ATOK/MS-IME)の config1.db を書く
        if: matrix.cfg.ime != 'msime'
        shell: pwsh
        run: |
          $googleImeTip = '0411:{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}{773EB24E-CA1D-4B1B-B420-FA985BB0B80D}'
          $l = New-WinUserLanguageList ja-JP
          $l[0].InputMethodTips.Clear()
          $l[0].InputMethodTips.Add($googleImeTip)
          Set-WinUserLanguageList $l -Force 2>&1
          try { Set-WinDefaultInputMethodOverride -InputTip $googleImeTip -ErrorAction Stop }
          catch { "default input method override FAILED: $($_.Exception.Message)" }
          # キーマッププリセット(session_keymap): Mozc Config の field 41 (varint)。1=ATOK, 2=MS-IME。
          # field 22 (check_default) = 0 で「既定のIMEにしますか」の初回ダイアログを出さない。
          $dir = Join-Path $env:USERPROFILE 'AppData\LocalLow\Google\Google Japanese Input'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $bytes = [System.Collections.Generic.List[byte]]::new()
          $bytes.AddRange([byte[]](0xB0,0x01,0x00,0xC8,0x02,[byte]${{ matrix.cfg.keymap }}))
          # 実機の config1.db には、過去にCUSTOMで作った古い custom_keymap_table(field 42)が残っている(ADR-174/186)。
          # ATOKでは GJI はこれを読まない。awase が読んでしまうと変換が On と誤分類される(撤去実験E2)ので、
          # それを再現する構成でだけ「DirectInput Henkan IMEOn」を入れる。
          if ('${{ matrix.cfg.custom_table }}' -eq 'true') {
            $tbl = [Text.Encoding]::UTF8.GetBytes("status`tkey`tcommand`nDirectInput`tHenkan`tIMEOn`n")
            $bytes.AddRange([byte[]](0xD2,0x02,[byte]$tbl.Length))
            $bytes.AddRange($tbl)
          }
          # tsv: CUSTOM キー表を丸ごと指定する(行は '|'、列は ','。ヘッダは自動)。keymap=0(CUSTOM)と併用する。
          if ('${{ matrix.cfg.tsv }}' -ne '') {
            $rows = '${{ matrix.cfg.tsv }}' -split '\|' | ForEach-Object { $_ -replace ',', "`t" }
            $tbl = [Text.Encoding]::UTF8.GetBytes("status`tkey`tcommand`n" + ($rows -join "`n") + "`n")
            $bytes.AddRange([byte[]](0xD2,0x02))
            $len = $tbl.Length
            while ($len -ge 0x80) { $bytes.Add([byte](($len -band 0x7F) -bor 0x80)); $len = $len -shr 7 }
            $bytes.Add([byte]$len)
            $bytes.AddRange($tbl)
          }
          [IO.File]::WriteAllBytes((Join-Path $dir 'config1.db'), $bytes.ToArray())
          # 変換サーバー等はインストール時の既定設定で起動済みで、後から書いた config1.db を読み直さない。
          # 終了させ、次に使われるとき(TIP が呼ぶとき)に新しい設定で起動し直させる。
          # インストール直後に起動するツール/ウィザード(googleimejatool.exe)もここで終了する。
          Get-Process | Where-Object { $_.Name -match 'googleime|mozc' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      # Microsoft IME 本体: ja-JP の言語を追加すると標準の日本語IME(Microsoft IME)が入る。
      - name: 入力言語に ja-JP を追加して Microsoft IME を使えるようにする
        if: matrix.cfg.ime == 'msime'
        shell: pwsh
        run: |
          $msimeTip = '0411:{03B5835F-F03C-411B-9CE2-AA23E1171E36}{A76C93D9-5523-4E90-AAFA-4DB112F9AC76}'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          Set-WinUserLanguageList -LanguageList $list -Force
          "Set-WinUserLanguageList: $([int]$sw.Elapsed.TotalSeconds)s"
          # 言語機能(Microsoft IME)の導入は非同期のことがある。TIP が登録されるまで待つ(最大5分)。
          $tipKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{03B5835F-F03C-411B-9CE2-AA23E1171E36}'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $tipKey); $i++) { Start-Sleep -Seconds 5 }
          "TIP_REGISTERED=$(Test-Path $tipKey) after $([int]$sw.Elapsed.TotalSeconds)s"
          if (-not (Test-Path $tipKey)) {
            Get-WindowsCapability -Online -Name 'Language.*ja-JP*' | Format-Table Name, State
            Add-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0' 2>&1 | Select-Object -Last 3
            "TIP_REGISTERED(after capability)=$(Test-Path $tipKey) after $([int]$sw.Elapsed.TotalSeconds)s"
          }
          try { Set-WinDefaultInputMethodOverride -InputTip $msimeTip -ErrorAction Stop }
          catch { "default input method override FAILED: $($_.Exception.Message)" }
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      # ADR-197: MS-IME「以前のバージョンのMicrosoft IMEを使う」互換モード限定の詳細キーカスタマイズ(旧UI)を
      # 再現する。2026-09-23 dragonflyg4実機の StyleList\Custom\key の実測データ(無変換=CE CD CD CD CD CD、
      # 変換=CE CD CD CD CD CD、1列目=直接入力状態での機能コード="IMEオン/オフ"トグル)と同じ2レコードだけを
      # 持つ最小のテーブルを作る(`msime_legacy_keymap.rs`が読むのは無変換/変換ラベルの行だけなので機能的に等価)。
      # keystyle を Custom に切り替えると同時にこのテーブルを有効化する(旧UIの「ユーザー定義」タブで保存した
      # ときの実際の見え方と同じ)。互換モード自体(Tsf3Override\...\NoTsf3Override2)は変更しない
