name: e2e-ime (feasibility)

# 実機E2E(GJI ATOK × awase、tools/e2e/ime_key_matrix)を GitHub-hosted の Windows ランナーで回せるかの
# 実現可能性確認。ci/e2e-ime ブランチへの push と手動起動でだけ動く(通常のCIには影響しない)。
on:
  push:
    branches: [ci/e2e-ime]
  workflow_dispatch:

jobs:
  install-gji:
    name: GJI install via ${{ matrix.method }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        method: [winget, choco, scoop]
    steps:
      - name: winget
        if: matrix.method == 'winget'
        shell: pwsh
        continue-on-error: true
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Get-Command winget -ErrorAction SilentlyContinue | Select-Object Source, Version | Format-List
          winget --version
          winget search "Google Japanese" --accept-source-agreements 2>&1 | Select-Object -First 15
          winget install --id Google.JapaneseIME -e --silent --accept-package-agreements --accept-source-agreements 2>&1 | Select-Object -Last 15
          "elapsed=$([int]$sw.Elapsed.TotalSeconds)s"

      - name: choco
        if: matrix.method == 'choco'
        shell: pwsh
        continue-on-error: true
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          choco search google-japanese 2>&1 | Select-Object -First 10
          choco search japanese-ime 2>&1 | Select-Object -First 10
          choco search googlejapaneseinput 2>&1 | Select-Object -First 10
          foreach ($id in 'googlejapaneseinput','google-japanese-ime','googlejapaneseime','google-japanese-input') {
            "--- try $id"
            choco install $id -y --no-progress 2>&1 | Select-Object -Last 8
            if (Test-Path 'C:\Program Files*\Google\Google Japanese Input') { break }
          }
          "elapsed=$([int]$sw.Elapsed.TotalSeconds)s"

      - name: scoop
        if: matrix.method == 'scoop'
        shell: pwsh
        continue-on-error: true
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add extras 2>&1 | Select-Object -Last 3
          scoop bucket add nonportable 2>&1 | Select-Object -Last 3
          scoop bucket add japanese https://github.com/Ash258/Scoop-JP 2>&1 | Select-Object -Last 3
          scoop search google-japanese 2>&1 | Select-Object -First 10
          scoop search japanese 2>&1 | Select-Object -First 15
          foreach ($id in 'google-japanese-ime','googlejapaneseinput','google-japanese-input') {
            "--- try $id"
            scoop install $id 2>&1 | Select-Object -Last 8
            if (Test-Path 'C:\Program Files*\Google\Google Japanese Input') { break }
          }
          "elapsed=$([int]$sw.Elapsed.TotalSeconds)s"

      - name: 結果の確認(インストール先とTSFのTIP登録)
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem 'C:\Program Files*\Google\Google Japanese Input','C:\Windows\System32\GoogleIme*' -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table
          $g='{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}'
          "INSTALLED_DIR=$([bool](Get-ChildItem 'C:\Program Files*\Google\Google Japanese Input' -ErrorAction SilentlyContinue))"
          "TIP_REGISTERED=$(Test-Path "HKLM:\SOFTWARE\Microsoft\CTF\TIP\$g")"
