name: e2e-ime (feasibility)

# 実機E2E(GJI ATOK × awase、tools/e2e/ime_key_matrix)を GitHub-hosted の Windows ランナーで回せるかの
# 実現可能性確認。ci/e2e-ime ブランチへの push と手動起動でだけ動く(通常のCIには影響しない)。
on:
  push:
    branches: [ci/e2e-ime]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 配布URLの確認(HEAD)とインストーラーのログ診断
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 6
        run: |
          $cands = @(
            'https://dl.google.com/japanese-ime/latest/GoogleJapaneseInput64.msi',
            'https://dl.google.com/japanese-ime/latest/GoogleJapaneseInput.msi',
            'https://dl.google.com/japanese-ime/latest/GoogleJapaneseInputSetup.exe',
            'https://dl.google.com/tag/s/appguid%3D%7BDDCCD2A9-025E-4142-BCEB-F467B88CF830%7D%26iid%3D%7B00000000-0000-0000-0000-000000000000%7D%26lang%3Dja%26browser%3D4%26usagestats%3D0%26appname%3DGoogle%2520Japanese%2520Input%26needsadmin%3Dtrue/japanese-ime/GoogleJapaneseInputSetup.exe',
            'https://www.google.co.jp/ime/GoogleJapaneseInputSetup.exe',
            'https://dl.google.com/japanese-ime/dev/GoogleJapaneseInputSetup.exe'
          )
          foreach ($u in $cands) {
            try { $r = Invoke-WebRequest -Uri $u -Method Head -UseBasicParsing -MaximumRedirection 5; "OK  $($r.StatusCode) $($r.Headers['Content-Length']) $u" }
            catch { "NG  $($_.Exception.Message) $u" }
          }
          "--- installer を実行して 90 秒観察 ---"
          $u = $cands[3]
          Invoke-WebRequest -Uri $u -OutFile gji-setup.exe -UseBasicParsing
          $p = Start-Process -FilePath .\gji-setup.exe -ArgumentList '/silent /install' -PassThru
          Start-Sleep -Seconds 90
          "installer exited: $($p.HasExited)"
          Get-Process | Where-Object { $_.Name -match 'gji|updater|GoogleUpdate|msiexec|Google' } | Select-Object Name, Id, StartTime | Format-Table
          Get-ChildItem 'C:\Program Files (x86)\Google','C:\Program Files\Google' -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table
          Get-ChildItem "$env:TEMP","$env:LOCALAPPDATA\Temp" -Filter *oogle* -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table
          Get-ChildItem 'C:\Program Files (x86)\Google\Update\Log','C:\ProgramData\Google\Update\Log' -Filter *.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.FullName)"; Get-Content $_.FullName -Tail 25 }
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='MsiInstaller'} -MaxEvents 8 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message

      - name: 入力言語をja-JP + GJI に設定して ATOK プリセットの設定を書く
        shell: pwsh
        continue-on-error: true
        run: |
          $tip = '0411:{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}{773EB24E-CA1D-4B1B-B420-FA985BB0B80D}'
          $l = New-WinUserLanguageList ja-JP
          $l[0].InputMethodTips.Clear()
          $l[0].InputMethodTips.Add($tip)
          Set-WinUserLanguageList $l -Force 2>&1
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          # ATOK プリセット(session_keymap = 1): Mozc Config の field 41 (varint) = 1 だけを持つ最小の config1.db
          $dir = Join-Path $env:USERPROFILE 'AppData\LocalLow\Google\Google Japanese Input'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dir 'config1.db'), [byte[]](0xC8,0x02,0x01))
          Get-ChildItem $dir | Format-Table Name, Length

      - name: ctfmon の状態と、入力メソッドの確認
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Get-Process ctfmon, explorer -ErrorAction SilentlyContinue | Format-Table Name, Id, SessionId
          reg query "HKCU\Software\Microsoft\CTF\SortOrder\AssemblyItem\0x00000411" /s 2>&1 | Select-Object -First 30
