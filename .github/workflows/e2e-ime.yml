      # smoke ゲート: 本番シャードは、同じ run 内の smoke ジョブ(matrix.cfg.gate)が成功するまで待ち、失敗したら中身を実行しない。
      # smoke と同時に起動する(GJI導入・言語設定は smoke と並行して済ませる)ので、待ちは smoke の残り時間だけで済む。
      - name: smoke の成功を待つ(ゲート)
        id: gate
        if: matrix.cfg.gate != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ matrix.cfg.gate }}
        run: |
          # fail-open の条件: 5分待っても smoke ジョブが見つからない(この run に smoke が無い、または API が読めない)ときは
          # 通常どおり中身を実行する(ゲートは「smoke が失敗した」ことを確認できたときだけ本番を止める)。
          # ジョブ一覧は --paginate で全件読む(全構成 run は 200 ジョブ超で、1ページ 100 件では smoke が見つからない)。
          verdict=notfound
          for i in $(seq 1 90); do
            row=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              -q ".jobs[] | select(.name | startswith(\"e2e ($GATE,\")) | \"\(.status) \(.conclusion)\"" 2>/dev/null | head -1 || true)
            case "$row" in
              "completed success") verdict=success; break ;;
              "completed "*) verdict=failed; break ;;
              "") [ "$i" -ge 15 ] && break ;;  # 5分待っても smoke ジョブが見つからない(この run に smoke が無い)なら通常どおり実行
            esac
            sleep 20
          done
          echo "gate=$GATE verdict=$verdict ($row)"
          if [ "$verdict" = failed ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "smoke ($GATE) が失敗したため中身を実行しない" | tee result.txt
            echo "rc=3" > rc.txt
          fi

      - name: awase を起動し、スパイク --auto を実行して判定する
        id: run
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $cfg = Get-Content dist\config.toml -Raw
          # [general] への追加設定(;区切りの `key = value`)。既にあれば値を置き換え、無ければ [general] の直後に足す。
          $general = '${{ matrix.cfg.general }}'
          foreach ($line in ($general -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
            $key = ($line -split '=')[0].Trim()
            if ($cfg -match "(?m)^$key *=") { $cfg = $cfg -replace "(?m)^$key *=.*$", $line }
            else { $cfg = $cfg -replace '(?m)^\[general\]\s*$', "[general]`r`n$line" }
          }
          # [keys] への追加設定(;区切りの `key = value`)。既にあれば値を置き換え、無ければ末尾に [keys] を作って足す。
          $keys = '${{ matrix.cfg.keys }}'
          foreach ($line in ($keys -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
            $key = ($line -split '=')[0].Trim()
            if ($cfg -notmatch '(?m)^\[keys\]\s*$') { $cfg = $cfg.TrimEnd() + "`r`n`r`n[keys]`r`n" }
            if ($cfg -match "(?m)^$key *=") { $cfg = $cfg -replace "(?m)^$key *=.*$", $line }
            else { $cfg = $cfg -replace '(?m)^\[keys\]\s*$', "[keys]`r`n$line" }
          }
          [IO.File]::WriteAllText("$PWD\dist\config.toml", $cfg, (New-Object Text.UTF8Encoding($false)))
          Select-String -Path "$PWD\dist\config.toml" -Pattern 'half_width_alnum_toggle'
          # CIランナーは初回のクロスプロセスIMMプローブが遅く(実測22ms)、awase がスパイク窓を「IMM不可」と誤学習して
          # conv を読まなくなる(Engine が半角英数に追従しない)。学習済みキャッシュを事前投入して防ぐ。
          [IO.File]::WriteAllText("$PWD\dist\cache.toml", "[imm_capability.`"ime_key_matrix_spike.exe`"]`r`nEdit = `"${{ matrix.cfg.cache }}`"`r`nRICHEDIT50W = `"works`"`r`n[imm_capability.`"typing_stress.exe`"]`r`nEdit = `"works`"`r`nRICHEDIT50W = `"works`"`r`n", (New-Object Text.UTF8Encoding($false)))
          $env:RUST_LOG = 'debug'
          $env:AWASE_TEST_INJECTION = '1'
          # 順序: スパイクを先に起動し、初期化(TSF/ActivateProfile)が終わってから awase を起動する。
          # スパイクの初期化中に awase がIMMをプローブすると応答が無く、3回連続の miss で Edit を「IMM不可」と
          # 誤学習して conv を読まなくなる。--activate-gji はキーフックをawase起動後に遅延インストールし、
          # 起動後に VK_IME_OFF を1回注入して awase の belief(起動時推定=ON)と実状態(OFF)をそろえる。
          Push-Location dist
          if ('${{ matrix.cfg.probe }}' -ne '') {
            # ADR-193 の compartment_notify_probe(awase なし)。キー→通知の遅延を測る。ログは dist\compartment_notify_probe.log。
            # プローブは自前の前面化に CI で失敗する(ABORT 前面化またはフォーカスに失敗)ので、外側から前面化する
            # (スパイクと同じ AttachThreadInput の定番の回避策。プローブは 2.3 秒待ってから前面化を確かめるので間に合う)。
            $probeBin = '${{ matrix.cfg.probe_bin }}'
            Add-Type -TypeDefinition '
            using System;
            using System.Runtime.InteropServices;
            public class FgHelper {
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint a, uint b, bool attach);
              [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
              public static bool Front(IntPtr h) {
                IntPtr fg = GetForegroundWindow(); uint pid; uint ft = fg == IntPtr.Zero ? 0 : GetWindowThreadProcessId(fg, out pid);
                uint me = GetCurrentThreadId(); bool att = ft != 0 && ft != me && AttachThreadInput(me, ft, true);
                BringWindowToTop(h); bool ok = SetForegroundWindow(h);
                if (att) AttachThreadInput(me, ft, false);
                return ok || GetForegroundWindow() == h;
              }
            }
            '
            $probe = Start-Process -FilePath ".\$probeBin.exe" -ArgumentList "${{ matrix.cfg.probe }} --log=$probeBin.log" -PassThru
            if ($probeBin -eq 'compartment_notify_probe') {
              for ($i = 0; $i -lt 12; $i++) {
                Start-Sleep -Milliseconds 150
                $probe.Refresh()
                if ($probe.MainWindowHandle -ne [IntPtr]::Zero) { [void][FgHelper]::Front($probe.MainWindowHandle) }
              }
            }
            $deadline = (Get-Date).AddSeconds(${{ matrix.cfg.wait }})
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if ((Test-Path "$probeBin.log") -and (Select-String -Path "$probeBin.log" -Pattern '=== 完了 ===' -Quiet)) { break }
            }
          } elseif ('${{ matrix.cfg.stress }}' -ne '') {
            # 高速打鍵ストレス(typing_stress.exe): 入力欄の窓を作り GJI/MS-IME を有効化 → 「READY-FOR-AWASE」を出したら awase を起動 →
            # exe が awase.log を確認して10秒待ち、IME を ON にして各速度で打鍵・読み戻し → 「=== 完了 ===」。seed は回番号。
            $stressArgs = '--activate-gji ${{ matrix.cfg.stress }} --seed=${{ matrix.run }}'.Replace('@REPO@', $env:GITHUB_WORKSPACE.Replace('\', '/'))
            Start-Process -FilePath .\typing_stress.exe -ArgumentList $stressArgs
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 500
              if ((Test-Path typing_stress.log) -and (Select-String -Path typing_stress.log -Pattern 'READY-FOR-AWASE' -Quiet)) { break }
            }
            if ('${{ matrix.cfg.awase }}' -ne 'false') {
              Start-Process -FilePath "$PWD\awase.exe" -WorkingDirectory "$PWD" -RedirectStandardError "$PWD\..\awase-stderr.log" -RedirectStandardOutput "$PWD\..\awase-stdout.log"
            }
            $deadline = (Get-Date).AddSeconds(${{ matrix.cfg.wait }})
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if ((Test-Path typing_stress.log) -and (Select-String -Path typing_stress.log -Pattern '=== 完了 ===' -Quiet)) { break }
            }
          } else {
          $spikeArgs = '--auto --hold=180 --activate-gji ${{ matrix.cfg.args }}'.Replace('@REPO@', $env:GITHUB_WORKSPACE.Replace('\', '/'))
          Start-Process -FilePath .\ime_key_matrix_spike.exe -ArgumentList $spikeArgs
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path ime_key_matrix_spike.log) -and (Select-String -Path ime_key_matrix_spike.log -Pattern 'ROUND 2/2' -Quiet)) { break }
          }
          if ('${{ matrix.cfg.awase }}' -ne 'false') {
            Start-Process -FilePath "$PWD\awase.exe" -WorkingDirectory "$PWD" -RedirectStandardError "$PWD\..\awase-stderr.log" -RedirectStandardOutput "$PWD\..\awase-stdout.log"
          }
          $deadline = (Get-Date).AddSeconds(${{ matrix.cfg.wait }})
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            if ((Test-Path ime_key_matrix_spike.log) -and (Select-String -Path ime_key_matrix_spike.log -Pattern '全手順完了' -Quiet)) { break }
          }
          }
          Pop-Location
          Get-Process awase -ErrorAction SilentlyContinue | Format-Table Name, Id
          if (Test-Path dist\awase.log) { Get-Content dist\awase.log -Encoding utf8 | Where-Object { $_ -match 'Engine (de)?activated|IME open axis delegated|outcome=Unwarranted' } | Set-Content awase-filtered.log -Encoding utf8 } else { New-Item -ItemType File -Force awase-filtered.log | Out-Null }
          $env:PYTHONUTF8 = '1'
          # 判定は summary ジョブで集計する。ここでは終了コード(0=PASS, 1=FAIL, 3=INVALID)を記録して成功で終える。
          if ('${{ matrix.cfg.probe }}' -ne '') {
            # プローブ: 測定内容は判定しないが、「実行できなかった」は INVALID(rc=3)にする(完走マーカー・ABORT・KEY 行数)。
            $plog = "dist\${{ matrix.cfg.probe_bin }}.log"
            $pdone = (Test-Path $plog) -and (Select-String -Path $plog -Pattern '=== 完了 ===' -Quiet)
            $pabort = (Test-Path $plog) -and (Select-String -Path $plog -Pattern 'ABORT' -Quiet)
            $pkeys = if (Test-Path $plog) { @(Select-String -Path $plog -Pattern 'ms KEY ').Count } else { 0 }
            if (-not $pdone -or $pabort -or $pkeys -eq 0) {
              "probe: 実行できなかった(INVALID, rc=3) 完走マーカー=$pdone ABORT=$pabort KEY行=$pkeys。ログ $plog を参照" | Tee-Object -FilePath result.txt
              $global:LASTEXITCODE = 3
            } else {
              "probe: 判定なし(ログ回収のみ, rc=0) KEY行=$pkeys。解析は notify_latency.py" | Tee-Object -FilePath result.txt
              $global:LASTEXITCODE = 0
            }
          } elseif ('${{ matrix.cfg.check }}' -eq 'typing') {
            python tools\e2e\ime_key_matrix\check_typing_stress.py --json typing.json dist\typing_stress.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'toggle') {
            python tools\e2e\ime_key_matrix\check_toggle.py dist\ime_key_matrix_spike.log dist\awase.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'charthumb') {
            python tools\e2e\ime_key_matrix\check_charthumb.py dist\ime_key_matrix_spike.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'resync') {
            python tools\e2e\ime_key_matrix\check_resync.py dist\ime_key_matrix_spike.log dist\awase.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'collect') {
            # 判定はしないが、「実行できなかった」は INVALID(rc=3)にする: (1)[GRID-ABORT]、(2)完走マーカー(全手順完了)が無い
            # (前面化失敗などで進まずに wait を使い切った)、(3)測定(KEY 行)が0件。
            $slog = 'dist\ime_key_matrix_spike.log'
            $sabort = (Test-Path $slog) -and (Select-String -Path $slog -Pattern 'GRID-ABORT' -Quiet)
            $sdone = (Test-Path $slog) -and (Select-String -Path $slog -Pattern '全手順完了' -Quiet)
            $skeys = if (Test-Path $slog) { @(Select-String -Path $slog -Pattern '\] KEY ').Count } else { 0 }
            if ($sabort -or -not $sdone -or $skeys -eq 0) {
              "collect: 実行できなかった(INVALID, rc=3) GRID-ABORT=$sabort 完走マーカー=$sdone KEY行=$skeys。ログの [GRID-ABORT] reason 等を参照" | Tee-Object -FilePath result.txt
              $global:LASTEXITCODE = 3
            } else {
              "collect: 判定なし(ログ回収のみ, rc=0) KEY行=$skeys。解析はローカルで grid_learn.py / effect_learning.py / cycle.py" | Tee-Object -FilePath result.txt
              $global:LASTEXITCODE = 0
            }
          } elseif ('${{ matrix.cfg.check }}' -eq 'vkprobe') {
            python tools\e2e\ime_key_matrix\vkprobe_report.py dist\ime_key_matrix_spike.log | Tee-Object -FilePath result.txt
          } elseif ('${{ matrix.cfg.check }}' -eq 'consistency') {
            $chkArgs = @()
            if ('${{ matrix.cfg.awase }}' -eq 'false') { $chkArgs += '--real-only' }
            python tools\e2e\ime_key_matrix\check_consistency.py @chkArgs dist\ime_key_matrix_spike.log dist\awase.log | Tee-Object -FilePath result.txt
          } else {
            python tools\e2e\ime_key_matrix\check.py dist\ime_key_matrix_spike.log awase-filtered.log | Tee-Object -FilePath result.txt
          }
          $rc = $LASTEXITCODE
          "rc=$rc" | Out-File -FilePath rc.txt -Encoding ascii
          "exit code: $rc"
          Get-Process awase, ime_key_matrix_spike, typing_stress, chrome, compartment_notify_probe, compartment_notify_probe_diag -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0

      # 不変条件(異常検出器): 上の期待表(rc.txt)とは別に数え、結果は invariants.json / inv_rc.txt に書く(summary が別の表で集計)。
      # awase を起動する構成だけ(awase=false の対照実験・probe 構成には awase.log が無い)。
      - name: 不変条件(異常検出器)を数える
        if: steps.gate.outputs.skip != 'true' && matrix.cfg.awase != 'false' && matrix.cfg.probe == ''
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          python tools\e2e\ime_key_matrix\check_invariants.py --config '${{ matrix.cfg.name }}' --json invariants.json dist\awase.log | Tee-Object -FilePath invariants.txt
          "inv_rc=$LASTEXITCODE" | Out-File -FilePath inv_rc.txt -Encoding ascii
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.cfg.name }}-${{ matrix.run }}
          path: |
            result.txt
            rc.txt
            dist/ime_key_matrix_spike.log
            dist/typing_stress.log
            typing.json
            dist/compartment_notify_probe.log
            dist/compartment_notify_probe_diag.log
            dist/awase.log
            awase-stderr.log
            awase-filtered.log
            invariants.txt
            invariants.json
            inv_rc.txt
          retention-days: 7

  summary:
    needs: [plan, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - name: 構成ごとに集計して期待と照合する
        shell: python
        env:
          CONFIGS: ${{ needs.plan.outputs.configs }}
          GATE_MODE: ${{ inputs.gate_mode || '' }}
        run: |
          import json, os, re, sys
          configs = json.loads(os.environ['CONFIGS'])
          rows, bad = [], False
          for c in configs:
            n = dict(pass_=0, fail=0, invalid=0, missing=0)
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/rc.txt"
              if not os.path.exists(f):
                n['missing'] += 1
                continue
              rc = int(re.search(r'rc=(\d+)', open(f).read()).group(1))
              n['pass_' if rc == 0 else 'invalid' if rc == 3 else 'fail'] += 1
            valid = n['pass_'] + n['fail']
            # expect=pass: 有効な回にFAILが1つも無い / expect=fail: 有効な回が全部PASSではない(=撤去で壊れた)。
            # 有効回が無ければ判定不能。
            if valid == 0:
              verdict = '判定不能'
            elif c['expect'] == 'observe':
              verdict = '観測'
            elif c['expect'] == 'pass':
              verdict = 'OK' if n['fail'] == 0 else 'NG(期待PASSだがFAIL有り)'
            else:
              verdict = 'OK' if n['fail'] > 0 else 'NG(期待FAILだが全PASS=撤去しても壊れない)'
            bad |= verdict not in ('OK', '観測')
            rows.append(f"| {c['name']} | {c['expect']} | {c.get('check','expect')} | {n['pass_']} | {n['fail']} | {n['invalid']} | {n['missing']} | {verdict} |")
          out = ["## e2e-ime 撤去実験", "", "| 構成 | 期待 | 判定方式 | PASS | FAIL | INVALID | 欠落 | 判定 |", "|---|---|---|---|---|---|---|---|"] + rows
          # 不変条件(check_invariants.py、上限は tools/e2e/ime_key_matrix/invariant_limits.json)。期待表とは別に集計する。
          inv_rows, inv_bad = [], False
          for c in configs:
            if c.get('awase') == 'false' or c.get('probe'):
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/invariants.json"
              if not os.path.exists(f):
                inv_bad = True
                inv_rows.append(f"| {c['name']} | {run} | 欠落 | - | - | - | - | - | |")
                continue
              j = json.load(open(f, encoding='utf-8'))
              k = j.get('counts', {})
              over = ', '.join(r['key'] for r in j.get('rows', []) if r['message'].startswith('FAIL'))
              lower = ', '.join(r['key'] for r in j.get('rows', []) if '下げてよい' in r['message'])
              note = '; '.join(x for x in (over and f'超過: {over}', lower and f'上限を下げてよい: {lower}', j.get('reason', '')) if x)
              inv_bad |= j['verdict'] != 'OK'
              inv_rows.append(f"| {c['name']} | {run} | {j['verdict']} | {k.get('i1_startup_drift_no_intent', '-')} | {k.get('i1_drift_no_intent_total', '-')} | {k.get('i2_unwarranted', '-')} | {k.get('i3_self_injected_ime_mode_keys', '-')} | {k.get('i3_warrant_shadow_would_block', '-')} | {note} |")
          if inv_rows:
            gate = os.environ.get('GATE_MODE') == 'invariants'
            out += ["", "## 不変条件(異常検出器)" + ("(このrunの合否)" if gate else "(情報のみ、合否は上の表)"), "",
                    "上限と対応するBUGは tools/e2e/ime_key_matrix/invariant_limits.json。各回の詳細は result-*/invariants.txt。", "",
                    "| 構成 | 回 | 判定 | I1 起動直後の意図なしdrift | I1 全体 | I2 Unwarranted | I3 自己注入IMEモードキー | I3 would_have_blocked | 備考 |",
                    "|---|---|---|---|---|---|---|---|---|"] + inv_rows
          # 高速打鍵ストレス(ts-*): result.txt 末尾の TYPING_STRESS 行を表にする(崩れ方の内訳つき)。
          ts_rows = []
          for c in configs:
            if c.get('check') != 'typing':
              continue
            for run in range(1, c.get('runs', 3) + 1):
              f = f"results/result-{c['name']}-{run}/result.txt"
              line = ''
              if os.path.exists(f):
                for l in open(f, encoding='utf-8', errors='replace').read().splitlines():
                  if l.startswith('TYPING_STRESS:'):
                    line = l
              kv = dict(re.findall(r'(\w+)=(\S+)', line))
              if not kv:
                ts_rows.append(f"| {c['name']} | {run} | 欠落 | - | - | - | - | - | - | - | - | - |")
                continue
              ts_rows.append(f"| {c['name']} | {run} | {kv.get('verdict')} | {kv.get('trials')} | {kv.get('fail')} | {kv.get('loss')} | {kv.get('extra')} | {kv.get('reorder')} | {kv.get('literal')} | {kv.get('substitute')} | {kv.get('inject_late_max_us')} | {kv.get('hook_seen_min_ratio')} |")
          if ts_rows:
            out += ["", "## 高速打鍵ストレス(ts-*、判定は入力先のテキストと期待文字列の比較。検出のみで合否には含めない)", "",
                    "loss=消失 / extra=余計 / reorder=入れ替わり / literal=ローマ字リテラル化 / substitute=別のかなに置換。注入遅れmax=予定時刻に対する実注入の最大遅れ(us)、フック到着比=自プロセスのLLフックに届いた数/送信数の最小(1.000で落ち無し)。", "",
                    "| 構成 | 回 | 判定 | 試行 | FAIL試行 | 消失 | 余計 | 入れ替わり | リテラル化 | 置換 | 注入遅れmax(us) | フック到着比 |",
                    "|---|---|---|---|---|---|---|---|---|---|---|---|"] + ts_rows
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('\n'.join(out) + '\n')
          print('\n'.join(out))
          if os.environ.get('GATE_MODE') == 'invariants':
            sys.exit(1 if inv_bad or not inv_rows else 0)
          sys.exit(1 if bad else 0)
