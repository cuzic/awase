name: msi-tray-row-verify

# MSI アンインストールで、自分のインストール先の通知領域アイコン登録行
# （HKCU\Control Panel\NotifyIconSettings）だけが消えることを windows-latest 上で確かめる
# （wix/main.wxs の RemoveTrayIconRow）。実バイナリのビルドは不要（wix の入力はダミーの exe）。
# 判定は tools/e2e/msi_tray_row/verify.ps1（疑似の行を作って msiexec の前後を比べる）。
# 動く条件: ci/msi-tray-row-verify への push、手動起動（workflow_dispatch は既定ブランチに
# このファイルがあるときだけ使える）。
on:
  push:
    branches: [ci/msi-tray-row-verify]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msi-tray-row-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress
      - name: 自分の行だけ消えることを検証
        shell: pwsh
        run: ./tools/e2e/msi_tray_row/verify.ps1 -Out out
      - name: 要約を表示
        if: always()
        shell: pwsh
        run: if (Test-Path out\summary.md) { Get-Content out\summary.md -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-tray-row-verify-out
          path: |
            out/summary.md
            out/*.log
          retention-days: 7
