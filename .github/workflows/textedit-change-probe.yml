name: textedit-change-probe

# 1回限りの検証(.claude/rules/one-off-verification-workflows.md): `IUIAutomation3::AddTextEditTextChangedEventHandler`
# (ITextEditProvider)が EDIT/RICHEDIT50W の各コントロールで、実際の MS-IME composition に対して発火するかを
# windows-latest で測る(examples/spike_textedit_change_probe.rs)。結果は docs/tasks/textedit-change-event-probe.md
# に書いたらこの workflow 自体を撤去する。
#
# 動く条件: ci/textedit-change-probe への push、手動起動(workflow_dispatch は既定ブランチにこのファイルがある
# ときだけ使える)。
on:
  push:
    branches: [ci/textedit-change-probe]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: textedit-change-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: textedit-change-probe

      # Microsoft IME 本体: ja-JP の言語を追加すると標準の日本語IME(Microsoft IME)が入る。
      # e2e-ime.yml の同名ステップ(matrix.cfg.ime == 'msime')と同じ手順。
      - name: 入力言語に ja-JP を追加して Microsoft IME を使えるようにする
        shell: pwsh
        run: |
          $msimeTip = '0411:{03B5835F-F03C-411B-9CE2-AA23E1171E36}{A76C93D9-5523-4E90-AAFA-4DB112F9AC76}'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          Set-WinUserLanguageList -LanguageList $list -Force
          "Set-WinUserLanguageList: $([int]$sw.Elapsed.TotalSeconds)s"
          $tipKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{03B5835F-F03C-411B-9CE2-AA23E1171E36}'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $tipKey); $i++) { Start-Sleep -Seconds 5 }
          "TIP_REGISTERED=$(Test-Path $tipKey) after $([int]$sw.Elapsed.TotalSeconds)s"
          if (-not (Test-Path $tipKey)) {
            Get-WindowsCapability -Online -Name 'Language.*ja-JP*' | Format-Table Name, State
            Add-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0' 2>&1 | Select-Object -Last 3
            "TIP_REGISTERED(after capability)=$(Test-Path $tipKey) after $([int]$sw.Elapsed.TotalSeconds)s"
          }
          try { Set-WinDefaultInputMethodOverride -InputTip $msimeTip -ErrorAction Stop }
          catch { "default input method override FAILED: $($_.Exception.Message)" }
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: プローブをビルド
        shell: pwsh
        run: cargo build -p awase-windows --example spike_textedit_change_probe --release

      - name: EDIT/RICHEDIT50W + MS-IME で TextEditTextChanged イベントを観測する
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          & target\release\examples\spike_textedit_change_probe.exe 2>&1 | Tee-Object -FilePath out\probe.txt

      - name: 要約を表示
        if: always()
        shell: pwsh
        run: |
          if (Test-Path out\probe.txt) {
            $lines = Get-Content out\probe.txt -Encoding utf8
            $sum = @('# TextEditTextChanged プローブ(EDIT/RICHEDIT50W × MS-IME)', '', '```')
            $sum += ($lines | Where-Object { $_ -match '^# ' -or $_ -match '^TXTEDIT ' })
            $sum += '```'
            $sum | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textedit-change-probe-out
          path: out/
          retention-days: 7
