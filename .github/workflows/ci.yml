name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # mutants ジョブを手動起動するため。push/pull_request では他ジョブと同様に動くが、
  # mutants ジョブ自体は if で workflow_dispatch 起動時のみに絞ってある。
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --lib
      # awase-windows は Windows 専用コードだが、state/ 層のユニットテストと
      # architecture_guard / golden_scenarios / layer_boundary_guard は
      # ソースをテキスト走査する第二防衛線でプラットフォーム非依存なため Linux でも走る。
      # ime_key_sequence_golden は #![cfg(windows)] なので Linux では 0 tests。
      # 実際の assert は windows-build ジョブで実行する。
      - run: cargo nextest run --lib -p awase-windows
      - run: cargo nextest run -p awase-windows --test architecture_guard --test golden_scenarios --test layer_boundary_guard

  windows-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-xwin
      # 実際に配布している awase.exe/awase-settings.exe は MSVC ABI（windows-build
      # ジョブの windows-latest ランナーが使う既定ツールチェイン）。以前はここで
      # x86_64-pc-windows-gnu (mingw) にクロスコンパイルしていたが、それは一度も
      # 出荷しない ABI を検証していただけだった。cargo-xwin（Windows SDK/CRT を
      # 取得して MSVC ABI へクロスリンクする）に切り替え、実際に出荷する ABI と
      # 同じものを Linux 上で早期検証する。
      # Windows テストバイナリをビルドするのみ（実行はしない、Linux 上では
      # Windows バイナリを実行できないため）。Linux では検出できない Windows
      # 固有の型エラー・API 不一致をローカル CI で早期発見する。
      # 素の RUSTFLAGS 環境変数は使わない: cargo-xwin はターゲット別 rustflags
      # （リンカ・ライブラリパス指定）を設定するが、RUSTFLAGS 環境変数は
      # Cargo の優先順位で最上位のため、これを設定するとターゲット別 rustflags を
      # 丸ごと上書きしてクロスリンクが壊れる。warning-as-error 化は実 Windows で
      # 走る windows-build ジョブの clippy ステップ（-D warnings）に任せる。
      - run: cargo xwin build --tests -p awase-windows

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --lib -- -A clippy::cargo_common_metadata -D warnings -W clippy::cognitive_complexity

  dylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # カスタム dylint lint (no_vk_as_scan / ime_event_guard / observation_source_guard)
      # はレイヤー境界を機械的に強制する。
      # rustc_private を使うため nightly + rustc-dev/llvm-tools-preview が必須。
      # toolchain は lints/*/rust-toolchain に固定された値と一致させること（勝手に上げない）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-22
          components: rustc-dev, llvm-tools-preview
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-xwin
      - name: Install cargo-dylint
        run: cargo install cargo-dylint dylint-link --version 6.0.0 --locked
      # dylint には windows-cross-check ジョブの `cargo xwin build/clippy` のような
      # 専用サブコマンドが無いため、`cargo xwin env` が出力するクロスリンク用の
      # 環境変数（リンカ・Windows SDK/CRT のパス指定）を同じステップ内で `eval` して
      # から素の `cargo dylint --target x86_64-pc-windows-msvc` を叩く。
      # `cargo xwin env` の出力は `export NAME="value";` という bash 構文であり
      # （値に `;` 区切りの Windows パスを含むものもある: LIB 変数等）、$GITHUB_ENV
      # が期待する `NAME=value` 形式とは異なるため、$GITHUB_ENV 経由でステップを
      # またいで引き継ぐには自前でパースし直す必要がある。それよりも同一シェル内で
      # `eval` する方が、bash 構文をそのまま正しく解釈できて確実（実際に
      # `cargo xwin env --target x86_64-pc-windows-msvc >> "$GITHUB_ENV"` は
      # クォート・セミコロンが値としてそのまま書き込まれて壊れることをローカルで確認済み）。
      # awase-windows を Windows ターゲットで check し、journal.rs 等の #[cfg(windows)]
      # コードも含めて lint する（windows-cross-check ジョブと同じ cross-compile 方針）。
      # 両 lint は Warn レベルなので DYLINT_RUSTFLAGS=-D warnings で CI エラーへ昇格させる
      # (これは cargo-xwin のターゲット別 rustflags とは別の、dylint 専用の環境変数
      # なので windows-cross-check ジョブで避けた素の RUSTFLAGS 上書き問題は起きない)。
      - name: Run dylint (custom layer-boundary lints)
        env:
          DYLINT_RUSTFLAGS: "-D warnings"
        run: |
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc)"
          cargo dylint --all -p awase-windows -- --target x86_64-pc-windows-msvc

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  # push/pull_request 毎にブロッキングで実行する。cargo-audit はコード変更が
  # 無くても新しい advisory の公開だけで赤くなり得るが、他ジョブ(clippy pedantic+
  # nursery deny 等)と同様にこのリポジトリは検知したら都度 .cargo/audit.toml で
  # トリアージする方針を採る(2026-07-26、Task #2でquick-xml等を実際にこの方式で
  # 処理済み)。無関係なPRが赤くなるコストより、脆弱性の見逃しを防ぐ利益を優先する。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: Clippy (awase-windows)
        run: cargo clippy -p awase-windows -- -A clippy::cargo_common_metadata -D warnings -W clippy::cognitive_complexity

      - name: Build awase.exe
        run: cargo build --release -p awase-windows

      - name: Build awase-settings.exe
        run: cargo build --release -p awase-settings

      # awase-settings は今まで実 Windows でテストが一度も走っていなかった
      # （build のみで test 未実行）。egui::Grid が行内 add_space() で panic する
      # 不具合（プレビュータブを開くと無言のまま強制終了）が Linux 上の headless
      # 再現テストでは検出できても実 Windows で再現するかは未検証だったため追加。
      - name: Run awase-settings tests (Windows)
        run: cargo nextest run -p awase-settings

      - name: Install Japanese IME
        shell: pwsh
        run: |
          $langList = New-WinUserLanguageList ja-JP
          $langList.Add("en-US")
          Set-WinUserLanguageList $langList -Force
          Write-Host "Language list set: ja-JP, en-US"

      # src/ 内の #[cfg(windows)] ユニットテスト（composition_fsm/probe_fsm/
      # literal_detect_fsm/gji_fsm/observer/probe_io/hook 等）は、Linux 側 test job の
      # `cargo nextest run --lib -p awase-windows`(旧 `cargo test --lib -p awase-windows`)
      # では #[cfg(windows)] ゆえ 0 tests になり、この windows-build job もこれまで
      # `--lib` を一度も実行していなかったため、push/PR 毎の通常 CI では事実上どこでも
      # 実行されていなかった。
      # 2026-07-25、workflow_dispatch 専用（push/PR では起動しない）の
      # mutants-windows.yml（GCP Spot self-hosted Windows runner）で cargo mutants の
      # baseline フェーズとして初めて実 Windows 実行され、15件のテスト不具合
      # （実装バグ1件 = BUG-41、テスト自体の不具合14件）が発覚・同日中に修正され
      # 全パス確認済み（docs/known-bugs.md BUG-41 および直後のセクション参照、
      # GitHub Actions run 30098397721）。その検証は push/PR 毎には走らない
      # self-hosted 専用ワークフローに限られていたため、以後の regression を
      # push/PR ゲートで検知できるよう通常の windows-build job にも組み込む。
      # TSF_OBS 等のグローバル状態を触るテストは observer.rs/probe.rs/
      # literal_detect_fsm.rs/probe_fsm.rs の4ファイルが単一の TSF_OBS_TEST_LOCK で
      # 直列化済み（上記修正で統一）だった。2026-07-26、cargo test から cargo nextest
      # へ移行（プロセス単位でテストを分離するランナー）したことで、各テストが別
      # プロセスで実行され TSF_OBS static もプロセスごとに独立するため、この種の
      # クロステスト汚染は構造的に発生しなくなった（TSF_OBS_TEST_LOCKは無害だが
      # 冗長化）。ブロック化（continue-on-errorなし）は維持する。
      - name: Run lib unit tests (Windows)
        run: cargo nextest run --lib -p awase-windows

      # ime_key_sequence_golden は #![cfg(windows)] のため Linux の test ジョブでは
      # 0 tests になり、実質どこでも走っていなかった。ここ（実 Windows）で初めて
      # 戦略選択のゴールデンを assert する。architecture_guard/golden_scenarios/
      # layer_boundary_guard も Windows ターゲットで再実行し、#[cfg] ドリフトを検知する。
      # これらは決定的（環境非依存）なのでブロック化する（continue-on-error なし）。
      - name: Run golden / architecture guard tests (Windows)
        run: cargo nextest run -p awase-windows --test architecture_guard --test golden_scenarios --test layer_boundary_guard --test ime_key_sequence_golden

      # E2E の決定的テスト（純 Engine の in-process ロジック + SendMessage/WM_CHAR）は
      # フォアグラウンドフォーカス非依存で、実 HWND 生成に失敗しても early-return で
      # skip するため spurious failure を起こさない。よってブロック化する。
      # 旧ステップは `-p` 欠落で "no test target" エラーになっていたが continue-on-error
      # で握り潰されており、E2E は CI で一度も実行されていなかった（-p awase-windows で修正）。
      - name: Run E2E tests (deterministic — blocks CI on failure)
        run: cargo nextest run -p awase-windows --test e2e_windows -- --nocapture --skip e2e_sendinput --skip e2e_ime_status_detection
        env:
          RUST_LOG: debug

      # SendInput 系（e2e_sendinput_interactive / e2e_sendinput_special_keys_interactive）と
      # 実 IME 依存（e2e_ime_status_detection）はフォアグラウンドフォーカスや実 IME の
      # 生成タイミングに依存する非決定的テスト。CI (GITHUB_ACTIONS) では
      # is_interactive_session() が false を返して early-return で skip されるが、
      # 将来ローカル/セルフホストで有効化された際の timing race を CI 赤化に波及させない
      # よう continue-on-error を維持する。
      - name: Run E2E interactive tests (non-deterministic — informational only)
        continue-on-error: true
        run: cargo nextest run -p awase-windows --test e2e_windows -- --nocapture e2e_sendinput e2e_ime_status_detection
        env:
          RUST_LOG: debug

      - name: Prepare distribution
        shell: bash
        run: |
          mkdir -p dist/layout dist/data dist/scripts
          cp target/release/awase.exe dist/
          cp target/release/awase-settings.exe dist/
          cp config.toml dist/
          cp layout/*.yab dist/layout/
          cp data/*.csv.gz dist/data/ 2>/dev/null || true
          cp data/*.toml dist/data/ 2>/dev/null || true
          cp scripts/run-e2e.ps1 dist/scripts/
          cp scripts/install.ps1 dist/
          cp scripts/uninstall.ps1 dist/
          cp README.md dist/
          for f in LICENSE*; do [ -e "$f" ] && cp "$f" dist/; done

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: awase-windows-x64
          path: dist/

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath awase-windows-x64.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: awase-windows-x64-zip
          path: awase-windows-x64.zip

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build MSI
        shell: cmd
        run: |
          set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.14\bin
          candle.exe wix\main.wxs -dVersion=0.1.0 -out wix\main.wixobj
          light.exe wix\main.wixobj -out awase-0.1.0-x64.msi -ext WixUIExtension

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: awase-windows-x64-msi
          path: awase-0.1.0-x64.msi

  # 手動起動専用（push/pull_request では動かない）。設定は .cargo/mutants.toml、
  # 対象は `awase` パッケージ（プラットフォーム非依存の中核ロジック）のみ。
  # フル実行は数十分かかるため、通常の push/PR ゲートには含めない。
  mutants:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - name: Run cargo-mutants (awase core crate)
        run: cargo mutants --no-shuffle
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/

  # mutants-windows(self-hosted runner向け)は2026-07に mutants-windows.yml
  # へ分離した。public repoでself-hosted runnerを使うjobは、push/pull_request
  # と同居するファイルのif条件だけに守らせるのではなく、workflow_dispatch専用の
  # 別ファイルにしてトリガー面自体からpull_requestを排除する方が安全なため
  # (mutants-windows.yml冒頭のコメント参照)。

  # 手動起動専用。対象は awase-windows のうちプラットフォーム非依存な
  # ~550 mutants のみ（設定は .cargo/mutants-awase-windows.toml）。
  # awase-windows の大半を占める #[cfg(windows)] コードは Linux 上では
  # コンパイルされず、無指定で走らせると false MISSED だらけになるため
  # 明示的なファイル許可リストでスコープを絞ってある（詳細は同 toml 内コメント参照）。
  # Windows 実機依存のロジック自体のミューテーションテスト(#[cfg(windows)]配下)は
  # mutants-windows.yml(self-hosted Windows runner)が別途担当する。
  mutants-awase-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - name: Run cargo-mutants (awase-windows, platform-independent subset)
        run: cargo mutants -p awase-windows --config .cargo/mutants-awase-windows.toml --no-shuffle
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-awase-windows
          path: mutants.out/
