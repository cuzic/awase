name: ime-scope

# ADR-282 の測定: GJI・MS-IME が IME の開閉・変換モードを窓(スレッド)ごとに持つか、全体で共有するか。
# 窓 A(別プロセス)で状態を作って保持し、別プロセスの窓 B で ka を打った結果を読む(awase は起動しない)。
# A/B: 自前の Win32 EDIT(読める窓)・実 Chrome(読めない窓)・Windows Terminal。判定は tools/e2e/ime_scope/scope_probe.py。
# 動く条件: ci/adr282-ime-scope への push。判定の合否は付けない(測定と記録のみ)。
on:
  push:
    branches: [ci/adr282-ime-scope]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ime-scope-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ime: [gji, msime]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: config-verify
      - name: typing_stress をビルド
        shell: pwsh
        run: |
          cargo build -p awase-windows --example typing_stress
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\debug\examples\typing_stress.exe dist\
      - name: 純粋部分の単体テスト
        shell: pwsh
        run: |
          Push-Location tools\e2e\ime_scope
          python -m unittest test_scope_pure -v
          Pop-Location

      - name: Google 日本語入力をインストール
        if: matrix.ime == 'gji'
        shell: pwsh
        run: |
          ./tools/ci/install-gji.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 入力言語を ja-JP + GJI に設定(ATOK プリセットの config1.db)
        if: matrix.ime == 'gji'
        shell: pwsh
        run: |
          $googleImeTip = '0411:{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}{773EB24E-CA1D-4B1B-B420-FA985BB0B80D}'
          $l = New-WinUserLanguageList ja-JP
          $l[0].InputMethodTips.Clear()
          $l[0].InputMethodTips.Add($googleImeTip)
          Set-WinUserLanguageList $l -Force 2>&1
          try { Set-WinDefaultInputMethodOverride -InputTip $googleImeTip -ErrorAction Stop }
          catch { "default input method override FAILED: $($_.Exception.Message)" }
          $dir = Join-Path $env:USERPROFILE 'AppData\LocalLow\Google\Google Japanese Input'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $bytes = [byte[]](0xB0,0x01,0x00,0xC8,0x02,1)
          [IO.File]::WriteAllBytes((Join-Path $dir 'config1.db'), $bytes)
          Get-Process | Where-Object { $_.Name -match 'googleime|mozc' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
      - name: 入力言語に ja-JP を追加して Microsoft IME を使えるようにする
        if: matrix.ime == 'msime'
        shell: pwsh
        run: |
          $msimeTip = '0411:{03B5835F-F03C-411B-9CE2-AA23E1171E36}{A76C93D9-5523-4E90-AAFA-4DB112F9AC76}'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          Set-WinUserLanguageList -LanguageList $list -Force
          $tipKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{03B5835F-F03C-411B-9CE2-AA23E1171E36}'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $tipKey); $i++) { Start-Sleep -Seconds 5 }
          "TIP_REGISTERED=$(Test-Path $tipKey) after $([int]$sw.Elapsed.TotalSeconds)s"
          if (-not (Test-Path $tipKey)) {
            Add-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0' 2>&1 | Select-Object -Last 3
          }
          try { Set-WinDefaultInputMethodOverride -InputTip $msimeTip -ErrorAction Stop }
          catch { "default input method override FAILED: $($_.Exception.Message)" }
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: 環境の記録(wt.exe・Chrome)
        shell: pwsh
        run: |
          Get-Command wt.exe -ErrorAction SilentlyContinue | Format-List Source
          Get-Item "C:\Program Files\Google\Chrome\Application\chrome.exe" -ErrorAction SilentlyContinue | Format-List VersionInfo
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').ProductName
      - name: A/B の窓の組で IME 状態の保持範囲を測る
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python tools\e2e\ime_scope\scope_probe.py --dist dist --out out --ime ${{ matrix.ime }} --layout layout\nicola_keytop.yab --pairs edit>wt,wt>edit --rounds 0 --wt-rounds 6 --wt-settle 3 --on-wait 2.5 --on-times 2 2>&1 | Tee-Object -FilePath out-console.log
          exit 0
      - name: 概要を表示
        if: always()
        shell: pwsh
        run: |
          if (Test-Path out\summary.md) { Get-Content out\summary.md -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          if (Test-Path out-console.log) { Select-String -Path out-console.log -Pattern '^SCOPE:|^ENV' | ForEach-Object { $_.Line } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ime-scope-${{ matrix.ime }}
          path: |
            out/
            out-console.log
          retention-days: 14
