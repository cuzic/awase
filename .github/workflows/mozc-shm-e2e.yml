name: mozc-shm-e2e

# ADR-265 段階 2: awase が mozc-readable の共有メモリを読む処理を、実際の Mozc Readable と動かして、
# 実機の測定が測っていない「危ない場面」(フォーカス移動の直後、同じプロセスの別スレッド、AppContainer、
# IME を切り替えたあとの古い共有メモリ)を GitHub Actions の Windows で測る。
# 真値は操作から決め(窓ごとの IME 状態は設定した値)、awase.log の `[mozc-shm]` の記録を突き合わせる。
# [BUG-232/ADR-291 D5] tickchurn は awase を使わず、mozc-readable 自体の update_tick_ms が
# tsf_open/tsf_mode の変化無しでも進むこと(ブロック全体の dirty タイムスタンプであること)を
# 実機で確認する(docs/known-bugs/BUG-232.md 参照)。
# 道具: tools/mozc_shm_ci/(shmci.py と run_scenario.ps1)。mozc-readable 側の MSI と AppContainer 用の部品は、
# cuzic/mozc-readable の readable ブランチから取る(最新の成功した readable-build の MSI)。
#
# workflow_dispatch は既定ブランチにワークフローが無いと使えないので、ci/mozc-shm-e2e への push でも回す。

on:
  push:
    branches: [ci/mozc-shm-e2e, ci/mozc-shm-e2e2, ci/bug234-publish-delay, ci/directact-real]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mozc-shm-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # 突き合わせの判定(shmci.py analyze)の自己テスト。Windows 不要。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mozc_shm_ci/shmci.py selftest

  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          save-if: false
      - name: awase をビルド
        shell: pwsh
        run: |
          cargo build -p awase-windows --bin awase
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\debug\awase.exe dist\
          Copy-Item config.toml dist\
      - uses: actions/upload-artifact@v4
        with:
          name: awase-dist
          path: dist
          retention-days: 3

  measure:
    needs: [unit, build]
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # stale は IME(レイアウト)の切り替えがセッション全体に効くので、専用のジョブにする。
        # include だけで列挙する(既存の値と同じ項目を持つ include は、新しいジョブではなく既存のジョブに項目を足してしまう)。
        include:
          # [BUG-234] 1 回限りの検証(ci/bug234-publish-delay): mozc-readable の試験用の遅延注入で、明示 OFF の後の
          # 開閉の公開を遅らせ、awase が古い「開」へ追随するかを遅延量ごとに測る。0 は対照(遅延なし)。
          - scenario: bug234
            delay: 0
          - scenario: bug234
            delay: 300
          - scenario: bug234
            delay: 700
          - scenario: bug234
            delay: 2000
          # [ADR-293 10節] awase 本体の実送信経路(apply_mozc_direct)が、本物の mozc-readable
          # フォーク(exp/direct-actuation-channel、version 6 nonce/ack)と実際に ack 往復するかを測る。
          - scenario: directact-real
    steps:
      - uses: actions/checkout@v4
      - name: mozc-readable の CI の部品(AppContainer 用)
        uses: actions/checkout@v4
        with:
          repository: cuzic/mozc-readable
          ref: readable
          path: mozc-readable
      - uses: actions/download-artifact@v4
        with:
          name: awase-dist
          path: dist
      - name: mozc-readable の MSI(最新の成功した readable-build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # bug234 は遅延注入の入った exp/open-close-publish-delay、directact-real は
          # version 6 nonce/ack の入った exp/direct-actuation-channel の MSI を使う。
          $branch = switch ('${{ matrix.scenario }}') {
            'bug234' { 'exp/open-close-publish-delay' }
            'directact-real' { 'exp/direct-actuation-channel' }
            default { 'readable' }
          }
          $run = gh run list -R cuzic/mozc-readable --workflow readable-build.yaml --branch $branch --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          Write-Host "mozc-readable readable-build run: $run"
          gh run download $run -R cuzic/mozc-readable -n Mozc64_x64.msi -D msi
          Get-ChildItem msi | Out-Host
      - name: 場面を測る (${{ matrix.scenario }})
        shell: pwsh
        run: ./tools/mozc_shm_ci/run_scenario.ps1 -Scenario ${{ matrix.scenario }} -Msi "${{ github.workspace }}\msi\Mozc64.msi" -Dist dist -OutDir out -DelayMs ${{ matrix.delay || 0 }} ${{ matrix.noawase }} ${{ matrix.fast }}
      - name: 結果を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mozc-shm-${{ matrix.scenario }}-d${{ matrix.delay || 0 }}${{ matrix.noawase && '-control' || '' }}${{ matrix.fast && '-fast' || '' }}${{ matrix.tag && format('-{0}', matrix.tag) || '' }}
          path: out
          if-no-files-found: ignore
          retention-days: 7
