name: bug183-lang-switch
# BUG-183(issue #445): 入力言語のホットキー経由でロシア語へ切り替えると awase が日本語入力のまま残る件の再現。
# lang_switch_probe(altshift / winspace / hk3 / request)で切替を注入し、実際の切替時刻と awase の Engine 非活性化を突き合わせる。
# 観測のみ。ci/bug183-lang-switch への push で回る。
on:
  push:
    branches: [ci/bug183-lang-switch]
    paths:
      - 'crates/awase-windows/examples/lang_switch_probe.rs'
      - 'tools/e2e/bug183/**'
      - '.github/workflows/bug183-lang-switch.yml'
  workflow_dispatch:

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bug183
      - name: 入力言語に ja-JP(Microsoft IME)と ru-RU を追加する
        shell: pwsh
        run: |
          $msimeTip = '0411:{03B5835F-F03C-411B-9CE2-AA23E1171E36}{A76C93D9-5523-4E90-AAFA-4DB112F9AC76}'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          $list.Add("ru-RU")
          Set-WinUserLanguageList -LanguageList $list -Force
          $tipKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{03B5835F-F03C-411B-9CE2-AA23E1171E36}'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $tipKey); $i++) { Start-Sleep -Seconds 5 }
          "TIP_REGISTERED=$(Test-Path $tipKey) after $([int]$sw.Elapsed.TotalSeconds)s"
          try { Set-WinDefaultInputMethodOverride -InputTip $msimeTip -ErrorAction Stop }
          catch { "default input method override FAILED: $($_.Exception.Message)" }
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 8
      - name: awase とプローブをビルド
        shell: pwsh
        run: |
          cargo build -p awase-windows --bin awase
          cargo build -p awase-windows --example lang_switch_probe
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\debug\awase.exe dist\
          Copy-Item target\debug\examples\lang_switch_probe.exe dist\
          Copy-Item config.toml dist\ -ErrorAction SilentlyContinue
          # 初回のクロスプロセス IMM プローブが遅いと awase が窓を「IMM不可」と誤学習するので、学習済みキャッシュを投入する。
          [IO.File]::WriteAllText("$PWD\dist\cache.toml", "[imm_capability.`"lang_switch_probe.exe`"]`r`nEdit = `"works`"`r`n")
      - name: 測定
        shell: pwsh
        run: |
          $env:RUST_LOG = 'debug'
          $env:AWASE_TEST_INJECTION = '1'
          Push-Location dist
          # awase を先に起動して TIP を検出させてから、プローブを起動して切替を注入する。
          Start-Process -FilePath "$PWD\awase.exe" -WorkingDirectory "$PWD" -RedirectStandardError "$PWD\..\awase-stderr.log" -RedirectStandardOutput "$PWD\..\awase-stdout.log"
          Start-Sleep -Seconds 10
          Start-Process -FilePath .\lang_switch_probe.exe -ArgumentList '--trials=4 --observe-ms=10000'
          $deadline = (Get-Date).AddMinutes(25)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            if ((Test-Path lang_switch_probe.log) -and (Select-String -Path lang_switch_probe.log -Pattern '\[ls\] (done|ABORT)' -Quiet)) { break }
          }
          Pop-Location
          if (Test-Path dist\lang_switch_probe.log) { Get-Content dist\lang_switch_probe.log -Encoding utf8 | Select-Object -First 6 }
      - name: 集計(summary)
        if: always()
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          if ((Test-Path dist\lang_switch_probe.log) -and (Test-Path dist\awase.log)) {
            python tools\e2e\bug183\summarize.py dist\lang_switch_probe.log dist\awase.log
          } else { "ログが無い(probe=$(Test-Path dist\lang_switch_probe.log) awase=$(Test-Path dist\awase.log))" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-bug183
          path: |
            dist/lang_switch_probe.log
            dist/awase.log
            awase-stderr.log
