name: msime-settings-engine

# 設定アプリ(MS-IME のページ)を UIA で読み、互換モードのチェックの状態・「キーの割り当て」セクションの有無を、
# レジストリのフラグ別に採取する(CI が旧エンジン固定かの判別の手がかり)。観測のみ。
on:
  push:
    branches: [ci/msime-legacy-keytable-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: config-verify
      - name: プローブをビルド
        shell: pwsh
        run: |
          cargo build -p awase-windows --example msime_key_assignment_settings_probe
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\debug\examples\msime_key_assignment_settings_probe.exe dist\
      - name: 入力言語に ja-JP を追加して Microsoft IME を使えるようにする
        shell: pwsh
        run: |
          $msimeTip = '0411:{03B5835F-F03C-411B-9CE2-AA23E1171E36}{A76C93D9-5523-4E90-AAFA-4DB112F9AC76}'
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          Set-WinUserLanguageList -LanguageList $list -Force
          $tipKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{03B5835F-F03C-411B-9CE2-AA23E1171E36}'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $tipKey); $i++) { Start-Sleep -Seconds 5 }
          "TIP_REGISTERED=$(Test-Path $tipKey)"
          try { Set-WinDefaultInputMethodOverride -InputTip $msimeTip -ErrorAction Stop } catch { "override FAILED: $($_.Exception.Message)" }
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
      - name: 設定アプリを読む
        shell: pwsh
        run: ./tools/ci/msime-settings-engine.ps1 -Out settings-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msime-settings-engine
          path: |
            settings-out/
            dist/*.log
