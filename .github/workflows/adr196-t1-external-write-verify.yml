name: adr196-t1-external-write-verify

# ADR-196 T1(学習窓への外部からの書き込みを直接観測する基盤、実装済み・PR #259・
# develop統合済みだが実機未検証)の実機検証用ワークフロー
# (docs/tasks/adr196-t1-external-write-observation.md)。
#
# .github/workflows/adr195-t1-actuation-zero.yml(ci/adr195-t1-actuation-zero
# ブランチ)を土台にしている。あちらは「学習プロセス実行中にawase.logへ
# actuationログが出ないこと(A')」を確認する。本ワークフローは一歩進めて、
# awase.exeが実際に学習窓へ書き込む(=A'違反)場合に、ADR196-T1が実装した
# 観測基盤(quiet window・hook_monitor・ime_notify・session_monitor)が
# それを「外部からの書き込み」として検出できているかを見る
# (driver.rs::RealImeDriver::drop内の一時的な診断eprintln、
# コミットで追加、ADR196-T1タグ付き)。
#
# 恒久的な自動チェックではなく、この一回の実測用。
on:
  push:
    branches: [diag/adr196-t1-external-write-verify]
    paths:
      - 'crates/awase-keymap-learn-win/**'
      - 'crates/awase-keymap-learn/**'
      - 'crates/awase-windows/**'
      - 'src/**'
      - '.github/workflows/adr196-t1-external-write-verify.yml'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  external-write-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: adr196-t1-external-write-verify

      - name: awase と学習プロセスをビルド
        shell: pwsh
        run: |
          cargo build -p awase-windows --bin awase
          cargo build -p awase-keymap-learn-win
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\debug\awase.exe dist\
          Copy-Item target\debug\awase-keymap-learn-win.exe dist\
          Copy-Item config.toml dist\ -ErrorAction SilentlyContinue

      # e2e-ime.yml / adr195-t1-actuation-zero.yml と同じ手順(GJI導入・ATOKプリセットのconfig1.db書き込み)。
      - name: Google 日本語入力をインストール(chocolatey)
        shell: pwsh
        run: |
          choco install googlejapaneseinput -y --no-progress 2>&1 | Select-Object -Last 3

      - name: 入力言語をja-JP + GJIに設定、ATOKプリセットのconfig1.dbを書く
        shell: pwsh
        run: |
          $googleImeTip = '0411:{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}{773EB24E-CA1D-4B1B-B420-FA985BB0B80D}'
          $l = New-WinUserLanguageList ja-JP
          $l[0].InputMethodTips.Clear()
          $l[0].InputMethodTips.Add($googleImeTip)
          Set-WinUserLanguageList $l -Force 2>&1
          try { Set-WinDefaultInputMethodOverride -InputTip $googleImeTip -ErrorAction Stop }
          catch { "default input method override FAILED: $($_.Exception.Message)" }
          $dir = Join-Path $env:USERPROFILE 'AppData\LocalLow\Google\Google Japanese Input'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # session_keymap(field 41)=1(ATOK)、check_default(field 22)=0。
          [IO.File]::WriteAllBytes((Join-Path $dir 'config1.db'), [byte[]](0xB0,0x01,0x00,0xC8,0x02,0x01))
          Get-Process | Where-Object { $_.Name -match 'googleime|mozc' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: awaseを起動し、学習プロセスを実行してADR196-T1の観測基盤の反応を見る
        id: run
        shell: pwsh
        run: |
          $env:RUST_LOG = 'debug'
          Push-Location dist

          # awaseを先に起動し、初期化を落ち着かせる。
          Start-Process -FilePath "$PWD\awase.exe" -WorkingDirectory "$PWD" `
            -RedirectStandardError "$PWD\..\awase-stderr.log" -RedirectStandardOutput "$PWD\..\awase-stdout.log"
          Start-Sleep -Seconds 8

          $before = if (Test-Path awase.log) { (Get-Content awase.log -Encoding utf8).Count } else { 0 }
          "awase.log の行数(学習プロセス起動前)=$before"

          # 学習プロセス(専用EDIT窓・SendInput直叩き)を起動する。ADR196-T1のquiet window
          # (起動直後200ms)にawaseの書き込みが重なれば`RealImeDriver::new()`がErrを返し、
          # 学習プロセスはすぐ終了する(それ自体が検出成功の証拠)。既定strategy(S6)は
          # 全状態を巡るため長時間かかりうるが、ここでは観測基盤の反応が目的なので
          # 120秒(または学習プロセスの自然終了)のどちらか早い方で打ち切る。
          $learn = Start-Process -FilePath "$PWD\awase-keymap-learn-win.exe" -WorkingDirectory "$PWD" `
            -RedirectStandardError "$PWD\..\learn-stderr.log" -RedirectStandardOutput "$PWD\..\learn-stdout.log" -PassThru

          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and -not $learn.HasExited) {
            Start-Sleep -Seconds 3
            $learn.Refresh()
          }
          $learnExited = $learn.HasExited
          if (-not $learnExited) {
            Stop-Process -Id $learn.Id -Force -ErrorAction SilentlyContinue
          }

          $after = if (Test-Path awase.log) { Get-Content awase.log -Encoding utf8 } else { @() }
          $newLines = if ($after.Count -gt $before) { $after[$before..($after.Count - 1)] } else { @() }
          "学習プロセス実行中に追加された awase.log の行数=$($newLines.Count) (学習プロセスは$(if ($learnExited) {'自然終了'} else {'120秒でタイムアウト、強制終了'}))"

          $actuationLines = $newLines | Select-String -Pattern '\[warrant-shadow\]|send_input_safe|Engine (de)?activated'
          Pop-Location

          Get-Process awase, awase-keymap-learn-win -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $learnErr = if (Test-Path learn-stderr.log) { Get-Content learn-stderr.log -Encoding utf8 } else { @() }
          $quietWindowHit = $learnErr | Select-String -Pattern 'quiet window中に外部からの書き込みを検出した'
          $diagSummary = $learnErr | Select-String -Pattern 'ADR196-T1診断サマリ'

          "=== awase.log中のactuation行(A'違反の有無) ===" | Tee-Object -FilePath result.txt
          if ($actuationLines) {
            "awase側でactuationあり($($actuationLines.Count)行)" | Tee-Object -Append -FilePath result.txt
            $actuationLines | ForEach-Object { $_.Line } | Tee-Object -FilePath actuation-lines.log
          } else {
            "awase側でactuationなし(新規$($newLines.Count)行中0件)" | Tee-Object -Append -FilePath result.txt
          }
          "=== quiet window(起動時)でのA'違反検出 ===" | Tee-Object -Append -FilePath result.txt
          if ($quietWindowHit) {
            "検出あり: $($quietWindowHit.Line)" | Tee-Object -Append -FilePath result.txt
          } else {
            "検出なし(quiet window中は外部書き込み無し、またはRealImeDriver::newが呼ばれなかった)" | Tee-Object -Append -FilePath result.txt
          }
          "=== ADR196-T1診断サマリ(hook_monitor/notify_monitor/session_monitor累計) ===" | Tee-Object -Append -FilePath result.txt
          if ($diagSummary) {
            $diagSummary | ForEach-Object { $_.Line } | Tee-Object -Append -FilePath result.txt
          } else {
            "診断サマリ行なし(RealImeDriverがDropされなかった可能性、learn-stderr.logを確認)" | Tee-Object -Append -FilePath result.txt
          }
          "rc=0" | Out-File -FilePath rc.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adr196-t1-external-write-verify-result
          path: |
            result.txt
            rc.txt
            actuation-lines.log
            dist/awase.log
            awase-stderr.log
            awase-stdout.log
            learn-stderr.log
            learn-stdout.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 結果表示
        shell: pwsh
        run: |
          Get-Content result.txt
