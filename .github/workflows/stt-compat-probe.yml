name: stt-compat-probe

# 音声入力ソフト・Windows 標準の音声入力(Win+H)との相性を CI で確かめる前の、ランナーの観測(判定は付けない)。
# 見るもの: Windows の版、音声デバイスの有無、仮想音声デバイスの入手経路、注入した Win+H で音声入力が出るか。
# 動く条件: ci/stt-compat-probe への push、手動起動(workflow_dispatch は既定ブランチにこのファイルがあるときだけ使える)。
# 約 5 分。e2e-ime.yml には組み込まない(共有ファイルを避けるため)。
on:
  push:
    branches: [ci/stt-compat-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stt-compat-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: ランナーの Windows の版
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $rows = @(
            "ProductName=$($cv.ProductName)",
            "EditionID=$($cv.EditionID)",
            "InstallationType=$($cv.InstallationType)",
            "CurrentBuild=$($cv.CurrentBuild).$($cv.UBR)",
            "ImageOS=$env:ImageOS",
            "ImageVersion=$env:ImageVersion"
          )
          $rows | ForEach-Object { Write-Host $_ }
          "## ランナーの Windows`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          ($rows | ForEach-Object { "- $_" }) | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: 音声デバイスの有無
        shell: pwsh
        run: |
          $out = @()
          $svc = Get-Service Audiosrv, AudioEndpointBuilder -ErrorAction SilentlyContinue | Select-Object Name, Status, StartType
          $out += "### サービス"
          $out += ($svc | Format-Table -AutoSize | Out-String)
          $ep = Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Select-Object Status, FriendlyName
          $out += "### AudioEndpoint ($(@($ep).Count) 件)"
          $out += ($ep | Format-Table -AutoSize | Out-String)
          $snd = Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue | Select-Object Name, Status, Manufacturer
          $out += "### Win32_SoundDevice ($(@($snd).Count) 件)"
          $out += ($snd | Format-Table -AutoSize | Out-String)
          $out | ForEach-Object { Write-Host $_ }
          "## 音声デバイス`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $out | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: 仮想音声デバイスの入手経路(入れずに調べるだけ)
        shell: pwsh
        continue-on-error: true
        run: |
          $out = @()
          foreach ($q in @('vb-cable', 'virtual-audio', 'vac', 'scream')) {
            $out += "### choco search $q"
            $out += (choco search $q --limit-output 2>&1 | Select-Object -First 8 | Out-String)
          }
          $out | ForEach-Object { Write-Host $_ }
          "## 仮想音声デバイスの候補(choco の検索のみ。入れてはいない)`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $out | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: 注入した Win+H で音声入力が出るか
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Kb {
            public static int LastError;
            [StructLayout(LayoutKind.Sequential)] public struct KEYBDINPUT { public ushort wVk; public ushort wScan; public uint dwFlags; public uint time; public IntPtr dwExtraInfo; }
            [StructLayout(LayoutKind.Sequential)] public struct MOUSEINPUT { public int dx; public int dy; public uint mouseData; public uint dwFlags; public uint time; public IntPtr dwExtraInfo; }
            [StructLayout(LayoutKind.Explicit)] public struct INPUT { [FieldOffset(0)] public uint type; [FieldOffset(8)] public MOUSEINPUT mi; [FieldOffset(8)] public KEYBDINPUT ki; }
            [DllImport("user32.dll", SetLastError=true)] public static extern uint SendInput(uint n, INPUT[] p, int cb);
            public static uint Key(ushort vk, bool up) {
              var i = new INPUT[1]; i[0].type = 1; i[0].ki.wVk = vk; i[0].ki.dwFlags = up ? 2u : 0u;
              uint r = SendInput(1, i, Marshal.SizeOf(typeof(INPUT)));
              if (r == 0) LastError = Marshal.GetLastWin32Error();
              return r;
            }
          }
          '@
          function Snapshot { Get-Process | Where-Object { $_.MainWindowTitle -ne '' -or $_.ProcessName -match 'TextInput|Voice|Speech|InputApp' } | Select-Object ProcessName, Id, MainWindowTitle | Sort-Object ProcessName }
          $before = Snapshot
          $r = @()
          $r += "LWIN down: $([Kb]::Key(0x5B, $false))"
          $r += "H down:    $([Kb]::Key(0x48, $false))"
          $r += "H up:      $([Kb]::Key(0x48, $true))"
          $r += "LWIN up:   $([Kb]::Key(0x5B, $true))"
          $r += "INPUT のサイズ(x64 は 40 が正): $([System.Runtime.InteropServices.Marshal]::SizeOf([Type]'Kb+INPUT'))"
          $r += "最後のエラー(0 は無し): $([Kb]::LastError)"
          Start-Sleep -Seconds 4
          $after = Snapshot
          $out = @('### SendInput の戻り値(1 なら OS が受け付けた)') + $r
          $out += '### 送信前のウィンドウ付きプロセス'
          $out += ($before | Format-Table -AutoSize | Out-String)
          $out += '### 送信 4 秒後'
          $out += ($after | Format-Table -AutoSize | Out-String)
          $names = @($before.ProcessName)
          $new = @($after | Where-Object { $names -notcontains $_.ProcessName })
          $out += "### 新しく現れたプロセス: $(@($new).Count) 件"
          $out += ($new | Format-Table -AutoSize | Out-String)
          $out | ForEach-Object { Write-Host $_ }
          "## 注入した Win+H`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $out | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: 注入した Win+H の対照つき観測(窓・画面・UI 要素)
        shell: powershell
        continue-on-error: true
        run: |
          .\tools\ci\stt-probe\winh-probe.ps1 -OutDir stt-probe-out
          Get-Content stt-probe-out\report.md -Encoding UTF8 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: 仮想音声デバイス(vb-cable)を入れて音声デバイスが見えるか
        shell: pwsh
        continue-on-error: true
        run: |
          $out = @()
          choco install vb-cable -y --no-progress 2>&1 | Select-Object -Last 25 | ForEach-Object { $out += "$_" }
          $d = 'C:\ProgramData\chocolatey\lib\vb-cable\tools'
          $out += "### 展開されたファイル"
          $out += (Get-ChildItem $d -Recurse -File | Select-Object -First 30 -ExpandProperty FullName | Out-String)
          # 署名者を信頼済みにして、ドライバ導入時の確認ダイアログを避ける
          $cat = Get-ChildItem $d -Recurse -Filter '*.cat' | Select-Object -First 1
          if ($cat) {
            $sig = Get-AuthenticodeSignature $cat.FullName
            $out += "cat=$($cat.Name) signature=$($sig.Status)"
            if ($sig.SignerCertificate) {
              $cer = Join-Path $env:TEMP 'vbaudio.cer'
              Export-Certificate -Cert $sig.SignerCertificate -FilePath $cer | Out-Null
              Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
              $out += "TrustedPublisher に署名者を追加: $($sig.SignerCertificate.Subject)"
            }
          }
          $setup = Get-ChildItem $d -Recurse -Filter 'VBCABLE_Setup_x64.exe' | Select-Object -First 1
          if ($setup) {
            $p = Start-Process $setup.FullName -ArgumentList '-i','-h' -Wait -PassThru -WorkingDirectory $setup.DirectoryName
            $out += "VBCABLE_Setup_x64.exe -i -h => exit $($p.ExitCode)"
          } else { $out += "VBCABLE_Setup_x64.exe が見つからない" }
          Start-Sleep -Seconds 10
          Restart-Service Audiosrv -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          $ep = Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Select-Object Status, FriendlyName
          $out += "### AudioEndpoint ($(@($ep).Count) 件)"
          $out += ($ep | Format-Table -AutoSize | Out-String)
          $snd = Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue | Select-Object Name, Status, Manufacturer
          $out += "### Win32_SoundDevice ($(@($snd).Count) 件)"
          $out += ($snd | Format-Table -AutoSize | Out-String)
          $out | ForEach-Object { Write-Host $_ }
          "## vb-cable のインストール`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $out | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: 画面と報告を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stt-probe-out
          path: stt-probe-out
          if-no-files-found: warn
          retention-days: 7
