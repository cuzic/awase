name: b4-msime-toggle-probe

# ADR-199 T17 Phase 4 の前提確認(B4): MS-IME 本体の KeyAssignmentMuhenkan/Henkan=2(IME-オン/オフ トグル)が
# 入力中・変換中・候補窓表示中・確定直後にどう動くかを windows-latest で測る。測定用ブランチ専用(develop へ入れない)。
#   phase0: 既定の割り当て(対照)で 無変換/変換 x 各状態のマトリクス(msime_native_composing_probe --matrix、awase なし)。
#   phase1: 値2の与え方の検証(設定アプリ UIA)。反映されたかは phase0 との差で見る。
#   phase3: awase の開閉観測(observed)件数を数える(ime_key_matrix_spike --seq、awase なし/あり)。
on:
  push:
    branches: [ci/b4-msime-toggle-probe]
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: b4-msime-toggle-probe
      - name: build
        shell: pwsh
        run: |
          cargo build -p awase-windows --bin awase --example msime_native_composing_probe --example msime_key_assignment_settings_probe --example ime_key_matrix_spike
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\debug\awase.exe dist\
          Copy-Item target\debug\examples\msime_native_composing_probe.exe dist\
          Copy-Item target\debug\examples\msime_key_assignment_settings_probe.exe dist\
          Copy-Item target\debug\examples\ime_key_matrix_spike.exe dist\
          Copy-Item config.toml dist\
          Copy-Item -Recurse layout dist\layout
      - name: 入力言語に ja-JP を追加して Microsoft IME を使えるようにする
        shell: pwsh
        run: |
          $msimeTip = '0411:{03B5835F-F03C-411B-9CE2-AA23E1171E36}{A76C93D9-5523-4E90-AAFA-4DB112F9AC76}'
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          Set-WinUserLanguageList -LanguageList $list -Force
          $tipKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{03B5835F-F03C-411B-9CE2-AA23E1171E36}'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt 60 -and -not (Test-Path $tipKey); $i++) { Start-Sleep -Seconds 5 }
          "TIP_REGISTERED=$(Test-Path $tipKey) after $([int]$sw.Elapsed.TotalSeconds)s"
          if (-not (Test-Path $tipKey)) {
            Add-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0' 2>&1 | Select-Object -Last 3
          }
          # ADR196-T2 の知見(PR #274 系): 既存リストへ ja-JP を足すだけだと en-US が既定のまま MS-IME がアクティブにならない。ja-JP のみ + MS-IME TIP にする。
          $only = New-WinUserLanguageList ja-JP
          $only[0].InputMethodTips.Clear()
          $only[0].InputMethodTips.Add($msimeTip)
          Set-WinUserLanguageList $only -Force
          try { Set-WinUILanguageOverride -Language ja-JP -ErrorAction Stop } catch { "UILanguageOverride FAILED: $($_.Exception.Message)" }
          try { Set-WinDefaultInputMethodOverride -InputTip $msimeTip -ErrorAction Stop } catch { "default input method override FAILED: $($_.Exception.Message)" }
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          "UICulture=$((Get-UICulture).Name) Culture=$((Get-Culture).Name)"
          "compat NoTsf3Override2=" + (Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Input\TSF\Tsf3Override\{03b5835f-f03c-411b-9ce2-aa23e1171e36}' -ErrorAction SilentlyContinue).NoTsf3Override2

      - name: phase0-control(既定の割り当て、awase なし)
        shell: pwsh
        run: |
          Push-Location dist
          .\msime_native_composing_probe.exe --matrix 2>&1 | Select-Object -Last 60
          Copy-Item msime_native_composing_probe_result.json ..\p1-control.json -ErrorAction SilentlyContinue
          Pop-Location

      # 英語UIのCIでは「Key & touch customization」ページに Key template と Touch keyboard しか無く、キーの割り当て
      # セクションが出ない(run 36541369039)。Key template の選択肢を列挙し、Microsoft IME 以外(Custom 等)へ切り替えて
      # 割り当てセクションが現れるかを調べ、出たら無変換/変換を IME-オン/オフ にする。UIA は .NET(Windows PowerShell 5.1)で操作する。
      - name: phase1(設定アプリの Key template を切り替えて割り当てセクションを出し、値2にする)
        continue-on-error: true
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $AE = [System.Windows.Automation.AutomationElement]
          $TS = [System.Windows.Automation.TreeScope]
          $TC = [System.Windows.Automation.Condition]::TrueCondition
          Get-Process SystemSettings -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process 'ms-settings:regionlanguage-jpnime'
          Start-Sleep -Seconds 10
          foreach ($w in $AE::RootElement.FindAll($TS::Children, $TC)) { "top: [$($w.Current.Name)] class=$($w.Current.ClassName) pid=$($w.Current.ProcessId)" }
          function Get-Win {
            # UWP 設定アプリの窓は ApplicationFrameHost 配下にあるので pid では引けない。Name が Settings の最上位窓のうち、子孫が最も多いものを使う。
            $c = New-Object System.Windows.Automation.PropertyCondition($AE::NameProperty, 'Settings')
            $best = $null; $bestN = 0
            foreach ($w in $AE::RootElement.FindAll($TS::Children, $c)) {
              $n = $w.FindAll($TS::Descendants, $TC).Count
              if ($n -gt $bestN) { $best = $w; $bestN = $n }
            }
            return $best
          }
          function Dump($tag) {
            $w = Get-Win
            if (-not $w) { "[$tag] no window"; return }
            $all = $w.FindAll($TS::Descendants, $TC)
            "[$tag] descendants=$($all.Count)"
            foreach ($e in $all) {
              $id = $e.Current.AutomationId; $n = $e.Current.Name
              if ($id -or $n) { "  [$tag] id=$id name=$n type=$($e.Current.ControlType.ProgrammaticName)" }
            }
          }
          function FindId($like) {
            $w = Get-Win
            if (-not $w) { return $null }
            foreach ($e in $w.FindAll($TS::Descendants, $TC)) { if ($e.Current.AutomationId -like $like) { return $e } }
            return $null
          }
          function ListItems {
            $r = @()
            foreach ($e in (Get-Win).FindAll($TS::Descendants, $TC)) { if ($e.Current.ControlType.ProgrammaticName -eq 'ControlType.ListItem') { $r += $e } }
            return $r
          }
          $kt = FindId '*KeyAndTouchCustomization*'
          if ($kt) { $kt.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); "invoked KeyAndTouchCustomization"; Start-Sleep -Seconds 3 } else { "KeyAndTouchCustomization not found" }
          Dump 'page'
          reg export 'HKCU\Software\Microsoft\IME' reg-before.reg /y | Out-Null
          reg export 'HKCU\Software\Microsoft\Input' reg-before-input.reg /y | Out-Null
          $k = Get-ItemProperty 'HKCU:\Software\Microsoft\IME\15.0\IMEJP\MSIME' -ErrorAction SilentlyContinue
          "registry: IsKeyAssignmentEnabled=$($k.IsKeyAssignmentEnabled) Muhenkan=$($k.KeyAssignmentMuhenkan) Henkan=$($k.KeyAssignmentHenkan) keystyle=$($k.keystyle)"
          $tg = FindId '*IsKeyAssignmentEnabled_ToggleSwitch*'
          if ($tg) {
            $tp = $tg.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)
            "master toggle state=$($tp.Current.ToggleState)"
            if ($tp.Current.ToggleState -ne 'On') { $tp.Toggle(); Start-Sleep -Seconds 2 }
            foreach ($which in 'Muhenkan', 'Henkan') {
              $cb = FindId "*KeyAssignment*$which*"
              if (-not $cb) { $cb = FindId "*$which*ComboBox*" }
              if ($cb) {
                "$which combo id=$($cb.Current.AutomationId)"
                $cb.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand()
                Start-Sleep -Seconds 1
                $its = ListItems
                "$which items: " + (($its | ForEach-Object { $_.Current.Name }) -join ' | ')
                $pick = $its | Where-Object { $_.Current.Name -match '^IME-|On.?/.?Off|toggle' } | Select-Object -First 1
                if ($pick) { "$which select: $($pick.Current.Name)"; $pick.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select(); Start-Sleep -Seconds 2 }
              } else { "$which combo not found" }
            }
          } else { "master toggle not found" }
          Dump 'final'
          reg export 'HKCU\Software\Microsoft\IME' reg-after.reg /y | Out-Null
          reg export 'HKCU\Software\Microsoft\Input' reg-after-input.reg /y | Out-Null
          "--- reg diff (IME) ---"
          Compare-Object (Get-Content reg-before.reg) (Get-Content reg-after.reg) | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
          "--- reg diff (Input) ---"
          Compare-Object (Get-Content reg-before-input.reg) (Get-Content reg-after-input.reg) | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
          $k = Get-ItemProperty 'HKCU:\Software\Microsoft\IME\15.0\IMEJP\MSIME' -ErrorAction SilentlyContinue
          "registry after: IsKeyAssignmentEnabled=$($k.IsKeyAssignmentEnabled) Muhenkan=$($k.KeyAssignmentMuhenkan) Henkan=$($k.KeyAssignmentHenkan) keystyle=$($k.keystyle)"
          Get-Process SystemSettings -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: phase1 の後のマトリクス(awase なし、値2が入っていれば差が見える)
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location dist
          .\msime_native_composing_probe.exe --matrix 2>&1 | Select-Object -Last 60
          Copy-Item msime_native_composing_probe_result.json ..\p1-uia.json -ErrorAction SilentlyContinue
          Pop-Location
          $k = Get-ItemProperty 'HKCU:\Software\Microsoft\IME\15.0\IMEJP\MSIME' -ErrorAction SilentlyContinue
          "registry now: IsKeyAssignmentEnabled=$($k.IsKeyAssignmentEnabled) Muhenkan=$($k.KeyAssignmentMuhenkan) Henkan=$($k.KeyAssignmentHenkan)"

      # phase3: awase の開閉観測(observed)を数える本命。ime_key_matrix_spike(既存の e2e ハーネス)の --seq で、
      # 手順 F2(開く) K(アイドル) K(直接入力から) A I(入力中) K Space(変換) K Enter(確定) K を、K=無変換(1D)/変換(1C)で。
      - name: "phase3(ime_key_matrix_spike の --seq。awase なし/あり x 無変換/変換)"
        continue-on-error: true
        shell: pwsh
        run: |
          [IO.File]::WriteAllText("$PWD\dist\cache.toml", "[imm_capability.`"ime_key_matrix_spike.exe`"]`r`nEdit = `"works`"`r`nRICHEDIT50W = `"works`"`r`n", (New-Object Text.UTF8Encoding($false)))
          $env:RUST_LOG = 'debug'
          $env:AWASE_TEST_INJECTION = '1'
          function Run-Seq($name, $seq, $withAwase) {
            Push-Location dist
            Remove-Item ime_key_matrix_spike.log, awase.log -ErrorAction SilentlyContinue
            Start-Process -FilePath .\ime_key_matrix_spike.exe -ArgumentList "--auto --hold=180 --activate-gji --msime --seq=$seq"
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              if ((Test-Path ime_key_matrix_spike.log) -and (Select-String -Path ime_key_matrix_spike.log -Pattern 'ROUND 2/2' -Quiet)) { break }
            }
            if ($withAwase) { Start-Process -FilePath "$PWD\awase.exe" -WorkingDirectory "$PWD" -RedirectStandardError "$PWD\..\awase-stderr.log" -RedirectStandardOutput "$PWD\..\awase-stdout.log" }
            $deadline = (Get-Date).AddSeconds(240)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if ((Test-Path ime_key_matrix_spike.log) -and (Select-String -Path ime_key_matrix_spike.log -Pattern '全手順完了' -Quiet)) { break }
            }
            Get-Process awase, ime_key_matrix_spike -ErrorAction SilentlyContinue | Stop-Process -Force
            Copy-Item ime_key_matrix_spike.log "..\p3-$name-spike.log" -ErrorAction SilentlyContinue
            if ($withAwase) { Copy-Item awase.log "..\p3-$name-awase.log" -ErrorAction SilentlyContinue }
            Pop-Location
            Start-Sleep -Seconds 3
          }
          foreach ($key in @(@('muhenkan', '1D'), @('henkan', '1C'))) {
            $k = $key[1]
            $seq = "F2,$k,$k,41,49,$k,20,$k,0D,$k"
            Run-Seq "$($key[0])-noawase" $seq $false
            Run-Seq "$($key[0])-awase" $seq $true
          }

      - name: summary
        if: always()
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          foreach ($p in 'p1-control','p1-uia') {
            if (Test-Path "$p.json") { python tools\e2e\ime_key_matrix\check_b4_toggle.py $p "$p.json" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY }
          }
          foreach ($n in 'muhenkan','henkan') {
            if (Test-Path "p3-$n-noawase-spike.log") { python tools\e2e\ime_key_matrix\check_b4_seq.py "p3-$n-noawase" "p3-$n-noawase-spike.log" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY }
            if (Test-Path "p3-$n-awase-spike.log") { python tools\e2e\ime_key_matrix\check_b4_seq.py "p3-$n-awase" "p3-$n-awase-spike.log" "p3-$n-awase-awase.log" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b4-logs
          path: |
            p1-*.json
            p3-*.log
            dist/*.log
            awase-std*.log
          retention-days: 7
