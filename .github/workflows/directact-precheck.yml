name: directact-precheck

# [ADR-293 実装前の確認] 1 回限りの検証(ci/directact-precheck)。awase は使わない。
# mozc-readable の exp/direct-actuation-channel(version 6、d49bd6b2e)の MSI を入れ、
#   A: PostMessage で開閉を要求 → Mozc が切り替えて ack を書くか(送信から ack までの時間も)
#   B: 入力中(未確定の「か」)に OFF にしたとき、直接 actuation と VK_IME_OFF で結果が同じか
# を tools/mozc_shm_ci/shmci.py directact で測る。結果を ADR-293 に書いたら、このワークフローを撤去する。

on:
  push:
    branches: [ci/directact-precheck]

permissions:
  contents: read
  actions: read

concurrency:
  group: directact-precheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mozc_shm_ci/shmci.py selftest

  measure:
    needs: [unit]
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 同じ手順を 2 つのランナーで回す(1 回だけの結果で等価性を判断しない)
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: mozc-readable の MSI(exp/direct-actuation-channel、d49bd6b2e の readable-build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42179370830 -R cuzic/mozc-readable -n Mozc64_x64.msi -D msi
          Get-ChildItem msi | Out-Host
      - name: 直接 actuation と入力中の OFF を測る
        shell: pwsh
        run: ./tools/mozc_shm_ci/run_scenario.ps1 -Scenario directact -Msi "${{ github.workspace }}\msi\Mozc64.msi" -OutDir out
      - name: 結果を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directact-${{ matrix.run }}
          path: out
          if-no-files-found: ignore
          retention-days: 7
