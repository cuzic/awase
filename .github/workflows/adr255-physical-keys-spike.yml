# (ADR-255 の延長、使い捨てのスパイク) ドライバ経由(スキャンコード→レイアウト変換を通る物理相当)の日本語キーの vk が、
# SendInput の vk 直接指定と違うか(BUG-131/132 の Down/Up 非対称が CI で再現できるか)を測る。
name: adr255-physical-keys-spike

on:
  push:
    branches: [ci/adr255-physical-keys-spike]
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        lang: [en-US, ja-JP]
        klid: ['00000411', '00000409']
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 入力言語を ja-JP にする(ja-JP の job だけ)
        if: matrix.lang == 'ja-JP'
        shell: pwsh
        run: |
          $list = Get-WinUserLanguageList
          $list.Add('ja-JP')
          Set-WinUserLanguageList -LanguageList $list -Force
          $tipKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{03B5835F-F03C-411B-9CE2-AA23E1171E36}'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $tipKey); $i++) { Start-Sleep -Seconds 5 }
          Write-Host "TIP_REGISTERED=$(Test-Path $tipKey)"
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Get-Process ctfmon -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Start-Process ctfmon.exe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: キーボードフィルタドライバを入れる
        shell: pwsh
        run: ./tools/kbd-inject-driver/install-driver.ps1

      - name: 日本語キーの Down/Up の vk を測る
        shell: pwsh
        timeout-minutes: 8
        env:
          PROBE_KLID: ${{ matrix.klid }}
        run: ./tools/kbd-inject-driver/layout-probe.ps1
