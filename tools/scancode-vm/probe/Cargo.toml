# WinPE の中で動かすキー記録アプリ(Raw Input でスキャンコードを記録する)。ワークスペースには入れない独立プロジェクト。
[package]
name = "scancode-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
