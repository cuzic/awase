[workspace]
members = [".", "crates/timed-fsm", "crates/win32-async", "crates/win32-worker", "crates/awase-windows", "crates/awase-windows-core", "crates/awase-windows-base", "crates/awase-hook-core", "crates/awase-windows-plans", "crates/awase-scancode", "crates/awase-bug-report", "crates/awase-linux", "crates/awase-macos", "crates/awase-settings", "crates/awase-settings-wgpu", "crates/awase-gji-config", "crates/awase-vkmap", "crates/awase-replay", "crates/awase-keymap-learn", "crates/awase-keymap-learn-win", "crates/awase-build-support", "crates/xtask-adr-evidence", "crates/measured-macro", "crates/actuation-choke-point-macro", "crates/e2e-uwp-inputsite-probe"]

# awase-settings が wgpu(Direct3D 12 / Vulkan) フォールバックを取り込んだこと
# （crates/awase-settings/src/startup_failure.rs）でリリースバイナリのサイズが
# 増えたための対策。コードレビュー指摘: 最初 [profile.release] に直接
# 書いていたが、それだと awase.exe（同時打鍵判定に ms 単位のタイミング精度が
# 要る低レベルキーボードフック、.claude/rules/tuning-constants.md 参照）の
# 通常のリリースビルドまで LTO 込みになり、開発中のリリースビルド反復
# （実測に基づく調整が頻繁に必要）が不必要に遅くなる。専用の名前付き
# プロファイルに分離し、CI/リリース手順では awase-settings のビルドにのみ
# `--profile settings-release` を使う（.github/workflows/{ci,release}.yml
# 参照。既定の "release" プロファイルは変更せず awase.exe 側の反復速度を
# 保つ）。`opt-level` はここでは変更しない — "s"/"z" のサイズ優先最適化は
# awase-settings 自体には副作用が薄いとはいえ、`inherits = "release"` の
# 対称性を崩さないため踏襲しない。`lto`/`codegen-units=1` は実行速度を
# 犠牲にせず（むしろクレート境界を跨いだインライン化で改善しうる）コード
# サイズだけを削れるため採用する。`strip` は MSVC ターゲットではデバッグ
# 情報がそもそも別ファイル(.pdb)に出るため効果は小さいが、無害なので含める。
[profile.settings-release]
inherits = "release"
lto = true
codegen-units = 1
strip = true

# core 系 crate(`tools/core-split/core-crates.txt` の crate と、殻の `awase-windows`)が共有する lints
# (ADR-274 段階 0 の 4)。以前は `awase-windows` と `awase-windows-core` の `[lints]` に同じ 25 行が複製されていた。
# core を複数の crate に分けると複製が増えてずれるので、ここへ寄せ、各 crate は `[lints] workspace = true` で使う。
# 他の crate(awase-settings・awase-keymap-learn など)は別の lints を持つので、この設定には参加しない。
[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
doc_markdown = "allow"
# `unreachable_pub` (Rust lint) と矛盾するため allow: pub(crate) モジュール内の pub(crate) アイテムは両方が矛盾して fire する
redundant_pub_crate = "allow"
# Win32 内部 API 関数の全エラーパスを文書化するのは不要
missing_errors_doc = "allow"
# Windows 状態管理構造体は bool フラグが多数必要
struct_excessive_bools = "allow"
# 行数制限はコンパイラ向けロジックで越えることがある
too_many_lines = "allow"
# 内部コンストラクタの bool パラメータ
fn_params_excessive_bools = "allow"
# I/O 統計の u64 → f64 変換は許容精度
cast_precision_loss = "allow"
# 1.96 で新たに const 化可能と判断されたが、依存先が const でないため個別対応より blanket allow が安全
missing_const_for_fn = "allow"

[workspace.metadata.dylint]
libraries = [
    { path = "lints/no_vk_as_scan" },
    { path = "lints/ime_event_guard" },
    { path = "lints/observation_source_guard" },
    { path = "lints/actuation_call_guard" },
]

[package]
name = "awase"
version = "2.2.0"
edition = "2021"
description = "A simultaneous-keystroke keyboard remapper for NICOLA thumb shift and beyond"
repository = "https://github.com/cuzic/awase"
license = "MIT OR Apache-2.0"

[lib]
name = "awase"
path = "src/lib.rs"

[dependencies]
toml = "0.8"
# ADR-201 決定3: 保存はコメント・未知キーを保つ toml_edit。toml 0.8 と同じ 0.22 系（Cargo.lock で共有）。
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
flate2 = "1"
timed-fsm = { path = "crates/timed-fsm", version = "0.5.0" }
smallvec = "1.15.1"
itertools = "0.13"
rustc-hash = "2"
strum = { version = "0.27", features = ["derive"] }
serde_ignored = "0.1"

[lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
# 最大限厳しい lint グループを有効化
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# cargo メタデータ関連は crates.io 公開時に対応する（現時点では不要）
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# 日本語コメントで誤検知するため無効化
doc_markdown = "allow"

[dev-dependencies]
proptest = "1.11.0"
