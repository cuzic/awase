# awase-windows-plans 用スコープ限定設定（ADR-274 段階 1: TSF とフォーカスの「計画」の核を別 crate にした）
#
# 使い方:
#   cargo mutants -p awase-windows-plans --config .cargo/mutants-awase-windows-plans.toml
#
# 理由は `.cargo/mutants-awase-hook-core.toml` と同じ（全ファイルが Linux でもコンパイルされ、examine_globs で名指しするのは
# 登録し忘れの検出のため。`test_package` にはこの crate より上の crate〔殻〕をすべて入れる）。
test_package = ["awase-windows-plans", "awase-windows"]

examine_globs = [
    "crates/awase-windows-plans/src/state/msaa_role_plan.rs",
    "crates/awase-windows-plans/src/state/focus_classify_plan.rs",
    "crates/awase-windows-plans/src/state/focus_resolve_plan.rs",
    "crates/awase-windows-plans/src/state/relay_plan.rs",
    "crates/awase-windows-plans/src/state/raw_recovery_plan.rs",
    "crates/awase-windows-plans/src/state/paced_queue.rs",
    "crates/awase-windows-plans/src/state/deferred_gate_plan.rs",
    "crates/awase-windows-plans/src/state/warm_send_plan.rs",
]

exclude_re = [
    # msime_key_assignment.rs: `windows_impl` モジュール全体が #[cfg(windows)]。
    # Linux ではこのモジュール自体が存在しないため、中の関数（レジストリ読み取り・
    # ポップアップ表示など実 Win32 呼び出し）への変異は常に false MISSED になる。
    # ロジックの実体は同ファイルの `conflict_warning`（cfg 無し）に集約済みで、
    # そちらは examine_globs の対象としてテスト済み。
    "windows_impl::",

    # conv_mode.rs: on_focus_changed は関数全体が #[cfg(windows)]。
    "ConvModeMgr::on_focus_changed",

    # conv_mode.rs: update_from_conv 内の HanKata→ZenKata ダウングレード抑制判定
    # （147/148/152 行）だけが #[cfg(windows)] のインラインブロック。同じ関数の
    # 他の分岐（142 行目の old == Some(new) 等）は cfg 無しで実際にテスト対象。
    "conv_mode\\.rs:(147|148|152):",

    # conv_mode.rs: ConvModeTarget::imm_conv_value の variant は HalfWidthAlnum（→ 0）だけなので、
    # 「0 を返す」変異は元のコードと同じ値を返す等価変異（ADR-234 D0）。variant を足したら
    # この除外は外すこと（足した variant の値を 0 にする変異もこの正規表現に当たり、黙って除外される）。
    "ConvModeTarget::imm_conv_value -> u32 with 0$",

    # observation_store.rs: trace_hwnd_only_mismatch は derive_filtered の識別照合で
    # 「hwnd だけ不一致」を tracing::debug! に出すだけの関数で、判定に関わらない（ADR-234 D0。
    # run 35920696097 の derive_filtered 822〜824 行の 4 件をこの関数へ切り出した）。
    "trace_hwnd_only_mismatch",
]
