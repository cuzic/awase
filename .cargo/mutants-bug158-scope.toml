# ADR-194ハーネス破棄の再挑戦条件検証(2026-09-22)用の一時スコープ設定。
#
# 対象は「純粋な決定関数を、シミュレーションハーネスなしの決定表的な直接
# 単体テストでどれだけ網羅できているか」を測りたい4ファイルのみ:
#   - state/force_guard.rs   (should_drop_intents_for_mode_key_pass 等、BUG-158)
#   - state/mode_key_pass.rs (ModeKeyPassLatch、ADR-194決定1で抽出)
#   - state/drift.rs         (check_drift_correction、ADR-194決定1で抽出)
#   - state/refresh_plan.rs  (next_refresh_ms/decide_imm_capability、同上)
#
# いずれもfeat/ime-sim-harness限定(develop未マージ)のファイル。
# 役目(検証)が終わったらこのファイルとワークフローごと削除してよい。
#
# examples/*.rs(windows crate依存、非cfg(windows))は、GitHub-hosted
# ubuntu-latestではbaseline・各mutant試験どちらのビルドでもE0433になり
# 全mutantsがunviableになる(2026-09-22/23に複数回実測)。ワークフロー
# (mutants-scope-investigation.yml)側をwindows-latestへ切り替えたことで
# examplesが普通にビルドできるようになったため、--baseline skipや--libでの
# 絞り込みは不要になった(2026-09-23)。

examine_globs = [
    "crates/awase-windows/src/state/force_guard.rs",
    "crates/awase-windows/src/state/mode_key_pass.rs",
    "crates/awase-windows/src/state/drift.rs",
    "crates/awase-windows/src/state/refresh_plan.rs",
]

# ビルドが数十秒かかることがあるため、自動タイムアウト推定が短すぎて
# false MISSED になるのを防ぐ下限(.cargo/mutants.tomlと同じ理由)。
minimum_test_timeout = 30

# 等価変異体（equivalent mutant）: docs/tasks/mode-key-pass-latch-mutation-coverage.md
# のやること4で追加したテスト群を反映して2026-09-23にwindows-latestで再実行
# (run 35819375184)した結果、22件中この1件だけがmissedのまま残った。
#
# ModeKeyPassLatch::drop_decision の `if first || (align && !mark.aligned) {`
# の内側`&&`を`||`に変異させたもの。このif式に到達するのは常に
# `first == true`（このとき`align`は`first || !has_last_intent`で常にtrueに
# なり、mutant/originalどちらの条件も`first ||`の短絡で一致する）か、
# `first == false`かつ`align && !mark.aligned`がtrue（=align=true かつ
# mark.aligned=false）の場合だけ——後者はmutantの`align || !mark.aligned`も
# 同じtrueを返す。mutantとoriginalが分岐しうるのは`first=false`のときの
# (align, mark.aligned) = (true,true) と (false,false) の2通りのみだが、
# どちらもブロック内で再計算される`aligned`フィールド
# (`mark.aligned || (align && !on_expiry)`)が「ブロックを実行してもしなくても
# 同じ値」になる（前者はmark.aligned=trueが再計算結果を支配し、後者は
# align=falseが`align && !on_expiry`をfalseに固定するため）。invalidated等
# 他フィールドも`first=false`である以上既に確定済みの値のままなので、
# ModeKeyPassLatchの公開メソッド経由で観測できる限り、この変異はどんな入力
# 列でも元コードと区別不可能（数学的に等価）と判断した。
exclude_re = [
    "mode_key_pass\\.rs:158:28: replace && with \\|\\|",
]
