# cargo-audit 設定 (https://github.com/rustsec/rustsec/tree/main/cargo-audit)
#
# 以下は調査済みでビルド時専用の依存であることを確認した advisory のみを対象に
# ignore している。実行時に配布バイナリ(awase.exe / awase-settings.exe)へ
# 露出する脆弱性を無条件に隠すためのファイルではない。新規advisoryが増えたら
# まず `cargo audit` の素の出力と `cargo tree -i <crate>` で経路を確認し、
# 実行時経路であればここに追加せず対応すること。

[advisories]
ignore = [
    # quick-xml 0.30.0: awase-settings(GUI) -> eframe -> accesskit_winit ->
    # accesskit_unix(Linux/unixアクセシビリティ限定) -> atspi-common ->
    # zbus-lockstep -> zbus_xml が依存。zbus_xml内でのXMLパース用途で、
    # awase自体の実行時ロジックはこの経路を一切呼ばない。Windows配布物
    # (release.yml が配布する awase.exe/awase-settings.exe)には含まれない
    # (Linux/unixターゲットのみでリンクされる)。
    # 2026-07-26 調査、2026-10 頃に eframe/egui/accesskit系の更新で
    # quick-xml >=0.41.0 に収束していないか再確認すること。
    "RUSTSEC-2026-0194", # quick-xml: 属性重複チェックの二次時間
    "RUSTSEC-2026-0195", # quick-xml: NsReaderの無制限確保によるDoS

    # paste 1.0.15 / ttf-parser 0.25.1: unmaintained警告。どちらも推移的依存
    # (paste は複数のproc-macro経由、ttf-parser は egui/eframe のフォント
    # 処理系経由)で、直接依存の更新では解消できない。脆弱性ではなく
    # メンテナンス状況の警告のため許容する。
    "RUSTSEC-2024-0436", # paste: 開発終了
    "RUSTSEC-2026-0192",  # ttf-parser: 開発終了
]
