[general]
simultaneous_threshold_ms = 100
engine_toggle_hotkey = "Ctrl+Shift+F12"
layouts_dir = "layout"
default_layout = "nicola_keytop.yab"

# confirm_mode = "wait"  # wait / ngram_predictive（旧 speculative / two_phase / adaptive_timing は wait 扱い）
# speculative_delay_ms = 30

# n-gram コーパスファイル（実行ファイルからの相対パス）。
# 同時打鍵 3 鍵仲裁（例: 「よかった」の「か」と「ん」のどちらに右親指が
# 帰属するか）を頻度モデルで判定するために使用する。設定しない場合は
# 純粋なタイミング比較 (d1 < d2) のみで判定するため、誤判定が増える。
ngram_file = "data/ngram_hiragana.csv.gz"
# ngram_adjustment_range_ms = 20
# ngram_min_threshold_ms = 30
# ngram_max_threshold_ms = 120

# キーバインディング設定
# example-begin: config-keys-engine uncomment
# [keys]
# 親指シフト入力／ローマ字入力 切替キー（複数指定可、デフォルト: Ctrl+Shift+変換で親指シフト入力、Ctrl+Shift+無変換でローマ字入力）
# engine_on = ["Ctrl+Shift+Convert"]
# engine_off = ["Ctrl+Shift+Nonconvert"]
# example-end

# IME 検出設定（シャドウ IME 状態追跡用キー定義）
# example-begin: config-ime-detect uncomment
# [keys.ime_detect]
# 注意: toggle に書いたキーを keys.ime_toggle（awase が能動的に処理する側）にも書くと二重処理で
# そのキーが壊れるため、同じキーを両方に書かないこと（keys.ime_toggle の既定は空）。
# toggle = ["VK_KANJI"]
# 既定は toggle/on/off すべて空（VK_IME_ON/VK_IME_OFF＝IMEオン/IMEオフ キーの追随は指定なしで自動）。
# on = ["VK_DBE_DBCSCHAR", "VK_IME_ON"]
# off = ["VK_DBE_SBCSCHAR", "VK_IME_OFF"]
# example-end

# フォーカス判定の永続オーバーライド
# 特定の (プロセス名, クラス名) の組み合わせに対して、
# 自動判定を無視してテキスト入力 / 非テキストを強制する。
# example-begin: config-app-overrides uncomment
# [app_overrides]
# force_text = [
#     { process = "chrome.exe", class = "Chrome_RenderWidgetHostHWND" },
# ]
# force_bypass = [
#     { process = "explorer.exe", class = "CabinetWClass" },
# ]
# example-end

# ローマ字出力を VK キーストローク経由で送るアプリの明示指定。
# Chrome/Edge/Electron 等 IME composition を VK 経由でないと扱えないアプリ向け。
# Win32 モード（Unicode 直接注入）がデフォルトで動作する。
#
# force_tsf: VK Sequential モード（WezTerm 等 TSF 直結アプリ）
#   IME composition + 漢字変換を有効にする。NICOLA フックはスルーして
#   WezTerm の TSF に通常のキーストロークとして届ける。
[app_overrides]
force_tsf = [
    { process = "wezterm-gui.exe", class = "org.wezfurlong.wezterm" },
    { process = "WindowsTerminal.exe", class = "CASCADIA_HOSTING_WINDOW_CLASS" },
]
# force_vk = [
#     { process = "chrome.exe", class = "Chrome_WidgetWin_1" },
# ]

# Ctrl+key バイパス直後に次キーを NICOLA スキップするルール。
#
# 【tmux ユーザー向け】
# IME ON のまま tmux を操作するときに役立つ設定。
#
# tmux の prefix キーを Ctrl+J に設定している場合（set -g prefix C-j）、
# Ctrl+J の直後に押すコマンドキー（n=次ウィンドウ、p=前ウィンドウ など）が
# NICOLA エンジンに横取りされてしまい、tmux 操作ができない問題が起きる。
# この設定を有効にすると、Ctrl+J の直後の 1 キーだけ NICOLA をスキップして
# そのまま WezTerm / Windows Terminal に届けるため、日本語入力を切らずに
# tmux のウィンドウ切り替えやペイン操作が行えるようになる。
#
# key     : バイパストリガー（Ctrl+key 形式で指定）
# process : プロセス名フィルタ（省略=全アプリ、部分一致、大文字小文字無視）
# class   : ウィンドウクラスフィルタ（省略=全クラス、部分一致）
#
# example-begin: config-post-bypass uncomment
# [[post_bypass]]
# key = "Ctrl+J"
# process = "WindowsTerminal"   # Windows Terminal (wt.exe) でのみ有効
# example-end

# 診断・自己修復系のキルスイッチ（issue #165）。既定で全て有効。
# example-begin: config-diagnostics uncomment
# [diagnostics]
# hook_self_heal = true  # hook_starved 検知時にキーボードフックを自己修復する
# example-end

# 窓切替直後・長い無操作のあとの日本語入力の判定（ADR-263、上級者向け。設定画面の「上級者向け設定」タブからも変更できる）。
# mode: "off"（無効）/ "observe"（既定。判定をジャーナルに記録するだけで、キー入力の挙動は変わらない）/
#       "ime_on"（一太郎など窓内の IME 状態が読めない窓で、最初の数打鍵を最大 max_ms だけ保持し、親指シフトで
#       打っていると判定できたときだけ、ひらがなキーを 1 回送ってから保持した打鍵を流す。実機での確認前の機能）/
#       "ime_on_eisu"（ime_on に加えて、英数と判定したら半角英数トグル（左Shift単独タップと同じ。IME は ON のまま）に入る。半角英数トグルが
#       有効な設定のときだけ働く。誤判定しても Shift のタップで戻れる。利用者の責任）
# [auto_detect]
# mode = "observe"
# scope = "unobserved"    # ime_on の対象の窓。"unobserved"（IME の状態が読めない窓だけ。既定）/ "all"（読める窓も。利用者の責任）
# idle_ms = 3000          # この時間以上の無操作のあとの最初の打鍵でも判定を始める（窓切替でも始まる）
# max_ms = 2500           # 打鍵を保持する最大の時間
# max_keys = 7            # 判定に使う最大の打鍵数
# ja_threshold = 4.0      # 日本語と確定する確信度（対数尤度比）。親指と文字キーの重なりは無条件で日本語
# en_threshold = 8.0      # 日本語でないと判断して早く流す確信度
# eisu_threshold = 14.0    # mode = "ime_on_eisu" で 半角英数に入るために必要な『日本語でない』確信度（大きいほど誤って入る率が下がるが判定が遅い）
# include_apps = []       # 対象にするプロセス名（空=すべて）。例: ["taro36.exe"]
# exclude_apps = []       # 対象外にするプロセス名
